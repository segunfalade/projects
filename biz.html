/* -------------------------------------------------- delimited-text parser -- */
function splitDelimited(line, d) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === d) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function detectDelimiter(line) {
  let best = ",", bestN = 1;
  [",", ";", "\t", "|"].forEach(d => {
    const n = splitDelimited(line, d).length;
    if (n > bestN) { bestN = n; best = d; }
  });
  return best;
}
function parseDelimited(text) {
  const lines = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
  if (!lines.length) return { header: [], rows: [], delim: "," };
  const delim = detectDelimiter(lines[0]);
  const header = splitDelimited(lines[0], delim).map(h => String(h).trim().toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitDelimited(lines[i], delim);
    const obj = {};
    header.forEach((h, j) => { obj[h] = String(cells[j] === undefined ? "" : cells[j]).trim(); });
    rows.push(obj);
  }
  return { header: header, rows: rows, delim: delim };
}

/* ------------------------------------------------------- row normalisation -- */
function normaliseKey(k) {
  const key = String(k).trim().toLowerCase().replace(/[_-]+/g, " ");
  for (const field in BULK_MAP) if (BULK_MAP[field].indexOf(key) >= 0) return field;
  return null;
}
function normUrl(s) {
  return String(s || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/+$/, "");
}
function normName(s) { return String(s || "").trim().toLowerCase().replace(/\s+/g, " "); }
function parseLooseDate(s) {
  s = String(s || "").trim();
  if (!s) return "";
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if (m) return m[1] + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[3]).padStart(2, "0");
  m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(s);   // day/month/year
  if (m) return m[3] + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[1]).padStart(2, "0");
  m = /^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/.exec(s);  // 15 Nov 2026
  if (m) {
    const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
    const mi = months.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mi >= 0) return m[3] + "-" + String(mi + 1).padStart(2, "0") + "-" + String(m[1]).padStart(2, "0");
  }
  return "";
}
/* Turns raw spreadsheet rows into validated prospect records. */
function mapBulkRows(rawRows) {
  const pipeline = (S.settings.pipeline && S.settings.pipeline.length) ? S.settings.pipeline : STAGES_DEFAULT;
  const out = rawRows.map((raw, i) => {
    const data = {};
    const ignored = [];
    Object.keys(raw).forEach(k => {
      const field = normaliseKey(k);
      if (!field) { if (String(raw[k]).trim()) ignored.push(k); return; }
      if (data[field] === undefined || !data[field]) data[field] = raw[k];
    });
    const row = { index: i, data: {}, problems: [], dup: null, ignored: ignored, raw: raw };
    ["name", "company", "email", "website", "profile", "industry", "role", "why", "problem",
     "observations", "offerFit", "nextAction"].forEach(f => { row.data[f] = String(data[f] || "").trim(); });
    row.data.tags = String(data.tags || "").split(/[,;]/).map(t => t.trim()).filter(Boolean);
    // stage
    let stage = String(data.stage || "").trim();
    if (stage && pipeline.indexOf(stage) < 0) {
      const alt = pipeline.filter(s => s.toLowerCase() === stage.toLowerCase())[0];
      if (alt) stage = alt;
      else { row.problems.push('Unknown stage "' + stage + '" — will use ' + pipeline[0]); stage = pipeline[0]; }
    }
    row.data.stage = stage || pipeline[0];
    // date
    const d = String(data.nextActionDate || "").trim();
    if (d) {
      const iso = parseLooseDate(d);
      if (iso) row.data.nextActionDate = iso;
      else { row.problems.push('Could not read the date "' + d + '"'); row.data.nextActionDate = ""; }
    } else row.data.nextActionDate = "";
    // email sanity (warning only)
    if (row.data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(row.data.email)) row.problems.push("Email looks unusual");
    // required
    if (!row.data.name && !row.data.company) row.problems.push("Needs a name or a company");
    // duplicates
    const w = normUrl(row.data.website);
    const nc = normName(row.data.company);
    row.dup = S.prospects.filter(p => (w && normUrl(p.website) === w) ||
      (row.data.name && nc && normName(p.name) === normName(row.data.name) && normName(p.company) === nc))[0] || null;
    row.ok = !row.problems.some(p => /Needs a name/.test(p));
    return row;
  });
  return out;
}
function parseBulkInput(text) {
  const t = String(text || "").trim();
  if (!t) return { rows: [], error: "" };
  if (t[0] === "[" || t[0] === "{") {
    try {
      const j = JSON.parse(t);
      const arr = Array.isArray(j) ? j : (Array.isArray(j.prospects) ? j.prospects : [j]);
      if (!arr.length) return { rows: [], error: "That JSON contains no prospect rows." };
      return { rows: mapBulkRows(arr), format: "JSON" };
    } catch (e) {
      return { rows: [], error: "That JSON could not be read: " + (e && e.message ? e.message : "parse error") };
    }
  }
  const parsed = parseDelimited(t);
  if (!parsed.rows.length) return { rows: [], error: "No data rows found — include a header line, then one row per prospect." };
  const known = parsed.header.map(normaliseKey).filter(Boolean);
  if (!known.length) return { rows: [], error: "No recognised columns. The first line must be a header with at least one of: name, company, email, website." };
  return { rows: mapBulkRows(parsed.rows), format: parsed.delim === "\t" ? "tab-separated" : "CSV", header: parsed.header };
}
function bulkCounts(rows) {
  const c = { total: rows.length, add: 0, dup: 0, bad: 0, warn: 0 };
  rows.forEach(r => {
    if (!r.ok) c.bad++;
    else if (r.dup) c.dup++;
    else c.add++;
    if (r.ok && r.problems.length) c.warn++;
  });
  return c;
}

      actionLabel: "Save your first swipe", act: "new-swipe", actionIcon: "plus"
    });
  } else if (!arr.length) {
    html += '<div class="empty"><h3>Nothing matches</h3><p>Try another filter or clear the search.</p>' +
      '<button class="btn subtle" data-act="clear-filters" data-view="' + v + '">Reset filters</button></div>';
  } else {
    html += '<div class="list">' + arr.map(s => {

        '<div class="rec-title">' + icon("quote", 14) + esc(truncate(s.title || copy, 90)) +
          (s.sample ? ' <span class="badge info">sample</span>' : "") + "</div>" +
        '<div class="rec-meta">' + badge(s.type, "purple") + (s.channel && s.channel !== "Other" ? badge(s.channel, "neutral") : "") +
          (s.rating && s.rating !== "Not rated" ? badge(s.rating, s.rating === "Study this" || s.rating === "Swipe-worthy" ? "accent" : "neutral") : "") +
          (s.source ? "<span>· " + esc(truncate(s.source, 46)) + "</span>" : "") +
          (s.date ? "<span>· " + esc(fmtDateShort(s.date)) + "</span>" : "") + "</div>" +
        (copy ? '<div class="swipe-copy' + (long ? " clamp" : "") + '">' + esc(long ? copy.slice(0, 420) : copy) + "</div>" : "") +
        (s.why ? '<div class="swipe-why">' + esc(truncate(s.why, 190)) + "</div>" : "") +
        '<div class="rec-foot">' + (s.tags || []).slice(0, 4).map(t => '<span class="tag">' + esc(t) + "</span>").join("") +
          (s.links || []).slice(0, 2).map(l => typeChip(l.type, l.id)).join("") +
          (copy ? '<button class="btn xs subtle" data-act="copy-swipe" data-id="' + esc(s.id) + '">' + icon("copy", 12) + " Copy text</button>" : "") +

};

function renderAll() { renderNav(); renderCurrentView(); if (drawerRec) renderDrawer(); }
function renderCurrentView() {
  const host = $("#view");

  } catch (err) {
    console.error("Render error in " + UI.view, err);
    host.innerHTML = '<div class="banner danger">' + icon("alert", 16) +
      '<div class="grow"><strong>Something went wrong rendering this view.</strong> Your data is safe — try another workspace, or export a backup. ' +
      '<span class="mono">' + esc(err && err.message ? err.message : String(err)) + "</span></div></div>";
  }
  renderNav();
  if (UI.restoreFocus) {
    const el = host.querySelector(UI.restoreFocus.sel);
    if (el) {
      el.focus();
      try { el.setSelectionRange(UI.restoreFocus.pos, UI.restoreFocus.pos); } catch (e) { /* not a text input */ }
    }
    UI.restoreFocus = null;
  }
}
function route(view, opts) {
  opts = opts || {};
  if (!VIEWS[view]) view = "command";
  UI.view = view;
  if (opts.x) {
    if (view === "prospects") { UI.filters.prospects = UI.filters.prospects || {}; UI.filters.prospects.view = opts.x; }
    if (view === "tasks") { UI.filters.tasks = UI.filters.tasks || {}; UI.filters.tasks.tab = opts.x; }
    if (view === "insights") { UI.filters.insights = UI.filters.insights || {}; UI.filters.insights.status = opts.x; }
    if (view === "strategy") { UI.filters.strategy = UI.filters.strategy || {}; UI.filters.strategy.status = "Active"; }
  }
  if (location.hash !== "#/" + view) {
    try { history.replaceState(null, "", "#/" + view); } catch (e) { location.hash = "#/" + view; }
  }
  renderCurrentView();
  renderNav();
  $("#sidebar").classList.remove("open");
  window.scrollTo(0, 0);
  try { $("#view").focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}

function createRecord(type, patch) {

}
function openNewRecord(type, patch) {

}
function deleteRecord(type, id) {
  const arr = S[COLL[type].key];
  const i = arr.findIndex(r => r.id === id);
  if (i < 0) return null;
  const rec = arr.splice(i, 1)[0];
  TYPES.forEach(t => S[COLL[t].key].forEach(r => {
    if (r.links && r.links.length) r.links = r.links.filter(l => !(l.type === type && l.id === id));
  }));
  return rec;
}
function quickAddTask(title, linkTo) {

  S.tasks.unshift(t);

}

/* --------------------------------------------------------- quick capture --- */
/* The fastest way to get something into the system: two or three fields, then
   "save and add another". Every other field is one click away inside the record. */
const QC_KINDS = [
  { type: "insight", label: "Observation", icon: "bulb" },
  { type: "prospect", label: "Prospect", icon: "users" },
  { type: "task", label: "Task", icon: "check" },
  { type: "swipe", label: "Swipe", icon: "quote" }
];
function openQuickCapture(kind, preset) {
  const k = COLL[kind] ? kind : "insight";
  function buildDraft() { return Object.assign(newRecord(k), preset || {}); }
  let draft = buildDraft();
  const extra = COLL[k].fields.filter(f => !f.sep && !f.core).length;
  const body =
    '<div class="qc-kinds">' + QC_KINDS.map(q =>
      '<button class="qc-kind' + (q.type === k ? " on" : "") + '" data-act="qc-kind" data-val="' + q.type + '">' +
      icon(q.icon, 13) + esc(q.label) + "</button>").join("") + "</div>" +
    '<div class="fields">' + COLL[k].quick.map(key => {
      const f = findDef(k, key);
      return f ? fieldHTML(f, draft) : "";
    }).join("") + "</div>" +
    '<div class="qc-note">' + icon("spark", 12) + " That is enough to save it. Open the record afterwards for the other " +
      extra + " field" + plural(extra, "", "s") + " — they stay out of the way until you need them.</div>";
  function collect() {
    const rec = Object.assign(newRecord(k), preset || {});
    let missing = null;
    COLL[k].quick.forEach(key => {
      const f = findDef(k, key);
      if (!f) return;
      const el = document.querySelector('#modalRoot [data-field="' + f.k + '"]');
      if (!el) return;
      rec[f.k] = readField(f, el);
      if (f.req && !String(rec[f.k] || "").trim()) missing = missing || f.label;
    });
    if (k === "prospect" && !String(rec.name || "").trim() && !String(rec.company || "").trim()) missing = "a name or a company";
    return { rec: rec, missing: missing };
  }
  function save(andAgain) {
    const got = collect();
    if (got.missing) {
      toast("Add " + got.missing + " first", "err");
      const el = document.querySelector("#modalRoot [data-field]");
      if (el) el.focus();
      return;
    }
    if (k === "prospect" && !got.rec.stage) got.rec.stage = S.settings.pipeline[0];
    S[COLL[k].key].unshift(got.rec);
    markDirty(true);
    if (andAgain) {
      draft = buildDraft();
      openQuickCapture(k, preset);
      setTimeout(() => { const el = document.querySelector("#modalRoot [data-field]"); if (el) el.focus(); }, 60);
      toast(COLL[k].label + " saved — add the next one", "ok", 1600);
      return;
    }
    closeModal();
    renderAll();
    openRecord(k, got.rec.id);
    toast(COLL[k].label + " saved", "ok");
  }
  openModal({
    title: "Quick capture — " + COLL[k].label.toLowerCase(),
    body: body,
    buttons: [
      { label: "Cancel", cls: "subtle", onClick: () => closeModal() },
      { label: "Save & add another", cls: "subtle", onClick: () => save(true) },
      { label: "Save & open", cls: "primary", onClick: () => save(false) }
    ]
  });
  setTimeout(() => {
    const el = document.querySelector("#modalRoot [data-field]");
    if (el) el.focus();
    const root = $("#modalRoot");
    if (root) root.addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target && e.target.tagName !== "TEXTAREA") { e.preventDefault(); save(false); }
    });
  }, 40);
}

/* -------------------------------------------------------- global search -- */
function openSearch() {
  let results = [];
  let sel = 0;
  openModal({
    title: false,
    body: '<div class="field"><input class="input" id="palQ" data-autofocus placeholder="Search insights, prospects, offers, plans, tasks, reviews, decisions…" style="font-size:15px;padding:10px 12px"></div>' +
      '<div id="palList" class="palette-list"></div>' +
      '<div class="tiny faint" style="margin-top:10px">↑ ↓ to move · Enter to open · Esc to close</div>',
    buttons: [{ label: "Close", cls: "subtle", onClick: () => closeModal() }]
  });
  const input = $("#palQ");
  function score(it, q) {
    const title = slug(it.title), sub = slug(it.sub);
    const blob = slug([it.title, it.sub, it.rec.notes, it.rec.description, it.rec.summary, it.rec.why, it.rec.observations,
      it.rec.company, it.rec.decision, it.rec.learned, it.rec.evidence, it.rec.message,
      (it.rec.tags || []).join(" "), it.rec.category, it.rec.industry, it.rec.audience, it.rec.outcome].filter(Boolean).join(" "));
    if (!q) return 1;
    if (title.indexOf(q) === 0) return 100;
    if (title.indexOf(q) >= 0) return 60;
    if (sub.indexOf(q) >= 0) return 40;
    if (blob.indexOf(q) >= 0) return 10;
    return 0;
  }
  function run(q) {
    q = slug(q);
    results = allRecords().map(it => ({ it: it, s: score(it, q) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || String(b.it.rec.updatedAt).localeCompare(String(a.it.rec.updatedAt)))
      .slice(0, 40).map(x => x.it);
    sel = 0;
    draw();
  }
  function draw() {
    const box = $("#palList");
    if (!box) return;
    if (!results.length) { box.innerHTML = '<div class="empty" style="padding:18px"><p>Nothing matches. Try a shorter word, or a company name.</p></div>'; return; }
    let lastType = null, html = "";
    results.forEach((it, i) => {
      if (it.type !== lastType) { html += '<div class="pal-group">' + esc(COLL[it.type].plural) + "</div>"; lastType = it.type; }
      html += '<div class="pal-item' + (i === sel ? " sel" : "") + '" data-pal="' + i + '">' +
        icon(TYPE_ICON[it.type], 15) +
        '<span class="grow" style="min-width:0"><span class="t">' + esc(truncate(it.title, 70)) + '</span><br><span class="s">' + esc(truncate(it.sub, 72)) + "</span></span>" +
        (it.rec.sample ? '<span class="badge info">sample</span>' : "") + "</div>";
    });
    box.innerHTML = html;
    const el = box.querySelector(".pal-item.sel");
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }
  input.addEventListener("input", e => run(e.target.value));
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = clamp(sel + 1, 0, results.length - 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = clamp(sel - 1, 0, results.length - 1); draw(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const it = results[sel];
      if (it) { closeModal(); openRecord(it.type, it.rec.id); }
    }
  });
  $("#palList").addEventListener("click", e => {
    const el = e.target.closest("[data-pal]");
    if (!el) return;
    const it = results[Number(el.getAttribute("data-pal"))];
    if (it) { closeModal(); openRecord(it.type, it.rec.id); }
  });
  run("");
}

function doImport() { $("#importFile").click(); }
function handleImportFile(file) {
  if (!file) return;
  if (file.size > MAX_BACKUP_BYTES) { toast("That file is too large to be a Copywriter OS backup", "err", 6000); return; }
  const reader = new FileReader();
  reader.onerror = () => toast("Could not read that file", "err");
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(String(reader.result)); }
    catch (e) { toast("That file is not valid JSON", "err", 5000); return; }
    const check = validateBackup(obj);
    if (!check.ok) {
      openModal({
        title: "This backup cannot be imported",
        body: '<div class="banner danger">' + icon("alert", 16) + '<div class="grow"><strong>Nothing has been changed.</strong></div></div>' +
          "<ul class=\"small\" style=\"margin:10px 0 0;padding-left:18px\">" + check.errors.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul>",
        buttons: [{ label: "Close", cls: "subtle", onClick: () => closeModal() }]
      });
      return;
    }
    const d = check.data;
    const summary = TYPES.filter(t => check.counts[t]).map(t => "<li>" + esc(COLL[t].plural) + ": <b>" + check.counts[t] + "</b></li>").join("") || "<li>No records found</li>";
    openModal({
      title: "Import backup",
      wide: true,
      body: '<div class="small muted" style="margin-bottom:10px">File: <b>' + esc(file.name) + "</b> · " +
        (d.meta && d.meta.exportedAt ? "exported " + esc(fmtDate(d.meta.exportedAt)) : "") +
        (obj.schemaVersion ? " · schema " + esc(obj.schemaVersion) : "") + "</div>" +
        '<div class="card card-pad" style="background:var(--surface-2);margin-bottom:14px"><div class="tiny faint" style="margin-bottom:6px">CONTENTS</div><ul class="small" style="margin:0;padding-left:18px">' + summary + "</ul></div>" +
        '<div class="field"><label>How should this be imported?</label>' +
          '<label class="check" style="margin-bottom:6px"><input type="radio" name="impmode" value="merge" checked><span><b>Merge</b> — add these records to what I already have. Existing records are kept unless the imported copy is newer. Settings and pipeline stages stay as they are.</span></label>' +
          '<label class="check"><input type="radio" name="impmode" value="replace"><span><b>Replace</b> — delete everything currently in the app and restore only this backup. <span style="color:var(--danger)">Destructive.</span></span></label>' +
        "</div>" +
        '<label class="check" style="margin-top:10px"><input type="checkbox" id="impSettings"><span>Also import positioning, profile and pipeline stages</span></label>' +
        '<div class="banner info" style="margin-top:12px">' + icon("alert", 15) + '<div class="grow small">A backup of your current data is not automatic — export one first if you are unsure.</div>' +
        '<button class="btn sm subtle" data-act="export">Export current</button></div>',
      buttons: [
        { label: "Cancel", cls: "subtle", onClick: () => closeModal() },
        { label: "Import", cls: "primary", onClick: () => {
            const mode = (document.querySelector('#modalRoot input[name="impmode"]:checked') || {}).value || "merge";
            const withSettings = $("#impSettings") ? $("#impSettings").checked : false;
            if (mode === "replace") {
              closeModal();
              confirmDialog({
                title: "Replace all data?",
                danger: true,
                confirmText: "Yes, replace everything",
                body: "Every record currently in this browser will be deleted and replaced by the backup. This cannot be undone unless you have exported a backup first.",
                onConfirm: () => finishImport(d, mode, withSettings)
              });
            } else finishImport(d, mode, withSettings);
          } }
      ]
    });
  };
  reader.readAsText(file);
}
function finishImport(data, mode, withSettings) {
  closeModal();
  let res;
  try { res = applyImport(data, mode, withSettings); }
  catch (e) {
    console.error(e);
    toast("Import failed: " + (e.message || "unknown error"), "err", 7000);
    return;
  }
  applyTheme();
  markDirty(true).then(() => { renderAll(); closeDrawer(); });
  if (mode === "replace") toast("Backup restored", "ok", 4000);
  else toast("Imported: " + res.added + " added, " + res.updated + " updated, " + res.kept + " kept as newer", "ok", 5000);
}

    const s = steps[i];
    host.innerHTML = '<div class="onboard-scrim"><div class="ob-card">' +
      '<div class="ob-head"><h2 style="font-size:18px">Set up Copywriter OS</h2>' +
        '<div class="small muted" style="margin-top:4px">Step ' + (i + 1) + " of " + steps.length + " — " + esc(s.t) + ". Everything here can be changed later.</div>" +

      '<div class="ob-foot">' +

        '<span class="grow"></span>' +
        (i > 0 ? '<button class="btn subtle" data-act="ob-back">Back</button>' : "") +
        '<button class="btn primary" data-act="ob-next">' + (i === steps.length - 1 ? "Finish setup" : "Next") + "</button>" +
      "</div></div></div>";
    const first = host.querySelector(".ob-body .input, .ob-body .textarea");
    if (first) setTimeout(() => first.focus(), 40);
  }
  function collect() {
    host.querySelectorAll("[data-ob]").forEach(el => {
      const k = el.getAttribute("data-ob");

      if (k === "rationale") S.focus.rationale = v;
      else if (k === "mit") S.focus.mit = v;

    });
  }
  host.__ob = { next: () => { collect(); if (i < steps.length - 1) { i++; draw(); } else finish(); },
                back: () => { collect(); if (i > 0) { i--; draw(); } },
                skip: () => finish(true) };
  function finish(skipped) {
    if (!skipped) {
      S.focus.objective = S.focus.objective || S.settings.profile.immediateObjective || "";
      S.focus.strategy = S.focus.strategy || S.settings.profile.activeStrategy || "";
      S.focus.startDate = S.focus.startDate || todayISO();
      if (S.focus.mit) quickAddTask(S.focus.mit, null);

    const cb = $("#obSample");
    if (!skipped && cb && cb.checked) { loadSampleData(); }

    renderAll();
    markDirty(true);
    toast(skipped ? "Setup skipped — you can run it again from Settings" : "You are set up. Start on the Command Center.", "ok", 4000);
    if (!skipped) route("command");
  }
  draw();
}

/* ============================================================================
   Event wiring
   ========================================================================= */
function bindEvents() {
  /* --- delegated click handling --- */
  document.addEventListener("click", e => {
    const mb = e.target.closest("[data-mbtn]");
    if (mb) {
      const i = Number(mb.getAttribute("data-mbtn"));
      const b = modalCtx.buttons[i];
      if (b && b.onClick) b.onClick(mb);
      return;
    }
    const el = e.target.closest("[data-act]");
    if (!el) {
      if (e.target.classList && e.target.classList.contains("modal-scrim")) closeModal();
      return;
    }
    const act = el.getAttribute("data-act");
    const d = el.dataset;
    switch (act) {
      case "modal-close": closeModal(); break;
      case "nav": route(d.view, { x: d.x }); break;
      case "nav-stage":
        UI.filters.prospects = UI.filters.prospects || {};
        UI.filters.prospects.stage = d.val; UI.filters.prospects.view = "";
        route("prospects");
        break;
      case "set-filter": {
        const view = d.view;
        UI.filters[view] = UI.filters[view] || {};
        const val = d.val || d.x || "";
        if (view === "insights") UI.filters[view].status = val;
        else if (view === "swipe") UI.filters[view].type = val;
        else if (view === "prospects") UI.filters[view].view = val;
        renderCurrentView();
        break;
      }
      case "set-tab":
        UI.filters.tasks = UI.filters.tasks || {};
        UI.filters.tasks.tab = d.val;
        renderCurrentView();
        break;
      case "clear-filters":
        UI.filters[d.view] = {}; UI.q[d.view] = "";
        renderCurrentView();
        break;
      case "open-rec": openRecord(d.type, d.id); break;
      case "drawer-close": closeDrawer(); break;
      case "drawer-back": drawerBack(); break;
      case "drawer-delete": {
        const type = drawerRec.type, id = drawerRec.id;
        if (!type) break;
        const title = COLL[type].title(findRecord(type, id) || {});
        confirmDialog({
          title: "Delete this " + COLL[type].label.toLowerCase() + "?",
          danger: true, confirmText: "Delete",
          body: "<b>" + esc(title) + "</b> will be permanently deleted, along with its links from other records and " +
            (type === "prospect" ? "its outreach history" : "its content") + ". This cannot be undone.",
          onConfirm: () => {
            deleteRecord(type, id);
            closeDrawer();
            markDirty(true).then(renderAll);
            toast(COLL[type].label + " deleted", "ok");
          }
        });
        break;
      }
      case "drawer-copy": {
        const type = drawerRec.type, rec = findRecord(type, drawerRec.id);
        if (!rec) break;
        copyText(recordAsText(type, rec));
        break;
      }
      case "link-add": {
        const scope = el.closest("[data-rec-type]");
        if (!scope) break;
        const rec = findRecord(scope.getAttribute("data-rec-type"), scope.getAttribute("data-rec-id"));
        if (rec) openLinkPicker(scope.getAttribute("data-rec-type"), rec);

        if (rec) {
          rec.links = (rec.links || []).filter(l => !(l.type === d.type && l.id === d.id));

            '<div class="field"><label>Message</label><textarea class="textarea" id="edMessage" rows="6">' + esc(a.message || "") + "</textarea></div>" +
            '<div class="field"><label>Outcome</label><input class="input" id="edOutcome" value="' + esc(a.outcome || "") + '"></div></div>',
          buttons: [

function countSample() {

function recordAsText(type, rec) {

    out += "\n\nHISTORY\n" + rec.activities.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(a =>
      "[" + a.date + "] " + a.type + (a.channel ? " (" + a.channel + ")" : "") + ": " + a.summary +

}
