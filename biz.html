<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copywriter OS — Personal Business Operating System</title>
<meta name="description" content="A standalone, offline-first operating system for a freelance copywriting business: intelligence, offers, prospects, strategy, focus, tasks and decisions in one connected workspace.">
<meta name="color-scheme" content="light dark">
<!--
  Copywriter OS v1.0.0 — single-file application.
  No external requests: no fonts, no CDN scripts, no analytics, no network calls.
  Data lives in your browser (IndexedDB, with a localStorage fallback) and is portable via JSON backup.
-->
<style>
/* ============================================================
   1. Design tokens
   ============================================================ */
:root{
  --bg:#f2f4f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#f1f4f8;
  --border:#e2e7ee;
  --border-strong:#cdd6e0;
  --text:#111a26;
  --muted:#5a6b7d;
  --faint:#67747f;

  --accent:#0e6e67;
  --accent-ink:#0a4f4a;
  --accent-soft:#e4f1f0;
  --accent-line:#b6d8d5;

  --ok:#1c6b40; --ok-soft:#e5f3ea; --ok-line:#bcdcc9;
  --warn:#8a5500; --warn-soft:#fdf2e2; --warn-line:#ecd4ab;
  --danger:#9c2226; --danger-soft:#fcecec; --danger-line:#eec4c4;
  --info:#2a4a86; --info-soft:#e9eff9; --info-line:#c3d2ea;
  --purple:#5b3f8f; --purple-soft:#f0ebfa; --purple-line:#d5c8ec;

  --radius:10px;
  --radius-sm:7px;
  --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 18px 48px rgba(16,24,40,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sidebar-w:248px;
  color-scheme:light;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1318;
  --surface:#161d24;
  --surface-2:#1b232b;
  --surface-3:#212a33;
  --border:#293440;
  --border-strong:#3a4756;
  --text:#e6edf4;
  --muted:#9aa9b8;
  --faint:#7b8b9a;

  --accent:#5cc4bb;
  --accent-ink:#8fdcd5;
  --accent-soft:#123230;
  --accent-line:#2c5551;

  --ok:#7fc99b; --ok-soft:#132a1e; --ok-line:#2b4b39;
  --warn:#e0b072; --warn-soft:#2c2314; --warn-line:#4d3c22;
  --danger:#eb9b9b; --danger-soft:#2e1918; --danger-line:#542a29;
  --info:#a7bde6; --info-soft:#161f30; --info-line:#2c3c58;
  --purple:#c3aae8; --purple-soft:#201a2e; --purple-line:#3d3155;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.35);
  --shadow-md:0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}

/* ============================================================
   2. Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);font-size:14px;line-height:1.55;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,h5{margin:0;font-weight:650;letter-spacing:-.01em;line-height:1.25}
h1{font-size:22px}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0 0 10px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);color:var(--text)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.nowrap{white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
hr.sep{border:0;border-top:1px solid var(--border);margin:16px 0}

/* ============================================================
   3. Layout
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{
  border-right:1px solid var(--border);background:var(--surface);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:16px 12px;gap:6px;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);
}
html[data-theme="dark"] .brand-mark{color:#04211f}
.brand-name{font-weight:700;font-size:14.5px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--faint);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:1px;overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 10px 6px;font-weight:650}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);
  color:var(--muted);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:13.5px;
  transition:background .12s ease,color .12s ease;
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .ico{flex:none;opacity:.9}
.nav-count{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav-item.active .nav-count{color:var(--accent-ink)}
.sidebar-foot{border-top:1px solid var(--border);padding:10px 10px 0;font-size:11px;color:var(--faint);display:flex;flex-direction:column;gap:3px}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:10px 22px;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-bottom:1px solid var(--border);backdrop-filter:saturate(1.4) blur(8px);
}
@supports not (backdrop-filter:blur(4px)){.topbar{background:var(--surface)}}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb .title{font-weight:650;font-size:14.5px}
.crumb .desc{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.content{padding:22px 22px 96px;max-width:1240px;width:100%;margin:0 auto;flex:1}

/* ============================================================
   4. Buttons, inputs, badges
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-weight:550;
  transition:background .12s ease,border-color .12s ease,transform .06s ease;white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.primary{color:#04211f}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
html[data-theme="dark"] .btn.primary:hover{background:var(--accent-ink);color:#04211f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.subtle{background:var(--surface-2);border-color:var(--border)}
.btn.danger{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-line)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:6px;min-height:24px}
@media (max-width:960px){.btn.xs{padding:6px 10px;font-size:12.5px;min-height:30px}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{
  display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

.input,.select,.textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);font-size:13.5px;transition:border-color .12s ease,box-shadow .12s ease;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{resize:vertical;min-height:64px;line-height:1.55}
select.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em;display:flex;align-items:center;gap:5px}
.field .hint{font-size:11.5px;color:var(--faint)}
.field-err{font-size:11.5px;color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text)}
.check input{margin-top:2px;width:15px;height:15px;accent-color:var(--accent);flex:none}
.rec input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}

.badge{
  display:inline-flex;align-items:center;gap:4px;padding:1.5px 7px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.01em;border:1px solid transparent;white-space:nowrap;
  background:var(--surface-3);color:var(--muted);
  max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;
}
.badge.neutral{background:var(--surface-3);color:var(--muted);border-color:var(--border)}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.badge.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.badge.purple{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor;opacity:.85}

.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;background:var(--surface-3);
  color:var(--muted);font-size:11.5px;border:1px solid var(--border)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--text);
  max-width:260px;
}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{text-decoration:none;border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.chip .x{color:var(--faint);cursor:pointer;display:inline-grid;place-items:center;border:0;background:none;padding:0}
.chip .x:hover{color:var(--danger)}
.chip.t-link{cursor:pointer}

/* ============================================================
   5. Cards & panels
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:16px}
.section{margin-bottom:22px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.section-head h2{display:flex;align-items:center;gap:8px}
.section-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.page-head{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .row{flex-wrap:wrap;min-width:0}
@media (max-width:640px){.page-head .row{width:100%}.page-head .row .btn{flex:1 1 auto;justify-content:center}}
.page-head .desc{font-size:13px;color:var(--muted);max-width:760px;margin-top:4px}

.rec{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .06s;
  box-shadow:var(--shadow-sm);
}
.rec:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.rec-title{font-weight:620;font-size:13.5px;display:flex;align-items:center;gap:7px}
.rec-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--faint)}
.rec-body{font-size:12.5px;color:var(--muted);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.list{display:flex;flex-direction:column;gap:9px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;min-width:660px}
table.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  font-weight:650;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);
  position:sticky;top:0;
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--surface-2)}
.cell-title{font-weight:600;display:flex;align-items:center;gap:7px}
.cell-sub{font-size:11.5px;color:var(--faint)}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input,.toolbar .select{width:auto;min-width:130px}
.toolbar .search{flex:1;min-width:180px;max-width:340px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .fbtn{
  padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;color:var(--muted);cursor:pointer;
}
.filters .fbtn:hover{border-color:var(--border-strong);color:var(--text)}
.filters .fbtn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}

.empty{
  border:1px dashed var(--border-strong);border-radius:var(--radius);padding:26px 22px;text-align:center;
  background:var(--surface-2);
}
.empty h3{font-size:14px;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--muted);max-width:520px;margin:0 auto 12px}
.empty .steps{text-align:left;display:inline-block;max-width:460px;margin:0 auto 14px;font-size:12.5px;color:var(--muted)}
.empty .steps li{margin-bottom:4px}

.banner{
  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface-2);font-size:13px;margin-bottom:16px;
}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.banner.danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.banner.info{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.banner .grow{color:var(--text)}
.banner.warn .grow,.banner.danger .grow,.banner.info .grow{color:inherit}
.banner .grow strong{font-weight:650}

/* stat strip — small, calm, no giant numbers */
.stat{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:11px 13px;
  display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow-sm);
}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.stat .v{font-size:19px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .n{font-size:11.5px;color:var(--muted)}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.stat.alert .v{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}

.two-col{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.two-col{grid-template-columns:minmax(0,1fr)}}
.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.three-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:760px){.three-col{grid-template-columns:minmax(0,1fr)}}
.section,.card,.list,.list>*,.stack,.stack>*,.rec,.stats,.rec-title,.rec-meta,.rec-foot{min-width:0}
.rec-title{overflow:hidden}

.pipeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pipe-stage{
  flex:1;min-width:104px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:9px 11px;cursor:pointer;box-shadow:var(--shadow-sm);
}
.pipe-stage:hover{border-color:var(--accent-line)}
.pipe-stage .n{font-size:18px;font-weight:660;font-variant-numeric:tabular-nums;line-height:1.1}
.pipe-stage .l{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe-stage.zero{opacity:.55}
.pipe-stage.alert{border-color:var(--danger-line);background:var(--danger-soft)}
.pipe-stage.alert .n{color:var(--danger)}

/* ---------------------------------------------- quick capture ------- */
.qc-kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qc-kind{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface);font-size:12.5px;color:var(--muted);cursor:pointer}
.qc-kind:hover{border-color:var(--border-strong);color:var(--text)}
.qc-kind.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}
.qc-note{font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.5}

/* ---------------------------------------------- bulk import --------- */
.bulk-prev{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);margin-top:10px}
.bulk-prev table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
.bulk-prev th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:7px 10px;
  border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.bulk-prev td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.bulk-prev tr:last-child td{border-bottom:0}
.bulk-prev tr.bad td{background:var(--danger-soft)}
.bulk-prev tr.dup td{background:var(--warn-soft)}
.bulk-sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin:10px 0 2px}
.bulk-sum span b{font-variant-numeric:tabular-nums}
.step-line{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;margin-top:1px}
.step-line .grow{min-width:0}
.paste-box{font-family:var(--mono);font-size:12px;min-height:96px}

/* ---------------------------------------------- swipe file ---------- */
.swipe-copy{
  white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--text);
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--purple-line);
  border-radius:var(--radius-sm);padding:9px 11px;margin-top:9px;max-height:118px;overflow:hidden;position:relative;
}
.swipe-copy.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--surface-2))}
html[data-theme="dark"] .swipe-copy.clamp::after{background:linear-gradient(to bottom,rgba(0,0,0,0),var(--surface-2))}
.swipe-why{font-size:12.5px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============================================================
   6. Drawer
   ============================================================ */
.backdrop{
  position:fixed;inset:0;background:rgba(15,22,32,.42);opacity:0;pointer-events:none;
  transition:opacity .18s ease;z-index:50;
}
.backdrop.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:60;
  transform:translateX(102%);transition:transform .22s cubic-bezier(.32,.72,.3,1);display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.drawer-head .t{font-size:15.5px;font-weight:660;line-height:1.3;letter-spacing:-.01em}
.drawer-head .s{font-size:12px;color:var(--muted);margin-top:3px}
.drawer-body{flex:1;overflow-y:auto;padding:16px 18px 40px;scrollbar-gutter:stable}
.drawer-foot{border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--faint);background:var(--surface-2)}
.drawer-nav{display:flex;align-items:center;gap:2px}
.form-section{margin-bottom:18px}
.form-section > h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  margin-bottom:8px;font-weight:700;display:flex;align-items:center;gap:8px;
}
.form-section > h4::after{content:"";flex:1;height:1px;background:var(--border)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:start}
.fields > .field{min-width:0}
.fields > .full,.fields > .grid2,.fields > .grid3{grid-column:1/-1}
@media (max-width:720px){.fields{grid-template-columns:1fr}}
.req{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.textarea.mono{font-family:var(--mono);font-size:12.5px;line-height:1.65}
.field-more{margin-top:14px}

.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent-line)}
.tl-item.k-outreach::before{border-color:var(--accent)}
.tl-item.k-reply::before{border-color:var(--ok)}
.tl-item.k-followup::before{border-color:var(--warn)}
.tl-item.k-result::before{border-color:var(--purple)}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tl-title{font-size:13px;font-weight:600;margin-top:2px}
.tl-msg{
  margin-top:6px;white-space:pre-wrap;font-size:12.5px;color:var(--text);background:var(--surface-2);
  border:1px solid var(--border);border-left:3px solid var(--accent-line);border-radius:var(--radius-sm);padding:8px 10px;
}
.relbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ============================================================
   7. Modal, toast, palette
   ============================================================ */
.modal-root{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-root.show{display:flex}
.modal-scrim{position:absolute;inset:0;background:rgba(15,22,32,.45)}
.modal{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;
  animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal.wide{width:min(760px,100%)}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{font-size:15px}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-body .input,.modal-body .select,.modal-body .textarea{width:100%}

.toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--text);color:var(--bg);padding:9px 15px;border-radius:22px;font-size:13px;
  box-shadow:var(--shadow-md);animation:rise .18s ease;max-width:min(90vw,520px);pointer-events:auto;
}
.toast.ok{background:#14603c;color:#fff}
.toast.err{background:#8d2226;color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.palette-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.pal-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:10px 10px 4px;font-weight:700}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer}
.pal-item:hover,.pal-item.sel{background:var(--accent-soft)}
.pal-item .t{font-size:13.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;
  border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface-2)}
mark.hit{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}

/* ============================================================
   8. Save status, misc
   ============================================================ */
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-status.saving .dot{background:var(--warn)}
.save-status.error .dot{background:var(--danger)}
.save-status.error{color:var(--danger);font-weight:600}

.onboard-scrim{position:fixed;inset:0;z-index:100;background:rgba(15,22,32,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.ob-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:min(620px,100%);
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.ob-head{padding:18px 22px 12px;border-bottom:1px solid var(--border)}
.ob-body{padding:18px 22px;overflow-y:auto;flex:1}
.ob-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.ob-steps{display:flex;gap:5px;margin-top:12px}
.ob-step{height:3px;flex:1;border-radius:2px;background:var(--border)}
.ob-step.done{background:var(--accent)}

.kpi-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kpi-inline b{color:var(--text);font-weight:650}
.only-mobile{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:9px;height:9px;border-radius:50%;display:inline-block}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:min(280px,86vw);transform:translateX(-101%);
    transition:transform .2s ease;box-shadow:var(--shadow-lg);z-index:70}
  .sidebar.open{transform:none}
  .only-mobile{display:inline-grid}
  .content{padding:16px 14px 90px}
  .topbar{padding:9px 14px}
  .crumb .desc{display:none}
  .drawer{width:100vw}
}
@media (max-width:560px){
  .top-actions .btn.ghost span{display:none}
  h1{font-size:19px}
}
@media print{.sidebar,.topbar,.drawer,.modal-root,.toast-root{display:none!important}.content{padding:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

<script>
"use strict";
/* ============================================================================
   COPYWRITER OS — v1.0.0
   A single-file, offline-first operating system for a freelance copywriting
   business. No network calls, no build step, no backend.

   MODULE MAP
   03-core.js    constants, utils, storage (IndexedDB -> localStorage), state,
                 schema/field definitions, export / import / migration
   04-ui.js      icons, toasts, modals, drawer, form renderer, shared UI parts
   05-views-a.js Command Center, Intelligence Hub, Offers & Assets
   06-views-b.js Prospects/CRM, Strategy Room, Current Focus, Tasks, Reviews
   07-app.js     Settings & Data, search palette, onboarding, router, wiring
   ========================================================================= */

/* ============================================================================
   0. Constants
   ========================================================================= */
const APP = {
  name: "Copywriter OS",
  version: "1.1.0",
  schema: 1,          // data schema version — bumped on breaking data changes
  fileKey: "copywriter-os"
};
const LS_STATE = "copywriter-os.state.v1";
const LS_LEGACY = "copyos.state.v1";           // accepted for backward compatibility
const LS_BACKEND = "copywriter-os.backend";
const IDB = { name: "copywriter-os", version: 1, store: "kv", key: "app" };
const MAX_BACKUP_BYTES = 25 * 1024 * 1024;      // sanity ceiling for imports

/* ============================================================================
   1. Small utilities
   ========================================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid(prefix) {
  return (prefix || "r") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(self, args), ms);
  };
}
function slug(s) { return String(s || "").toLowerCase().trim(); }
function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }
function linkifyLines(text) {
  // Renders a multi-line block of notes / URLs. Plain URLs become safe links.
  return String(text || "").split(/\n/).map(line => {
    const t = line.trim();
    if (!t) return "";
    if (/^(https?:\/\/|mailto:)/i.test(t)) {
      return '<a href="' + esc(t) + '" target="_blank" rel="noopener noreferrer">' + esc(t.replace(/^https?:\/\//, "")) + "</a>";
    }
    if (/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(t)) {
      return '<a href="mailto:' + esc(t) + '">' + esc(t) + "</a>";
    }
    return esc(line);
  }).filter(Boolean).join("<br>");
}
function stripTags(s) { return String(s || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }
function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function truncate(s, n) {
  s = String(s || "").trim();
  return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
}
function plural(n, w1, wn) { return n === 1 ? w1 : (wn || w1 + "s"); }

/* ---------- dates ---------- */
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(s) {
  const d = parseDate(s);
  if (!d) return "";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function fmtDateShort(s) {
  const d = parseDate(s);
  if (!d) return "";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function dayDiff(s) { // days from today to date (negative = past)
  const d = parseDate(s); if (!d) return null;
  const now = new Date(); const n = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - n) / 86400000);
}
function relDate(s) {
  const diff = dayDiff(s);
  if (diff === null) return "";
  if (diff === 0) return "today";
  if (diff === 1) return "tomorrow";
  if (diff === -1) return "yesterday";
  if (diff < 0) return Math.abs(diff) + "d ago";
  return "in " + diff + "d";
}
function dueTone(s, done) {
  if (!s) return "neutral";
  const diff = dayDiff(s);
  if (diff === null) return "neutral";
  if (done) return "neutral";
  if (diff < 0) return "danger";
  if (diff === 0) return "warn";
  if (diff <= 3) return "info";
  return "neutral";
}
function isOverdue(s, done) { const d = dayDiff(s); return !done && d !== null && d < 0; }
function isDueSoon(s, done) { const d = dayDiff(s); return !done && d !== null && d >= 0 && d <= 3; }

/* ============================================================================
   2. Storage — IndexedDB primary, localStorage fallback, memory last resort
   ========================================================================= */
const Store = {
  backend: "memory",
  db: null,
  error: null,
  detail: "",

  async init() {
    this.error = null;
    if (window.indexedDB && window.IDBObjectStore) {
      try {
        this.db = await this._openIDB();
        // Smoke-test a transaction: some browsers expose the API but block it
        // for file:// documents (opaque origin) at transaction time.
        await this._idbRead();
        this.backend = "indexeddb";
        this.detail = "IndexedDB";
      } catch (e) {
        this.db = null;
        this.error = e;
        this.detail = (e && e.name) ? e.name : "unavailable";
      }
    } else {
      this.detail = "IndexedDB not supported by this browser";
    }
    if (this.backend !== "indexeddb") {
      try {
        localStorage.setItem("__cwos_probe__", "1");
        localStorage.removeItem("__cwos_probe__");
        this.backend = "localstorage";
        if (!this.detail) this.detail = "localStorage";
      } catch (e2) {
        this.backend = "memory";
        this.error = this.error || e2;
        this.detail = "no persistent storage available";
      }
    }
    try { localStorage.setItem(LS_BACKEND, this.backend); } catch (e3) { /* ignore */ }
    return this.backend;
  },

  _openIDB() {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(IDB.name, IDB.version); }
      catch (e) { return reject(e); }
      const timer = setTimeout(() => reject(new Error("IndexedDB open timed out")), 2500);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB.store)) db.createObjectStore(IDB.store);
      };
      req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
      req.onerror = () => { clearTimeout(timer); reject(req.error || new Error("IndexedDB open failed")); };
      req.onblocked = () => { clearTimeout(timer); reject(new Error("IndexedDB blocked")); };
    });
  },

  _idbRead() {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(IDB.store, "readonly");
      const rq = tx.objectStore(IDB.store).get(IDB.key);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error || new Error("IndexedDB read failed"));
    });
  },
  _idbWrite(payload) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(IDB.store, "readwrite");
      tx.objectStore(IDB.store).put(payload, IDB.key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error || new Error("IndexedDB write failed"));
      tx.onabort = () => reject(tx.error || new Error("IndexedDB write aborted"));
    });
  },

  /* Reads every available channel and keeps the most recently saved copy.
     This means a failure in one channel (or a browser that changes which one
     it allows) can never make previously saved work disappear. */
  async read() {
    const cands = [];
    if (this.db) {
      try { const v = await this._idbRead(); if (v && typeof v === "object") cands.push(v); }
      catch (e) { this.error = e; }
    }
    if (this.backend !== "memory") {
      try {
        const raw = localStorage.getItem(LS_STATE) || localStorage.getItem(LS_LEGACY);
        if (raw) { const v = JSON.parse(raw); if (v && typeof v === "object") cands.push(v); }
      } catch (e) { this.error = e; }
    }
    if (!cands.length) return null;
    const stamp = v => (v && v.meta && Date.parse(v.meta.lastSavedAt)) ? Date.parse(v.meta.lastSavedAt) : 0;
    cands.sort((a, b) => stamp(b) - stamp(a));
    return cands[0];
  },

  /* Writes to the primary channel, then mirrors to the other one best-effort.
     Mirroring means the data is recoverable even if the browser changes which
     storage channel it permits (common with local files and private windows). */
  async write(payload) {
    const mirrorLS = () => {
      try { localStorage.setItem(LS_STATE, JSON.stringify(payload)); return true; } catch (e) { return false; }
    };
    const mirrorIDB = () => {
      if (!this.db) return false;
      try { this._idbWrite(payload).catch(() => { try { this._idbWrite(jsonSafe(payload)); } catch (e) { /* give up quietly */ } }); return true; }
      catch (e) { return false; }
    };
    if (this.backend === "indexeddb" && this.db) {
      try {
        await this._idbWrite(payload);
        mirrorLS();
        return true;
      } catch (e) {
        this.error = e;
        // A DataCloneError means something non-serialisable crept in. Repair and retry.
        try {
          await this._idbWrite(jsonSafe(payload));
          mirrorLS();
          toast("Saved (some unsaveable values were cleaned out)", "err", 5000);
          return true;
        } catch (e2) { /* fall through to localStorage */ }
        if (mirrorLS()) {
          this._degrade("localStorage (IndexedDB write failed)");
          return true;
        }
        throw e;
      }
    }
    if (this.backend === "localstorage") {
      try {
        localStorage.setItem(LS_STATE, JSON.stringify(payload));
        mirrorIDB();
        return true;
      } catch (e) {
        if (e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014)) {
          if (mirrorIDB()) { this._degrade("IndexedDB (localStorage is full)", "indexeddb"); return true; }
          throw new Error("Browser storage is full. Export a backup, then delete old records you no longer need.");
        }
        if (mirrorIDB()) { this._degrade("IndexedDB (localStorage unavailable)", "indexeddb"); return true; }
        throw e;
      }
    }
    throw new Error("No persistent storage available — your work is NOT being saved. Export a backup now.");
  },

  _degrade(detail, backend) {
    this.backend = backend || "localstorage";
    this.detail = detail;
    try { localStorage.setItem(LS_BACKEND, this.backend); } catch (e) { /* ignore */ }
    toast("Storage switched to " + detail + ". Your work is still saved — consider exporting a backup.", "err", 7000);
    refreshBackendInfo();
  },

  async clear() {
    if (this.db) { try { const tx = this.db.transaction(IDB.store, "readwrite"); tx.objectStore(IDB.store).delete(IDB.key); } catch (e) { /* ignore */ } }
    try { localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_LEGACY); } catch (e) { /* ignore */ }
  }
};

/* Removes anything a browser database cannot store (DOM nodes, functions).
   Used only as a repair step — the app never knowingly stores such values. */
function jsonSafe(obj) {
  try { return JSON.parse(JSON.stringify(obj)); } catch (e) { return obj; }
}

function defaultState() {

    settings: {
      theme: "light",
      onboardingDone: false,

      owner: "",
      pipeline: STAGES_DEFAULT.slice(),
      profile: {
        positioning: "", targetAudience: "", coreService: "", immediateObjective: "", activeStrategy: ""
      }
    },

      id: "focus", objective: "", strategy: "", rationale: "", project: "", mit: "", support: "",

    },
    insights: [], offers: [], prospects: [], plans: [], tasks: [], reviews: [], decisions: [], swipes: []
  };
}

/* Fill in anything a record or the state object may be missing. Never throws
   away data — this is what makes old backups safe to import. */
function normalizeState(raw) {
  const d = defaultState();
  if (!raw || typeof raw !== "object") return d;
  const out = d;
  out.meta = Object.assign(d.meta, raw.meta || {});
  out.meta.schema = Number(raw.meta && raw.meta.schema) || APP.schema;
  if (raw.settings && typeof raw.settings === "object") {
    out.settings = Object.assign(d.settings, raw.settings);
    out.settings.profile = Object.assign(d.settings.profile, raw.settings.profile || {});
    if (!out.settings.expanded || typeof out.settings.expanded !== "object") out.settings.expanded = {};
    if (!Array.isArray(out.settings.pipeline) || !out.settings.pipeline.length) out.settings.pipeline = STAGES_DEFAULT.slice();
    out.settings.pipeline = out.settings.pipeline.map(s => String(s).trim()).filter(Boolean);
  }
  if (raw.focus && typeof raw.focus === "object") {
    out.focus = Object.assign(d.focus, raw.focus);
    if (!Array.isArray(out.focus.history)) out.focus.history = [];
    out.focus.id = "focus";
  }
  TYPES.forEach(t => {
    const arr = raw[COLL[t].key];
    out[COLL[t].key] = Array.isArray(arr) ? arr.map(r => normalizeRecord(t, r)) : [];
  });
  return out;
}
function normalizeRecord(type, r) {
  const c = COLL[type];
  if (!r || typeof r !== "object") r = {};
  const out = Object.assign({}, r);
  if (!out.id || typeof out.id !== "string") out.id = uid(type.slice(0, 3));
  const now = new Date().toISOString();
  if (!out.createdAt) out.createdAt = now;
  if (!out.updatedAt) out.updatedAt = out.createdAt;
  if (!Array.isArray(out.links)) out.links = [];
  out.links = out.links.filter(l => l && l.type && l.id && COLL[l.type]).map(l => ({ type: l.type, id: l.id }));
  if (!Array.isArray(out.tags)) out.tags = [];
  out.tags = out.tags.filter(Boolean).map(String);
  if (type === "prospect" && !Array.isArray(out.activities)) out.activities = [];
  if (type === "prospect") out.activities = out.activities.map(a => Object.assign({ id: uid("a"), date: todayISO(), type: "Note", summary: "" }, a));
  return out;
}
function newRecord(type, patch) {
  const c = COLL[type];
  const rec = { id: uid(type.slice(0, 3)), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), links: [], tags: [] };
  (c.fields || []).forEach(f => {
    if (f.sep || !f.k) return;
    if (rec[f.k] !== undefined) return;
    if (f.type === "check") rec[f.k] = false;
    else if (f.type === "select" && f.def !== undefined) rec[f.k] = f.def;
    else rec[f.k] = "";
  });
  if (type === "prospect") rec.activities = [];
  return Object.assign(rec, patch || {});
}

/* ---------- accessors ---------- */
function list(type) { return S[COLL[type].key]; }
function findRecord(type, id) {
  if (type === "focus") return S.focus;
  if (type === "settings") return S.settings;
  const arr = S[COLL[type] && COLL[type].key];
  if (!arr) return null;
  for (let i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return null;
}
function recTitle(type, id) {
  const r = findRecord(type, id);
  if (!r) return "(missing record)";
  if (type === "focus") return r.objective || "Current focus";
  return COLL[type].title(r);
}
function recSubtitle(type, r) {
  if (!r) return "";
  switch (type) {
    case "insight": return [r.type, r.status].filter(Boolean).join(" · ");
    case "offer": return [r.type, r.status].filter(Boolean).join(" · ");
    case "prospect": return [r.company, r.stage].filter(Boolean).join(" · ");
    case "plan": return [r.track, r.kind, r.status].filter(Boolean).join(" · ");
    case "task": return [r.priority, r.due ? "due " + fmtDateShort(r.due) : ""].filter(Boolean).join(" · ");
    case "review": return (r.type || "") + (r.date ? " · " + fmtDate(r.date) : "");
    case "decision": return [r.status, r.date ? fmtDate(r.date) : ""].filter(Boolean).join(" · ");
    default: return "";
  }
}
function recDate(type, r) {
  return (type === "insight" ? r.date : type === "review" || type === "decision" ? r.date : r.createdAt) || r.createdAt;
}

/* All records in one flat list — used by search and the link picker. */
function allRecords(opts) {
  opts = opts || {};
  const out = [];
  TYPES.forEach(t => {
    S[COLL[t].key].forEach(r => {
      if (opts.excludeSample && r.sample) return;
      if (opts.exclude && opts.exclude.type === t && opts.exclude.id === r.id) return;
      out.push({ type: t, rec: r, title: COLL[t].title(r), sub: recSubtitle(t, r) });
    });
  });
  return out;
}

function markDirty(now) {

  clearTimeout(saveTimer);
  if (now) return doSave();

}
function doSave() {
  if (!S) return Promise.resolve();
  clearTimeout(saveTimer);

    .then(() => { saveInFlight = false; lastSavedAt = new Date(); setSaveStatus("saved"); refreshBackendInfo(); })

function flushSave() {
  clearTimeout(saveTimer);

}

/* ============================================================================
   6. Export / import / reset
   ========================================================================= */
function buildBackup() {
  const payload = {
    app: APP.name,
    appVersion: APP.version,
    schemaVersion: APP.schema,
    exportedAt: new Date().toISOString(),
    counts: {},
    data: {
      meta: S.meta,
      settings: S.settings,
      focus: S.focus,
      insights: S.insights, offers: S.offers, prospects: S.prospects,
      plans: S.plans, tasks: S.tasks, reviews: S.reviews, decisions: S.decisions, swipes: S.swipes
    }
  };
  TYPES.forEach(t => { payload.counts[COLL[t].key] = S[COLL[t].key].length; });
  return payload;
}
function downloadJSON(obj, filename) {
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
  return json.length;
}
function exportBackup(silent) {
  const payload = buildBackup();
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes());
  const bytes = downloadJSON(payload, "copywriter-os-backup-" + stamp + ".json");
  if (!silent) toast("Backup downloaded (" + Math.round(bytes / 1024) + " KB)", "ok");
  return bytes;
}

function validateBackup(obj) {
  const errors = [];
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return { ok: false, errors: ["File is not a valid backup object."] };
  let data = obj.data;
  if (!data && (obj.insights || obj.prospects || obj.tasks)) data = obj; // raw state shape
  if (!data || typeof data !== "object") return { ok: false, errors: ["No 'data' section found in this file."] };
  const known = ["meta", "settings", "focus"].concat(TYPES.map(t => COLL[t].key));
  const unknown = Object.keys(data).filter(k => known.indexOf(k) < 0);
  TYPES.forEach(t => {
    const arr = data[COLL[t].key];
    if (arr !== undefined && !Array.isArray(arr)) errors.push('"' + COLL[t].key + '" is not a list.');
  });
  const counts = {};
  TYPES.forEach(t => { counts[t] = Array.isArray(data[COLL[t].key]) ? data[COLL[t].key].length : 0; });
  const total = TYPES.reduce((n, t) => n + counts[t], 0);
  if (!total && !data.focus && !data.settings) errors.push("This file contains no records to restore.");
  return { ok: errors.length === 0, errors: errors, data: data, counts: counts, total: total, unknown: unknown };
}

/* mode: "replace" | "merge" */
function applyImport(data, mode, importSettings) {
  const incoming = normalizeState(data);
  let added = 0, updated = 0, kept = 0;
  if (mode === "replace") {
    const prevTheme = S.settings.theme;
    S = incoming;
    if (!importSettings) S.settings.theme = prevTheme;
  } else {
    TYPES.forEach(t => {
      const key = COLL[t].key;
      const mine = {};
      S[key].forEach(r => { mine[r.id] = r; });
      incoming[key].forEach(r => {
        const existing = mine[r.id];
        if (!existing) { S[key].push(r); added++; }
        else {
          const a = Date.parse(existing.updatedAt || 0) || 0;
          const b = Date.parse(r.updatedAt || 0) || 0;
          if (b > a) { S[key][S[key].indexOf(existing)] = r; updated++; }
          else kept++;
        }
      });
    });
    if (importSettings) {
      S.settings.profile = Object.assign(S.settings.profile, incoming.settings.profile);
      if (incoming.settings.pipeline && incoming.settings.pipeline.length) S.settings.pipeline = incoming.settings.pipeline;
      S.settings.owner = incoming.settings.owner || S.settings.owner;
      if (!S.focus.objective) S.focus = incoming.focus;
    }
    // Drop dangling links after a merge
    TYPES.forEach(t => S[COLL[t].key].forEach(r => { r.links = r.links.filter(l => !!findRecord(l.type, l.id)); }));
  }
  S.meta.schema = APP.schema;
  S.settings.onboardingDone = true;
  return { added: added, updated: updated, kept: kept };
}

function resetAllData() {
  const theme = S ? S.settings.theme : "light";
  S = defaultState();
  S.settings.theme = theme;
  S.settings.onboardingDone = true;
  return Store.clear().then(() => doSave());
}
function removeSampleData() {
  let n = 0;
  TYPES.forEach(t => {
    const key = COLL[t].key;
    const before = S[key].length;
    S[key] = S[key].filter(r => !r.sample);
    n += before - S[key].length;
  });
  if (S.focus && S.focus.sample) {
    S.focus = defaultState().focus;
    S.focus.startDate = todayISO();
    n++;
  }
  S.settings.sampleLoaded = false;
  TYPES.forEach(t => S[COLL[t].key].forEach(r => { r.links = r.links.filter(l => !!findRecord(l.type, l.id)); }));
  return n;
}

/* --------------------------------------------------------------- toasts -- */
function toast(msg, kind, ms) {
  const root = $("#toastRoot");

  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;

/* --------------------------------------------------------- form renderer -- */
function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), obj);
}

  const parts = path.split(".");

    if (o[parts[i]] === null || typeof o[parts[i]] !== "object") o[parts[i]] = {};
    o = o[parts[i]];

}

        '" placeholder="' + esc(f.ph || "") + '">' + esc(val === undefined || val === null ? "" : val) + "</textarea>";
      break;
    case "select":
      const opts = resolveOptions(f, rec);
      let html = "";
      if (String(val) === "" && f.allowEmpty !== false && opts.indexOf("") < 0) html += '<option value="">— not set —</option>';
      html += opts.map(o => {
        const v = (o && typeof o === "object") ? o.v : o;
        const l = (o && typeof o === "object") ? o.l : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(val === undefined || val === null ? "" : val) ? " selected" : "") + ">" + esc(l) + "</option>";
      }).join("");
      if (val && opts.indexOf(val) < 0 && opts.map(o => (o && o.v) || o).indexOf(val) < 0) {
        html += '<option value="' + esc(val) + '" selected>' + esc(val) + ' (custom)</option>';
      }

      break;
    case "check":
      return '<div class="field wide"><label class="check"><input type="checkbox" ' + idattr + (val ? " checked" : "") + " /><span>" +
        esc(f.label) + (f.hint ? ' <span class="hint">· ' + esc(f.hint) + "</span>" : "") + "</span></label></div>";
    case "tags":
      input = '<input class="input" type="text" ' + idattr + ' value="' + esc(Array.isArray(val) ? val.join(", ") : (val || "")) +
        '" placeholder="' + esc(f.ph || "comma, separated") + '" list="tagList">';
      break;

      break;

/* Builds a form. In `coreOnly` mode only the essential fields are shown, with a

function visibleCount(defs, rec, core) {
  return defs.filter(f => !f.sep && !(f.showIf && !f.showIf(rec)) && (core ? f.core : !f.core)).length;
}

  const shown = useable.filter(f => f.sep || !coreOnly || f.core);

  if (!coreOnly) openPlain();

/* ============================================================================
   COMMAND CENTER
   ========================================================================= */
function pipelineCounts() {
  const c = { total: 0, contacted: 0, replies: 0, conversations: 0, won: 0, lost: 0, followUps: 0, overdue: 0 };
  S.prospects.forEach(p => {
    c.total++;
    const acts = p.activities || [];
    const sent = acts.some(a => a.type === "Outreach");
    const replied = acts.some(a => a.type === "Reply" || a.type === "Meeting") || ["Replied", "Conversation", "Proposal", "Won"].indexOf(p.stage) >= 0;
    if (sent || p.stage !== "Researching") c.contacted++;
    if (replied) c.replies++;
    if (["Conversation", "Proposal"].indexOf(p.stage) >= 0) c.conversations++;
    if (p.outcome === "Won" || p.stage === "Won") c.won++;
    if (p.outcome === "Lost" || p.stage === "Lost") c.lost++;
    if (!isClosed(p) && p.nextActionDate) {
      const d = dayDiff(p.nextActionDate);
      if (d !== null && d <= 0) c.followUps++;
      if (d !== null && d < 0) c.overdue++;
    }
  });
  return c;
}
function attentionItems() {
  const items = [];
  const pc = pipelineCounts();
  if (pc.overdue) items.push({ tone: "danger", text: pc.overdue + " overdue follow-up" + plural(pc.overdue, "", "s"), act: "nav", view: "prospects", x: "overdue", icon: "clock" });
  const overdueTasks = S.tasks.filter(t => t.status !== "Done" && isOverdue(t.due, false));
  if (overdueTasks.length) items.push({ tone: "danger", text: overdueTasks.length + " overdue task" + plural(overdueTasks.length, "", "s"), act: "nav", view: "tasks", x: "overdue", icon: "check" });
  const duePlans = S.plans.filter(p => ["Active", "Reviewing"].indexOf(p.status) >= 0 && p.reviewDate && dayDiff(p.reviewDate) !== null && dayDiff(p.reviewDate) <= 0);
  if (duePlans.length) items.push({ tone: "warn", text: duePlans.length + " plan" + plural(duePlans.length, "", "s") + " past their review date", act: "nav", view: "strategy", x: "review", icon: "target" });
  if (S.focus.reviewDate && dayDiff(S.focus.reviewDate) !== null && dayDiff(S.focus.reviewDate) <= 0) {
    items.push({ tone: "warn", text: "Your current focus was due for review on " + fmtDate(S.focus.reviewDate), act: "nav", view: "focus", icon: "crosshair" });
  }
  const lastReview = S.reviews.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
  if (!lastReview || (dayDiff(lastReview.date) !== null && dayDiff(lastReview.date) <= -8)) {
    items.push({ tone: "info", text: lastReview ? "No review logged for " + Math.abs(dayDiff(lastReview.date)) + " days" : "No review logged yet", act: "nav", view: "reviews", icon: "clipboard" });
  }
  const neglected = S.prospects.filter(p => {
    if (isClosed(p)) return false;
    const last = (p.activities || []).map(a => a.date).sort().pop();
    if (!last) return false;
    const d = dayDiff(last);
    return d !== null && d <= -14;
  });
  if (neglected.length) items.push({ tone: "warn", text: neglected.length + " prospect" + plural(neglected.length, "", "s") + " with no activity for 14+ days", act: "nav", view: "prospects", x: "neglected", icon: "users" });
  const unprocessed = S.insights.filter(i => i.status === "Unprocessed");
  if (unprocessed.length >= 3) items.push({ tone: "info", text: unprocessed.length + " insights still unprocessed", act: "nav", view: "insights", x: "Unprocessed", icon: "bulb" });
  const revDecisions = S.decisions.filter(d => d.status === "Active" && d.reviewDate && dayDiff(d.reviewDate) !== null && dayDiff(d.reviewDate) <= 0);
  if (revDecisions.length) items.push({ tone: "info", text: revDecisions.length + " decision" + plural(revDecisions.length, "", "s") + " due for review", act: "nav", view: "reviews", icon: "scale" });
  if (!S.focus.objective) items.push({ tone: "warn", text: "No current focus defined — decide what you are working on now", act: "nav", view: "focus", icon: "crosshair" });
  if (!S.settings.profile.targetAudience && !S.settings.profile.positioning) items.push({ tone: "info", text: "Positioning and target audience are not set", act: "edit-direction", icon: "spark" });
  return items;
}

function statusTone(s) {
  switch (s) {
    case "Actionable": case "Active": case "Done": case "Won": case "Implemented": case "Confirmed": return "ok";
    case "Worth exploring": case "Reviewing": case "Published": case "Improving": case "Conversation": case "Proposal": return "accent";
    case "Testing": case "Drafting": case "In progress": case "Qualified": case "Replied": return "info";
    case "Paused": case "Nurture": case "Follow-up Due": case "Researching": return "warn";
    case "Lost": case "Stopped": case "Retired": case "Reversed": case "Archived": return "neutral";
    default: return "neutral";
  }
}

VIEWS.prospects = function () {
  const v = "prospects";
  const fl = UI.filters[v] = UI.filters[v] || {};
  const q = UI.q[v] || "";
  const today = todayISO();
  let arr = S.prospects.slice();
  if (fl.stage) arr = arr.filter(r => r.stage === fl.stage);
  if (fl.fit) arr = arr.filter(r => r.fit === fl.fit);
  if (fl.strength) arr = arr.filter(r => r.strength === fl.strength);
  if (fl.view === "overdue") arr = arr.filter(r => !isClosed(r) && r.nextActionDate && dayDiff(r.nextActionDate) < 0);
  if (fl.view === "due") arr = arr.filter(r => !isClosed(r) && r.nextActionDate && dayDiff(r.nextActionDate) <= 0);
  if (fl.view === "upcoming") arr = arr.filter(r => !isClosed(r) && r.nextActionDate && dayDiff(r.nextActionDate) > 0);
  if (fl.view === "nodate") arr = arr.filter(r => !isClosed(r) && !r.nextActionDate);
  if (fl.view === "open") arr = arr.filter(r => !isClosed(r));
  if (fl.view === "neglected") arr = arr.filter(r => { const d = lastActivityDate(r); return !isClosed(r) && d && dayDiff(d) <= -14; });
  if (fl.view === "won") arr = arr.filter(r => r.outcome === "Won" || r.stage === "Won");
  if (fl.view === "lost") arr = arr.filter(r => r.outcome === "Lost" || r.stage === "Lost");
  if (fl.view === "nurture") arr = arr.filter(r => r.outcome === "Nurture" || r.stage === "Nurture");
  arr = arr.filter(r => matchQ("prospect", r, q, ["company", "industry", "why", "observations", "offerFit"]) ||
    (r.activities || []).some(a => (a.summary + " " + (a.message || "")).toLowerCase().indexOf(String(q).toLowerCase()) >= 0));

  const sort = UI.sort[v] || "next";
  arr.sort((a, b) => {
    if (sort === "name") return (a.name || "").localeCompare(b.name || "");
    if (sort === "stage") return stageIndex(a.stage) - stageIndex(b.stage);
    if (sort === "activity") return String(lastActivityDate(b)).localeCompare(String(lastActivityDate(a)));
    if (sort === "fit") return FIT.indexOf(b.fit) - FIT.indexOf(a.fit);
    const ad = a.nextActionDate ? dayDiff(a.nextActionDate) : 99999;

  });

    stat("Due today", dueToday.length, "act on these now", "set-filter", v, dueToday.length ? "alert" : "", "due") +

      esc(overdue.slice(0, 3).map(p => p.name || p.company).join(", ")) + (overdue.length > 3 ? " and " + (overdue.length - 3) + " more" : "") + " — open a record to log the next step.</div>" +
      '<button class="btn sm subtle" data-act="set-filter" data-view="' + v + '" data-val="overdue">Show them</button></div>';
  }

    toolbarSearch("Search name, company, notes or message text…", v) +

    selectFilter(STRENGTH.filter(x => x !== "Unknown"), v, "strength", "Any strength") +
    sortSelect(v, [{ v: "next", l: "Next action date" }, { v: "activity", l: "Last activity" }, { v: "stage", l: "Pipeline stage" }, { v: "fit", l: "Fit" }, { v: "name", l: "Name A–Z" }]) +
    '<button class="btn subtle sm" data-act="clear-filters" data-view="' + v + '">Reset</button>'
  );
  html += '<div class="filters" style="margin-bottom:12px">' +
    filterBtn("All " + S.prospects.length, !fl.view, "set-filter", "") +

    filterBtn("Overdue " + overdue.length, fl.view === "overdue", "set-filter", "overdue") +
    filterBtn("Due now " + (overdue.length + dueToday.length), fl.view === "due", "set-filter", "due") +
    filterBtn("Scheduled " + (openProspects.filter(p => p.nextActionDate && dayDiff(p.nextActionDate) > 0).length), fl.view === "upcoming", "set-filter", "upcoming") +
    filterBtn("No next step " + noDate.length, fl.view === "nodate", "set-filter", "nodate") +
    filterBtn("Gone quiet " + (openProspects.filter(p => { const d = lastActivityDate(p); return d && dayDiff(d) <= -14; }).length), fl.view === "neglected", "set-filter", "neglected") +
    filterBtn("Won " + S.prospects.filter(p => p.outcome === "Won" || p.stage === "Won").length, fl.view === "won", "set-filter", "won") +

    });

          '<td><div class="row" style="gap:4px">' + badge(p.fit === "High" ? "Fit: High" : p.fit && p.fit !== "Unknown" ? "Fit: " + p.fit : "", p.fit === "High" ? "ok" : "neutral") +
            badge(p.strength && p.strength !== "Unknown" ? p.strength : "", p.strength === "Strong" ? "ok" : "neutral") + "</div></td>" +
          '<td><div class="small">' + esc(truncate(p.nextAction || (closed ? "—" : "not set"), 52)) + "</div>" +
            (p.nextActionDate && !closed ? '<div class="cell-sub">' + badge(fmtDateShort(p.nextActionDate) + " · " + relDate(p.nextActionDate), d < 0 ? "danger" : d === 0 ? "warn" : "neutral") + "</div>" : "") + "</td>" +
          '<td><div class="small">' + esc(lastD ? fmtDateShort(lastD) : "—") + "</div>" +
            '<div class="cell-sub">' + nAct + " " + plural(nAct, "entry", "entries") + (quiet ? " · quiet" : "") + "</div></td>" +
          '<td>' + ((p.links || []).length ? (p.links || []).slice(0, 2).map(l => typeChip(l.type, l.id)).join(" ") + ((p.links.length > 2) ? ' <span class="tiny faint">+' + (p.links.length - 2) + "</span>" : "") : '<span class="tiny faint">—</span>') + "</td>" +
          "</tr>";
      }).join("") + "</tbody></table></div>";
    html += '<div class="tiny faint" style="margin-top:8px">Click any row to open the full record: outreach history, observations, linked assets and outcome.</div>';
  }
  return html;
};

VIEWS.strategy = function () {
  const v = "strategy";
  const fl = UI.filters[v] = UI.filters[v] || {};
  const q = UI.q[v] || "";
  let arr = S.plans.slice();
  if (fl.track) arr = arr.filter(r => r.track === fl.track);
  if (fl.kind) arr = arr.filter(r => r.kind === fl.kind);
  if (fl.status) arr = arr.filter(r => r.status === fl.status);
  arr = arr.filter(r => matchQ("plan", r, q, ["hypothesis", "measure", "learned", "outcome", "skill"]));
  arr.sort((a, b) => {
    const order = { Active: 0, Reviewing: 1, Planned: 2, Paused: 3, Done: 4, Stopped: 5 };
    return (order[a.status] === undefined ? 9 : order[a.status]) - (order[b.status] === undefined ? 9 : order[b.status]) ||
      String(b.startDate || "").localeCompare(String(a.startDate || ""));
  });

  const needReview = S.plans.filter(p => ["Active", "Reviewing"].indexOf(p.status) >= 0 && p.reviewDate && dayDiff(p.reviewDate) !== null && dayDiff(p.reviewDate) <= 0);

  let html = pageHead("Strategy Room", "Two tracks: improving the craft, and acquiring clients. Record the hypothesis, run the experiment, log what actually happened, then decide whether to continue, change, pause or stop.",
    '<div class="row" style="gap:6px"><button class="btn subtle" data-act="new-plan-craft">' + icon("book", 14) + " Craft objective</button>" +
    '<button class="btn primary" data-act="new-plan-clients">' + icon("plus", 14) + " Client experiment</button></div>");

  html += '<div class="stats" style="margin-bottom:14px">' +
    '<div class="stat"><span class="k">Active plans</span><span class="v">' + S.plans.filter(p => p.status === "Active").length + '</span><span class="n">in flight</span></div>' +
    '<div class="stat"><span class="k">Craft track</span><span class="v">' + S.plans.filter(p => p.track === "Craft" && p.status !== "Stopped" && p.status !== "Done").length + '</span><span class="n">objectives</span></div>' +
    '<div class="stat"><span class="k">Client track</span><span class="v">' + S.plans.filter(p => p.track === "Clients" && p.status !== "Stopped" && p.status !== "Done").length + '</span><span class="n">strategies &amp; experiments</span></div>' +
    '<div class="stat"><span class="k">Past review date</span><span class="v" style="' + (needReview.length ? "color:var(--danger)" : "") + '">' + needReview.length + '</span><span class="n">decide now</span></div>' +
    "</div>";

  if (needReview.length) {
    html += '<div class="banner warn">' + icon("alert", 16) + '<div class="grow"><strong>' + needReview.length + " plan" + plural(needReview.length, "", "s") + " past the review date.</strong> " +
      "Decide from evidence, not from mood: continue, change, pause or stop.</div>" +
      '<button class="btn sm subtle" data-act="open-rec" data-type="plan" data-id="' + esc(needReview[0].id) + '">Review the first one</button></div>';
  }

  html += filterBar(
    toolbarSearch("Search objectives, hypotheses, lessons…", v) +
    selectFilter(["Craft", "Clients"], v, "track", "Both tracks") +
    selectFilter(PLAN_KINDS, v, "kind", "All kinds") +
    selectFilter(PLAN_STATUS, v, "status", "All statuses") +
    '<button class="btn subtle sm" data-act="clear-filters" data-view="' + v + '">Reset</button>'
  );

  function planCard(p) {
    const bits = [];
    if (p.hypothesis) bits.push('<div class="small"><b>Hypothesis:</b> ' + esc(truncate(p.hypothesis, 150)) + "</div>");
    if (p.measure) bits.push('<div class="small"><b>Measure:</b> ' + esc(truncate(p.measure, 110)) + "</div>");
    if (p.action) bits.push('<div class="small muted">' + esc(truncate(p.action, 150)) + "</div>");
    if (p.outcome) bits.push('<div class="small"><b>Outcome:</b> ' + esc(truncate(p.outcome, 140)) + "</div>");
    if (p.learned) bits.push('<div class="small"><b>Learned:</b> ' + esc(truncate(p.learned, 140)) + "</div>");
    if (p.nextDecision) bits.push('<div class="small"><b>Next decision:</b> ' + esc(truncate(p.nextDecision, 110)) + "</div>");
    const overdueReview = ["Active", "Reviewing"].indexOf(p.status) >= 0 && p.reviewDate && dayDiff(p.reviewDate) !== null && dayDiff(p.reviewDate) <= 0;
    return '<div class="rec" data-act="open-rec" data-type="plan" data-id="' + esc(p.id) + '">' +
      '<div class="rec-title">' + icon(p.track === "Craft" ? "book" : "target", 14) + esc(truncate(p.skill && p.track === "Craft" ? p.skill : p.title, 88)) +
      (p.sample ? ' <span class="badge info">sample</span>' : "") + "</div>" +
      '<div class="rec-meta">' + badge(p.track, p.track === "Craft" ? "purple" : "accent") + badge(p.kind, "neutral") + badge(p.status, statusTone(p.status)) +
      (p.reviewDate ? badge("Review " + fmtDateShort(p.reviewDate), overdueReview ? "danger" : "neutral", "calendar") : "") + "</div>" +
      (p.skill && p.track === "Craft" ? '<div class="small muted" style="margin-top:6px">' + esc(truncate(p.title, 120)) + "</div>" : "") +
      '<div class="stack" style="gap:3px;margin-top:8px">' + bits.join("") + "</div>" +
      ((p.links && p.links.length) ? '<div class="rec-foot">' + p.links.slice(0, 3).map(l => typeChip(l.type, l.id)).join("") + "</div>" : "") +
      '<div class="row" style="gap:5px;margin-top:10px" data-stop-prop="1">' +
        ["Continue", "Change", "Pause", "Stop"].map(a =>
          '<button class="btn xs subtle" data-act="plan-status" data-id="' + esc(p.id) + '" data-val="' + a + '">' + a + "</button>").join("") +
      "</div></div>";
  }

  if (!S.plans.length) {
    html += emptyState({
      title: "No plans or experiments yet",
      text: "A plan without a success measure is a wish. Write down what you expect to happen, when you will look at it, and what would make you stop.",
      steps: ["Track 1: one craft skill worth improving commercially", "Track 2: one client-acquisition experiment with a number attached"],
      actionLabel: "Add a client experiment", act: "new-plan-clients", actionIcon: "plus"
    });
  } else {
    [["Craft", "Track 1 · Improve my craft", "Skills, practice and portfolio-worthy work"],
     ["Clients", "Track 2 · Acquire and serve clients", "Positioning, outreach, service development and conversion"]].forEach(tr => {
      const items = arr.filter(p => p.track === tr[0]);
      if (fl.track && fl.track !== tr[0]) return;
      html += '<div class="section"><div class="section-head"><div><h2>' + icon(tr[0] === "Craft" ? "book" : "target", 15) + " " + esc(tr[1]) + "</h2>" +
        '<div class="sub">' + esc(tr[2]) + "</div></div>" +
        '<button class="btn sm subtle" data-act="' + (tr[0] === "Craft" ? "new-plan-craft" : "new-plan-clients") + '">' + icon("plus", 13) + " Add</button></div>";
      if (!items.length) {
        html += '<div class="tiny faint">Nothing in this track matches the current filters.</div>';
      } else {
        html += '<div class="list">' + items.map(planCard).join("") + "</div>";
      }
      html += "</div>";
    });
  }
  return html;
};

/* ============================================================================
   TASKS
   ========================================================================= */
VIEWS.tasks = function () {
  const v = "tasks";
  const fl = UI.filters[v] = UI.filters[v] || {};
  const q = UI.q[v] || "";
  const tab = fl.tab || "today";
  const open = S.tasks.filter(t => t.status !== "Done");
  const done = S.tasks.filter(t => t.status === "Done");
  const overdue = open.filter(t => isOverdue(t.due, false));
  const today = open.filter(t => !isOverdue(t.due, false) && t.due && dayDiff(t.due) === 0);
  const soon = open.filter(t => !t.due || (dayDiff(t.due) !== null && dayDiff(t.due) > 0));
  const high = open.filter(t => t.priority === "High");

  let arr = S.tasks.slice();
  if (tab === "today") arr = overdue.concat(today, high.filter(t => overdue.indexOf(t) < 0 && today.indexOf(t) < 0));
  else if (tab === "upcoming") arr = soon;
  else if (tab === "overdue") arr = overdue;
  else if (tab === "done") arr = done;
  if (fl.priority) arr = arr.filter(t => t.priority === fl.priority);
  arr = arr.filter(t => matchQ("task", t, q, ["description", "notes"]));
  const rank = { High: 0, Medium: 1, Low: 2 };
  arr.sort((a, b) => {
    if (tab === "done") return String(b.completedAt || b.updatedAt).localeCompare(String(a.completedAt || a.updatedAt));
    const ad = a.due ? dayDiff(a.due) : 9999, bd = b.due ? dayDiff(b.due) : 9999;
    if (ad !== bd) return ad - bd;
    return (rank[a.priority] === undefined ? 3 : rank[a.priority]) - (rank[b.priority] === undefined ? 3 : rank[b.priority]);
  });
  // de-duplicate the "today" merge
  const seen = {};
  arr = arr.filter(t => { if (seen[t.id]) return false; seen[t.id] = 1; return true; });

  let html = pageHead("Tasks", "A small action list tied to real records. Every task can be linked to a goal, plan, prospect, offer or insight, so you always know why it exists.",
    '<button class="btn primary" data-act="new-task">' + icon("plus", 14) + " New task</button>");

  html += '<div class="card card-pad" style="margin-bottom:14px"><div class="row" style="gap:6px">' +
    '<input class="input" id="taskQuick" placeholder="Capture a task and press Enter…" data-role="quick-task">' +
    '<button class="btn primary" data-act="quick-task-add">' + icon("plus", 14) + " Add</button></div>" +
    '<div class="tiny faint" style="margin-top:6px">Tip: press <span class="kbd">N</span> anywhere to capture a task without leaving what you are doing.</div></div>';

  html += '<div class="filters" style="margin-bottom:12px">' +
    filterBtn("Today " + (overdue.length + today.length + high.filter(t => !t.due).length), tab === "today", "set-tab", "today") +
    filterBtn("Overdue " + overdue.length, tab === "overdue", "set-tab", "overdue") +
    filterBtn("Upcoming " + soon.length, tab === "upcoming", "set-tab", "upcoming") +
    filterBtn("Completed " + done.length, tab === "done", "set-tab", "done") +
    filterBtn("All " + S.tasks.length, tab === "all", "set-tab", "all") +
    "</div>";

  html += filterBar(
    toolbarSearch("Search tasks and notes…", v) +
    selectFilter(PRIORITY, v, "priority", "Any priority") +
    '<button class="btn subtle sm" data-act="clear-filters" data-view="' + v + '">Reset</button>'
  );

  if (!S.tasks.length) {
    html += emptyState({
      title: "No tasks yet",
      text: "Capture the smallest useful next step. Tasks can be linked later to a prospect, offer, plan or insight.",
      actionLabel: "Add a task", act: "new-task", actionIcon: "plus"
    });
  } else if (!arr.length) {
    html += '<div class="empty"><h3>Nothing here</h3><p>' +
      esc(tab === "done" ? "No completed tasks yet — finish something and it will appear here." :
        tab === "overdue" ? "No overdue tasks. That is a good day." : "No tasks in this view.") + "</p></div>";
  } else {
    html += '<div class="list">' + arr.map(t => taskRow(t)).join("") + "</div>";
    if (tab === "done") html += '<button class="btn subtle sm" data-act="clear-done" style="margin-top:10px">' + icon("trash", 13) + " Delete all completed tasks</button>";
  }
  return html;
};

VIEWS.reviews = function () {
  const v = "reviews";
  const fl = UI.filters[v] = UI.filters[v] || {};
  const q = UI.q[v] || "";
  let reviews = S.reviews.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  let decisions = S.decisions.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  if (fl.rtype) reviews = reviews.filter(r => r.type === fl.rtype);
  if (fl.dstatus) decisions = decisions.filter(d => d.status === fl.dstatus);
  if (q) {
    reviews = reviews.filter(r => matchQ("review", r, q, ["moved", "learned", "signals", "wasted", "cont", "stopp", "change"]));
    decisions = decisions.filter(d => matchQ("decision", d, q, ["decision", "evidence", "expected"]));

  let html = pageHead("Review & Decision Log", "Look back at what actually happened, decide what to keep doing, and keep the reasoning so future you can see how the strategy evolved.",
    '<div class="row" style="gap:6px"><button class="btn primary" data-act="new-review">' + icon("plus", 14) + " New review</button>" +
    '<button class="btn subtle" data-act="new-decision">' + icon("scale", 14) + " Log a decision</button></div>");

  const last = reviews[0];
  html += '<div class="stats" style="margin-bottom:14px">' +
    '<div class="stat"><span class="k">Reviews logged</span><span class="v">' + S.reviews.length + '</span><span class="n">all time</span></div>' +
    '<div class="stat"><span class="k">Last review</span><span class="v" style="font-size:15px">' + esc(last ? fmtDateShort(last.date) : "—") + '</span><span class="n">' + esc(last ? relDate(last.date) : "none yet") + "</span></div>" +
    '<div class="stat"><span class="k">Decisions</span><span class="v">' + S.decisions.length + '</span><span class="n">logged</span></div>' +
    '<div class="stat"><span class="k">Active decisions</span><span class="v">' + S.decisions.filter(d => d.status === "Active").length + '</span><span class="n">still guiding you</span></div>' +
    "</div>";

  /* ---- reviews ---- */
  html += '<div class="section"><div class="section-head"><div><h2>' + icon("clipboard", 15) + " Reviews</h2>" +
    '<div class="sub">What moved, what you learned, what to continue, stop or change</div></div>' +
    selectFilter(REVIEW_TYPES, v, "rtype", "All review types") + "</div>";
  if (!S.reviews.length) {
    html += emptyState({
      title: "No reviews yet",
      text: "A weekly review takes ten minutes and answers six questions: what moved, what you learned, what got a response, what wasted time, what to continue or stop, and the next action.",
      actionLabel: "Write your first review", act: "new-review", actionIcon: "plus"
