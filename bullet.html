function settings(){return header('Local-first • Version 1','Backup & training settings','Standalone, offline and account-free. Your data is stored only in this browser on this origin.')+`<div class="grid-2">${card('Export & restore',`<p>Export regularly and before changing browsers, clearing storage or moving the HTML file. The same file opened under a different path may get different browser storage. There is no automatic synchronization.</p><div class="toolbar">${btn('Export all data as JSON','backup','','btn-primary')}</div><label class="form-label" for="importFile">Select a version-1 JSON backup</label><input id="importFile" type="file" accept="application/json,.json"><p class="form-hint">Import validates structure and revision/assessment references, then previews counts. It never silently overwrites work. Restore is a whole-workspace replacement, not a merge.</p><div id="importPreview">${pending?importSummary():''}</div>`)}${card('Preferences & safe recovery',select('Theme','settings.theme',S.settings.theme,['light','dark'])+area('Personal training goal','lab.settings.goal',S.lab.settings?.goal,'A topic, audience or criterion to practice.',3)+`<p>Data schema version: 1. If saving fails, keep this tab open and export immediately. Downloaded JSON is plain text and can contain private work—store it securely.</p>${btn('Reset local workspace…','reset','','btn-secondary')}<p class="form-hint">Reset requires confirmation and a pre-reset backup download. It does not remove files you downloaded.</p>`)}</div>${card('Quick guide',`<ol class="spaced"><li>Open the 30-day practice workspace. Read, attempt recognition, then reveal commentary.</li><li>Draft and document the actual answer. Revise and transfer before rating.</li><li>Submit only when all evidence fields and eight ratings are filled. Milestone standards must be checked by you or a reviewer.</li><li>Save useful lines to a portfolio project. Save version snapshots before replacing wording, then select a winner.</li><li>Use Feedback & rubric to record linked self-assessments. Open the skill report for patterns, not a certificate.</li><li>Export JSON; on the other browser select that file, inspect the preview and explicitly restore.</li></ol><p>To launch offline: download <b>Fascination-Studio.html</b> and double-click it in a modern desktop browser. The embedded curriculum and scripts need no network. A live-preview URL uses separate storage from the downloaded file. Move data with JSON.</p>`)}${card('Privacy, accessibility & limitations',`<p>No external fonts, libraries, analytics or AI calls. Everything runs locally. Browser extensions or shared device accounts may still access browser data. Do not paste sensitive customer records unnecessarily.</p><p>Native controls and keyboard focus are supported; the mobile menu exposes navigation. Print the skill report or download it as Markdown. Natural-language quality, claim validity and statistical significance require human judgment. The studio does not independently verify the supplied documents’ authorship, sales claims or historical advice.</p>${btn('Read source documents','sources')}`)}`;}
function importSummary(){return `<div class="callout"><b>Validated backup preview</b><p>${pending.portfolio.length} projects · ${pending.assessments.length} assessments · ${Object.keys(pending.lessons).length} lesson records</p><p>Your current workspace has ${S.portfolio.length} projects and ${S.assessments.length} assessments. A pre-restore backup will be downloaded before replacement.</p>${btn('Restore this backup…','restore','','btn-primary')} ${btn('Cancel import','cancelImport')}</div>`;}
function modal(title,body){$('#modal').innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="card-header"><h2 class="card-title">${title}</h2>${btn('Close','closeModal')}</div>${body}</section>`;$('#modal').classList.add('open');$('#modal').dataset.returnFocus=document.activeElement?.id||'';$('#modal button')?.focus();}
function addProject(source){let b=newProject(),r=S.lab[source]||{};if(source==='builder'){b.bullet=r.winner||r.drafts||'';b.topic=r.topic||'';b.audience=r.audience||'';b.answer=r.answer||'';b.context=r.context||'Sales page';b.mechanism=+r.mechanism||1;b.why=r.questions||'';}else if(source==='transform'){b.bullet=r.winner||'';b.why=r.evaluation||'';b.answer=r.ordinary||'';}else if(source==='rewrite'){b.bullet=r.winner||r.v2||r.v1||r.original||'';b.lessons=r.lesson||'';b.why=r.diagnosis||'';[r.original,r.v1,r.v2].filter(Boolean).forEach(text=>b.versions.push({id:uid(),text,date:new Date().toISOString()}));}else if(source==='lesson'){let l=lessonRecord(S.day);b.bullet=(l.revision||l.writing||'').split('\n').find(x=>x.trim())||'';b.answer=l.answer||'';b.lessons=l.reflection||'';b.topic='Day '+S.day+' practice';}if(!b.bullet)b.bullet='';let v={id:uid(),text:b.bullet,date:new Date().toISOString()};b.versions.push(v);b.winner=v.id;S.portfolio.push(b);view.editing=b.id;S.route='portfolio';save();render();}
function recordAssessment(r,day=null){let a={id:uid(),date:new Date().toISOString(),bullet:r.bullet||r.writing,reason:r.reason||r.reflection,lesson:r.lesson||r.reflection,scores:r.scores.map(Number)};if(day)a.day=day;if(r.bulletId&&S.portfolio.some(b=>b.id===r.bulletId))a.bulletId=r.bulletId;S.assessments.push(a);S.sessions.push({id:uid(),date:a.date,type:day?'lesson':'assessment',day:day||null});}
const actions={
 nav:a=>nav(a),day:a=>nav('program',a),labTab:a=>{view.lab=a;render();},academyTab:a=>{view.academy=a;render();},
 lessonReference:a=>{let r=lessonRecord(a);if((r.recognition||'').trim().length<20)return toast('Write a reasoned recognition attempt first (at least 20 characters).');r.reference=true;save();render();},
 completeLesson:a=>{let r=lessonRecord(a),keys=['recognition','writing','answer','revision','transfer','reflection'];let missing=keys.filter(k=>(r[k]||'').trim().length<30);if(missing.length)return toast('Add meaningful evidence (at least 30 characters) in: '+missing.join(', '));if(!r.scores?.every(n=>n>=1&&n<=5))return toast('Rate all eight rubric criteria before submitting.');r.completed=new Date().toISOString();recordAssessment(r,+a);save();render();toast('Practice packet recorded. Qualitative quality remains self-assessed.');},
 review:a=>{lessonRecord(a).reviewed=new Date().toISOString();save();toast('Review recorded. Try a fresh retrieval example, not just rereading.');},
 buildPlan:()=>{let r=S.lab.builder;if(!r?.answer?.trim()||!r?.audience?.trim()||!r?.problem?.trim())return toast('Add audience, problem and actual deliverable answer first.');r.plan=true;save();render();},
 breakdownFeedback:()=>{let r=S.lab.breakdown;if(!r?.bullet?.trim()||!Array.from({length:7},(_,i)=>r['a'+i]?.trim()).every(Boolean))return toast('Paste a bullet and attempt all seven analysis fields first.');r.reveal=true;save();render();},
 angleMap:()=>{let r=S.lab.angles;if(!r?.topic?.trim()||!r?.source?.trim())return toast('Enter a topic / audience and source material first.');r.open=true;save();render();},
 captureBuilder:()=>{let r=S.lab.capture;if(!r?.raw?.trim()||!r?.answer?.trim())return toast('Capture raw material and a supported answer first.');S.lab.builder={...(S.lab.builder||{}),insight:r.raw,answer:(r.answer||'')+'\nSource: '+(r.source||'unspecified')};view.lab='builder';save();render();},
 newBullet:a=>addProject(a),editBullet:a=>{view.editing=a;nav('portfolio');},portfolioBack:()=>{view.editing=null;render();},
 saveVersion:a=>{let b=S.portfolio.find(x=>x.id===a);if(!b?.bullet.trim())return toast('Write a bullet before saving a version.');let v={id:uid(),text:b.bullet.trim(),date:new Date().toISOString()};b.versions.push(v);b.winner=v.id;save();render();toast('Version preserved; previous versions remain available.');},
 winner:a=>{let [id,vid]=a.split('|'),b=S.portfolio.find(x=>x.id===id);if(!b)return;let v=b.versions.find(v=>v.id===vid);if(!v)return;if(!b.versions.some(x=>x.text===b.bullet)&&!confirm('The working copy is not saved as a version. Load this winner anyway?'))return;b.winner=vid;b.bullet=v.text;save();render();},
 favoriteBullet:a=>{let b=S.portfolio.find(x=>x.id===a);if(b)b.favorite=!b.favorite;save();render();},favoriteFilter:()=>{view.favorites=!view.favorites;render();},
 assessBullet:a=>{let b=S.portfolio.find(x=>x.id===a);if(!b)return;S.lab.assessment={bullet:b.bullet,answer:b.answer,audience:b.audience+' / '+b.context,bulletId:b.id,scores:Array(8).fill(0),reason:'',lesson:''};nav('assessment');},
 recordAssessment:()=>{let r=S.lab.assessment;if(!r?.bullet?.trim()||!r?.answer?.trim()||!r?.audience?.trim()||(r.reason||'').trim().length<40||(r.lesson||'').trim().length<15)return toast('Add bullet, audience, answer, a reasoned diagnosis (40+ characters) and a learning note (15+).');if(!r.scores?.every(n=>n>=1&&n<=5))return toast('Rate all eight criteria.');recordAssessment(r);r.feedback=true;save();render();toast('Self-assessment recorded. Feedback reflects your ratings, not AI analysis.');},
 example:a=>{view.example=a;render();window.scrollTo(0,0);},vaultBack:()=>{view.example=null;render();},exampleReveal:a=>{let r=S.annotations[a]??=( {} );if((r.analysis||'').trim().length<25)return toast('Record your own analysis first (at least 25 characters).');r.reveal=true;save();render();},
 studyFavorite:a=>{let r=S.annotations[a]??=( {} );r.favorite=!r.favorite;save();render();},
 savedStudies:()=>{view.vaultSaved=!view.vaultSaved;render();},
 clearVault:()=>{view.vaultSaved=false;for(let k of ['vaultSearch','vaultMechanism','vaultIndustry','vaultFormat','vaultStrength','vaultLevel'])view[k]='';render();},mechVault:a=>{view.vaultMechanism=a;nav('vault');},mechLab:a=>{view.lab='builder';S.lab.builder={...(S.lab.builder||{}),mechanism:+a};nav('lab');},
 sources:()=>modal('Supplied documents • preserved source text',`<p>These are the original user-supplied documents. Their claims and attributions are not independently verified. The studio’s teaching does not endorse universal claims such as “irresistible curiosity,” current earnings or fixed blind-bullet ratios.</p>${Object.entries(D.sources).map(([name,text])=>`<details><summary>${esc(name)}</summary><pre class="source-text">${esc(text)}</pre></details>`).join('')}`),
 closeModal:()=>{let id=$('#modal').dataset.returnFocus;$('#modal').classList.remove('open');if(id)document.getElementById(id)?.focus();},
 backup,downloadReport:()=>download('Fascination-Skill-Report.md',reportText(),'text/markdown'),print:()=>window.print(),
 cancelImport:()=>{pending=null;render();},restore:()=>{if(!pending)return;if(!confirm('Replace ALL current studio data with this validated backup? A copy of the current workspace will download first.'))return;backup();S=pending;pending=null;view.editing=null;save();render();toast('Backup restored, including revisions and linked assessments.');},
 reset:()=>{if(!confirm('Download a safety backup and reset all studio work in THIS browser? This cannot be undone except by importing a backup.'))return;backup();S=fresh();view.editing=null;pending=null;save();render();toast('Fresh workspace created. Your downloaded backup can restore your work.');},
 menu:()=>$('#sidebar').classList.toggle('mobile-open')
};
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)actions[b.dataset.action]?.(b.dataset.arg);});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.bind){let value=el.type==='checkbox'?el.checked:(el.dataset.number==='true'||/\.(mechanism|confidence)$/.test(el.dataset.bind))?+el.value:el.value;setpath(el.dataset.bind,value);save();if(el.dataset.bind==='settings.theme')document.documentElement.dataset.theme=value;}if(el.dataset.filter&&el.tagName==='INPUT'){view[el.dataset.filter]=el.value;let pos=el.selectionStart,id=el.id;render();let target=document.getElementById(id);target?.focus();target?.setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.dataset.filter&&e.target.tagName==='SELECT'){view[e.target.dataset.filter]=e.target.value;render();}if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;if(file.size>15*1024*1024){toast('Backup is too large (15 MB maximum).');return;}let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);validate(parsed);pending=parsed;$('#importPreview').innerHTML=importSummary();toast('Backup validated. Review counts before restoring.');}catch(err){pending=null;$('#importPreview').textContent='Import rejected: '+err.message;toast('Import rejected; existing work is unchanged.');}};reader.onerror=()=>toast('Could not read this file. Existing work is unchanged.');reader.readAsText(file);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){actions.closeModal();$('#sidebar').classList.remove('mobile-open');}if(e.key==='Tab'&&$('#modal').classList.contains('open')){let focusables=$$('#modal button, #modal summary, #modal a, #modal input').filter(el=>el.getClientRects().length),first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('beforeunload',save);
render();
// Testable validation and serialization surface; no network services or hidden evaluation.
window.Studio={getState:()=>JSON.parse(JSON.stringify(S)),validate,readiness,reportText};
</script></body></html>
