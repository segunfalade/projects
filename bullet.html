)\n28. INVESTMENT SECRETS: Four words never to believe when you hear them from a stockbroker (p. 322)\n29. All aspirins are the same — right? Wrong! Times when the brand name makes a difference\n30. Inside report on artificial sweeteners\n31. The tires on brand-new cars are often the wrong size\n32. What your stockbroker or doctor never told you\n33. Times when the experts don't bet *(the horse-racing one)*\n\n**Health, home & insider tricks**\n34. Deceptive language on food labels that makes high sugar content look small\n35. Painkillers that make pain worse (p. 214)\n36. How non-dairy creamers can hurt you\n37. Raw sugar is better for you than the refined kind — right? Wrong!\n38. How to get a good night's sleep without pills — keep the room cool — right? Wrong! (p. 198)\n39. How experts buy caviar\n40. What to feed your dog instead of pet food — and the inside reasons why\n41. How to avoid catching someone else's cold *(the P.S. bullet)*\n\n**The teaser bullet from the same family of Boardroom ads:**\n42. Want to learn the secret to writing bullets that automatically draw friends, power, love, money far beyond your fondest dreams into your life OVERNIGHT? See page 294.\n\n## D. \"The Chef's Secret Cook Book\" (Quadrangle/New York Times, 1972)\n*(Verbatim from the ad scan hosted by InfoMarketingBlog. Note the template: \"If your [dish] does [specific flaw], see page [N].\")*\n\n> **Headline:** For people who are almost (but not quite) satisfied with their own cooking — and can't figure out what's missing.\n\n43. If your crepes are delicious but too heavy, see page 263.\n44. The gourmet uses of kosher salt? See page 3 and page 22.\n45. If your cooked shrimp gets dry or rubbery when you keep it overnight, see page 136.\n46. If your fried eggplant tastes oilier than it should, see page 176.\n47. If you sauté chicken livers perfectly but they come out tough, see page 152.\n48. How to make bottled horseradish taste like the fresh kind. See page 211.\n49. How to keep sour cream from burning when you cook with it. See page 23.\n50. What to add to domestic paprika if you can't find the imported kind. See page 69.\n51. A substitute for champagne sauce that isn't perfect, but works. See page 97.\n\n**Companion ad headlines in the same \"almost (but not quite)\" family** *(a Martin signature — the exquisite self-identification):*\n52. For golfers who are almost (but not quite) satisfied with their game — and can't figure out what they're doing wrong. *(Practical Golf, 1972)*\n53. For New Yorkers who would rather ride bikes. *(1972)*\n\n## E. The 1994 \"Big Black Book\" mailer\n*(Boardroom house copy in Martin's style — the 6-page letter is \"dozens of fascinations.\" Quoted via Adweek/Target Marketing; not personally attributed to Martin.)*\n\n54. What never to heat in a microwave oven. Never! Page 64.\n55. How to collect real estate income tax-free. Page 411\n56. When \"low-fat\" means loaded with fat. Page 70\n57. What never to eat on a Greyhound bus *(cited by John Bejakovic as typical Boardroom \"book of secrets\" material)*\n\n## F. The birthplace: Boardroom Reports contents-page teasers\n*(Denny Hatch: Martin boiled each newsletter down to a one-page table of contents that ran on the cover — \"each contents page was a glittering jewel.\" The front page might carry 60–80 of these. Business-flavored fascinations.)*\n\n58. Advance warning on longer lead times in major areas\n59. Consumer discontent: How management misjudges it. A four-step program for keeping out of trouble\n60. Which U.S. and foreign cars hold their value longest\n61. Danger to executives using company lawyer\n62. When a pay raise is not a pay raise. Why young executives are unhappy\n63. Turnaround strategy\n64. When a customer list can be classified as a trade secret\n65. Premiums women want\n66. Inducements to move your business\n67. What office colors work best\n68. Easy way to speed letters\n69. Useful book for retailers\n70. How to handle sales call reports\n\n**The \"how to stay out of court\" cluster — combined fascinations in one entry:**\n71. The mistake that is the biggest single cause of business lawsuits\n72. How you soften a potentially damaging statement made on the phone\n73. Ways to diffuse an angry customer\n\n---\n\n## The patterns behind them (steal these)\n\n| # | Pattern | Examples from the bank |\n|---|---------|------------------------|\n| 1 | **\"What never to ___\"** — forbidden knowledge, zero ambiguity | #1, #8, #54, #57 |\n| 2 | **\"What [institution] won't tell you / don't want you to know\"** — villain + insider | #5, #11, #24, #25, #28, #32 |\n| 3 | **Permission to break a rule** — \"Bills it's okay to pay late\" | #4 |\n| 4 | **\"Right? Wrong!\"** — validate a belief, then flip it | #22, #29, #37, #38 |\n| 5 | **The unresolved specific** — a number, a count, a page | #3, #10, #12, #23 |\n| 6 | **Problem micro-diagnosis** — \"If your X does Y…\" | #43–47 |\n| 7 | **Category labels as currency** — BANK SECRETS, AIRLINE SECRETS, DIETING SECRETS | #19, #24, #25, #28 |\n| 8 | **Free / zero-cost** — no risk, pure upside | #2, #12, #26 |\n| 9 | **The \"almost (but not quite)\" line** — mirrors the reader's private frustration | #52, #53, headline of D |\n\n**Three structural rules Martin never broke:**\n- **One idea per bullet.** Short beats inflated — most modern bullets are 5× too long.\n- **Every page number was real.** Buyers called customer service weeks later to check the answer existed on the page. Tease, but never lie.\n- **Break the wall.** Transition lines between bullet blocks (\"You don't have to take my word for any of this…\") keep the reader moving.\n\n---\n\n## Provenance\n\n- **Section A** — quoted by Brian Kurtz (Boardroom VP) from Marty Edelston's 1994 eulogy. Highest confidence.\n- **Sections B, D, E, F** — transcribed from archivists' scans/transcriptions of period ads and mailings. High confidence on text; **E** is Boardroom house copy in Martin's style rather than confirmed authorship.\n- **Section C** — transcribed from the *Book of Secrets* sales letter by Game of Conversions. A few items (#31, #32) are the transcriber's paraphrases of bullets, not literal typesetting.\n- Page numbers are as printed in the source material — they refer to the books being sold, not to this file.\n", "modern-fascination-bullets.md": "# Modern Fascination Bullets — by renowned copywriters, still earning\n\nCompanion to `fascination-bank.md` (Mel Martin's originals). This file covers **the modern era: 2001 → today**, with bullets quoted from named A-list writers, working controls, and the current teaching canon.\n\n**How to read this:** every bullet below is transcribed from a published source (linked in the Sources section at the bottom), not invented or \"illustrative.\" Era and attribution are given per section. Where a writer's bullets are behind a paid wall, I say so rather than paraphrase.\n\n---\n\n## PART 1 — Recent bullet walls, by writer\n\n### Parris Lampropoulos — *the* bullet master still working today\nBoardroom/Bottom Line's long-time ace; Michael Feldstein (25 years at Boardroom) calls him \"the best direct response copywriter currently writing today.\"\n\n- *\"Surprise! Choosing the wrong private school for your child can cost you a bundle in tax breaks. What to do on page 90.\"*\n  *(from his Tax Loopholes control for Boardroom)*\n\n- His 2003 Bottom Line Health magalog — one of the most studied health packages ever written — used the headline **\"How Doctors Stay Well While Treating Sick Patients All Day.\"** It **started life as a bullet** and became the headline of the whole promotion. This is the single best public proof that a bullet can graduate into a hook.\n\n**His method (stolen straight from Clayton Makepeace's write-up):** Parris starts with research, then writes **as many as 700 fascinations, keeps about 100.** Seven times more than he can use — so the survivors are all cream. Makepeace: *\"even just one or two bad ones can cause your prospect to start skimming.\"*\n\n### Clayton Makepeace — the \"21 Bullet Secrets\" issue that trained a generation\nMakepeace's *Screaming Eagle* newsletter (Sep 2006), **\"21 Bullet Secrets That IGNITE The Selling Power of Your Copy,\"** is the most influential modern bullet manual — Stefan Georgi credits it as the source of his single biggest jump as a writer. Samples quoted in it:\n\n- *\"PLUS — How to turn the tables on them: Insulate your wealth and then USE their treachery to lock-in profit potential of up to 562%!\"*\n- *\"PLUS my complete list of 1,837 companies that we suspect of fudging their earnings — make sure your stocks are NOT on this list!\"*\n- *\"WARNING — Your #1 asset is now in extreme danger! Why the equity in your family's home may be vulnerable to an all out attack in 2004-2006 — crucial self-defense…\"*\n- *\"CAUTION: Washington and Wall Street are conspiring to HOODWINK YOU! They only want you to THINK that they've cleaned up Wall Street.\"*\n- *\"Are you and your doctor making these common mistakes with your health? One of the Country's most respected M.D.'s exposes the 9 deadliest flaws in disease treatment…\"*\n- *\"Do you take any of these 16 popular vitamins or supplements? If so, please read this M.D.'s urgent warning!\"*\n- *\"The 'pinch test' that instantly tells what your body fat levels are — with pinpoint, .5% accuracy.\"* *(gimmick/naming)*\n- *\"Two proven 'cures' for writer's block. (The first one is simply doing a lot of research. The second one is much easier… and can be found at your corner grocery store.)\"*\n\n**The 21 types** (still the working taxonomy of the trade): How-To · Secret To · Why · What · What NEVER · PLUS · Number · Right…WRONG! · Warning · Are You…? · Gimmick · Sneaky · Statement of Interest + Benefit · Direct Benefit · Specific Question · If…Then · When · Quickest/Easiest · Truth · Better · Single.\n\n### Gary Bencivenga — Bencivenga Bullets (2000s, still studied)\nFrom his legendary free newsletter, quoted by Bert Shields:\n\n- *\"The easiest way to control the process of persuasion rather than merely guess at it. You'll learn that persuasion, like music, comes down to a few simple notes. Master them, and you can play an infinite variety of melodies that are music to your prospects' ears.\"*\n- *\"You will dissolve price resistance and may even be able to double or even triple your original price point because your product will create such white-hot demand from the core of your market.\"*\n- *\"The best defense against being cheated in a performance-based agreement is to do this…\"*\n- *\"How John H. runs a weekend business that uses other people's vacant land to rake in as much as $10,000 profit per week. No equipment, no investment, no employees needed!\"*\n- *\"How James P. charges $2,000 for a simple service most businesses need, but few people are aware of. He has so much business, he doesn't even advertise.\"*\n- *\"You'll be given the amazing inside story of a business that requires so little of anything, you could run it out of a phone booth. Yet it's quietly making better than $50,000 a year for scores of men and women.\"*\n- *\"The method for earning thousands of dollars on other people's inventions.\"*\n\nNote the signature: **named ordinary person + specific dollar amount + \"no X needed\"** — Bencivenga's version of Martin's specificity.\n\n### Gary Halbert — bullets from his promos & ads\nAlso quoted by Bert Shields:\n\n- *\"How Gary Halbert took in today's equivalent of $350,000… per day! (The greatest copywriter of all time reveals his 1-step, secret formula.)\"*\n- *\"The 7-step formula that even an illiterate drop-out can use to write advertising copy 100 times more potent than the best Madison Avenue ad agency!\"*\n- *\"The Real Reason people choose to buy anything — the secret truth long known by master salesmen, sociologists and 'con men' finally revealed!\"*\n- *\"What colors you must never paint your house if you want to sell it fast!\"*\n- *\"How you can legally tape any telephone call you get from a collection agency… and… how to use that tape to scare the hell out of them… and… even use it (legally) to make them pay you a big settlement!\"*\n- *\"FAKE COCAINE: A legal substitute that fools almost everyone!\"*\n- *\"How to get a 'selling edge' even 9 out of 10 real estate brokers don't know about!\"*\n\n### Scott Haines — the letter that ran two years straight on its bullets\n2003–2005 control for Gary Halbert's 1996 seminar transcript; **more than half the letter is bullets** (recommended by Ben Settle as a masterclass):\n\n- *\"How to get hundreds of glowing (and true) testimonials from your customer for free… and… what to do with them to generate even bigger profits.\"*\n- *\"Why the 'back-end' letters you write (when you know Gary's three main tricks) may be 100 times more profitable than anything else you will ever write!\"*\n- *\"How to use a simple 36-word postcard to bring in $37.00 for every dime you spend!\"*\n- *\"A weird (but effective) way to find the mailing lists that are perfect for your campaigns… and… how to test those lists… without mailing a single letter!\"*\n- *\"The exact words you should use to write a money-back guarantee that… increases sales… and reduces refunds!\"*\n\n### Eben Pagan (David DeAngelo) — *Double Your Dating*, the letter that built the online info industry\nRan 2001–2009. Swiped.co's analysis flags exactly the Martin DNA: *\"the sales letter is full of bullet points that only tease the reader… Putting the page numbers next to each point shows just how value-packed the book is.\"* Actual bullets (from the archived page):\n\n- *\"The Kiss Test\" — How to tell if she's ready to be kissed.* *(gimmick/naming + immediate benefit)*\n- *The difference between how men and women think about dating — and why most women want to keep you from being successful.*\n- *How to use \"secret\" body language to keep a woman's attention.*\n- *How to approach a new woman that you'd like to meet — and exactly what to say to start a conversation without \"pick up lines\".*\n- *Fun places to take women that are FREE — no paying for expensive dates…*\n\n### Bottom Line / Rodale house bullets of the 2000s (the Martin lineage, straight)\nThe 21 Bullet Secrets issue mines controls from Boardroom, Rodale and premium newsletters. These are the closest modern cousins to Martin's originals:\n\n- *\"How to make yourself safer than 89% of other car passengers — page 389.\"*\n- *\"Why up to 70 percent of all poisonings happen to children under five. And the best prevention of them all. Page 34.\"*\n- *\"What you must do at once if you receive a mild shock when you touch an electric appliance — page 26.\"*\n- *\"Why you should not use soap anywhere but under the arms and on the genitals. Page 37.\"*\n- *\"When cold pizza is the perfect fat-loss breakfast. Page 14.\"* *(Rodale Powerfood Nutrition Plan)*\n- *\"THE TRUTH ABOUT TUNA. Is it good for you? Or does it contain harmful metals that can ruin your immune system? See page 70.\"*\n- *\"Do you know that one-quarter of all household burglars gain entrance without breaking in? Here's how they do it… and how to get them to stop doing it to you. Page 157.\"*\n- *\"Joint bank accounts? Close them fast and open separate ones… or you'll pay dearly. Page 142.\"*\n- *\"When the IRS has to pay you interest! If they miss this deadline by a single day, they're legally obligated to do so. Page 15.\"*\n- *\"The bathroom medicine cabinet is the best place to store medicine, right? Wrong! It's the worst. The facts are on page 120.\"*\n- *\"Sneezing into a tissue prevents colds, right? Wrong! Page 2 explains why.\"*\n- *\"What never to keep in your deposit box. Never. And how to stop the state from stealing it.\"* *(the modern continuation of Martin's \"What never to…\")*\n- *\"Why you can't trust your pension fund: Dirty tricks they play with your money — and how to stop them COLD…\"*\n- *\"BUILD ENORMOUS STRENGTH AND MUSCLE TONE without exercise! Ten minute breakthrough naturally triples your growth hormone levels. Secretly being used by the New York Mets, Chicago Cubs and many Hollywood stars. All you do is stand.\"*\n- *\"BANISH MENSTRUAL CRAMPS FOR GOOD with a common vitamin! Now shown to wipe out over 80% of all cases of cramps.\"*\n- *\"BETTER THAN THE BENCH PRESS. For a broader, more muscular chest, the uncanny exercise on page 17 works wonders.\"*\n- *\"The quickest, easiest ways to find a broker who won't cheat you.\"*\n- *\"If you have a tension headache, here's why you should forget your scalp and concentrate on your toes.\"*\n- *\"If you've got just 20 minutes a month, I guarantee to work a financial miracle in your life.\"*\n- *\"You walk into an empty self-service elevator late at night and press the button. Before the door has a chance to close you get back out fast. Why? (Nine ways to outwit a mugger.) Page 380.\"*\n- *\"Drowning is the third leading cause of accidental death. But did you know it's possible to save a drowning person even if you can't swim? Page 15.\"*\n- *\"Sneaky little arthritis secrets that doctors never, ever tell you about…\"*\n- *\"The one mistake that even pro golfers make that kills the power in their downstroke… and how to use a simple, easy 'adjustment' that will instantly increase your power by 200% or more!\"*\n\n### Stefan Georgi — the biggest modern bullet practitioner\nGeorgi (700+ million in tracked sales, one of the most prolific working writers) says the biggest leap of his career came from that one Screaming Eagle PDF. His client at the time **paid him to write 10 bullets for each of the 21 types — 210 bullets.** He calls it the exercise that changed his writing.\n\nThe offer: **Backyard Liberty** (survival), whose VSL lead is structurally a stack of fascinations — FEMA confiscation, \"a social and economic 'time bomb',\" \"what you must do today to ensure that you and your family not only survive… but actually rise to the top of a fallen society.\" Same architecture as Martin's envelope: multiple entry points, universal fears, no payoff until you buy/watch.\n\n**If you only do one thing with this file:** write 210 bullets, 10 per type, the way Georgi did. That's the modern rite of passage.\n\n### Agora Financial (house) — *Dangerous Lies* (2011)\n- *\"The 3 Most Dangerous Retirement Lies Brokers Are Telling Americans Today\"* — the whole letter is built from \"authority-endorsed advice that's actually a myth → the relieving truth,\" labelled and stacked. Swiped.co's annotation: \"The bolder the claims, the more they must be backed up with credible facts, results & sources.\"\n\n---\n\n## PART 2 — The current formula canon (2020s)\n\n### Copy Hackers: \"7 Deadly Fascinations\"\nJoanna Wiebe's framework treats bullets as headline-craft — *\"replace facts with fascinations\"*:\n\n| Deadly sin | The bullet promises the reader… |\n|---|---|\n| Lust | get what you desire / be what they desire |\n| Gluttony | get everything |\n| Greed | more, for less |\n| Sloth | the lazy way — less work, same result |\n| Envy | rise above your particular Joneses |\n| Pride | be amazing |\n| Wrath | be angry (at them) |\n\nCopy Hackers' mechanical fixes — starters that turn flat bullets into fascinations: begin with **who/what/when/where/why/how**, use **\"the one / the only / the actual / the exact\"**, work in **will** and **must**, and deploy **un-words** (\"unexpected, unpopular, unknown\"). Example transformation: fact → *\"exactly when is it okay to email copy to your client?\"*\n\n### Kim Krause Schwalm: \"The Truth About Fascinations\"\nOne of the few currently-active A-listers teaching this publicly and rigorously (health + wealth controls, still beating controls today). Her module includes:\n- **10 essential rules** for writing fascinations\n- **27 fascination formulas** — each explained *with real examples from her own promos*\n- a live critique section: 15 submitted bullets rewritten into \"I've just *got* to know\" fascinations\n- the Ultimate Fascinations Review Checklist\n\nShe also flags the #1 mistake in plain terms: *giving the answer away in your bullet* — and notes fascinations can become headlines, email subject lines, sidebars, even the main hook. Available inside her *Get Dangerously Good Copywriting System* / bundle.\n\n### John Bejakovic: Copy Riddles\nA current training (and its newsletter archive) built entirely on this skill — quotes working bullets from professional controls, e.g. a Boardroom/Bottom Line health-style bullet: *\"How you could double your child's IQ with this doctor-recommended breakfast switch. Page 17.\"* Useful if you want graded practice with feedback rather than just reading swipes.\n\n---\n\n## PART 3 — What changed since Mel Martin (and what didn't)\n\n| | Mel Martin era (1965–93) | Modern era (2001→now) |\n|---|---|---|\n| Carrier | Outer envelope, sales letter, space ad | Subject line + preheader, VSL script, advertorial, Meta/TikTok hook |\n| Page numbers | Real page numbers in a physical book | Timestamps (\"at 4:12\"), module numbers, \"step 3,\" \"the 3rd email\" |\n| Proof of existence | The book arrived and buyers checked page 367 | Live page, video, downloadable — proof is instant, so the tease must be airtight |\n| Villain | \"What banks don't want you to know\" | Same, plus algorithms, Big Food, Big Pharma, \"they're deleting this\" |\n| Secrets | A real book of insider knowledge | A mechanism with a name (\"The Kiss Test\", \"the pinch test\") |\n| Tone | Pure curiosity, no disclaimer | Fascination + compliance hedge (\"in this short and controversial presentation\") |\n| Volume | Envelope covered in 30–80 teasers | One promo, 100–300 written, ~20–60 shipped (Parris: 700 written, 100 kept) |\n\n**Unchanged:** one idea per bullet · short beats inflated · unresolved specifics · the answer must actually exist · multiple entry points so different fears each find a door.\n\n---\n\n## PART 4 — Where to study fresh bullets right now\n\n1. **Kim Krause Schwalm's fascinations module** — the best current, named, A-list teaching on this. 27 formulas with her own promo examples. `kimschwalm.lpages.co` (search \"Get Dangerously Good\") or alistcopysuccess.com bundle.\n2. **The 21 Bullet Secrets PDF (Screaming Eagle, 2006)** — free copies circulate (pdfcoffee, Studocu). Read it once, then do Georgi's 210-bullet exercise.\n3. **Swiped.co → \"Modern (Mid 90s–Current)\" section** — 300+ modern swipes with analyst notes, plus collections like \"Examples With Lots Of Bullets.\" `swiped.co`\n4. **Copyhackers** — the 7 Deadly Fascinations + \"replace facts with fascinations\" tutorial. `copyhackers.com`\n5. **Copy Riddles / Desert Kite** (John Bejakovic) — working bullets quoted and dissected weekly, plus a bullet-writing course with contests. `bejakovic.com`\n6. **Live promos** — the fastest way to see what's working *this month*: Agora Financial, Bottom Line Books, Stansberry Research, Advanced Bionutritionals-style health VSLs, and the offer pages behind Facebook/YouTube ads in health, finance and survival. They are still built on Martin's skeleton.\n7. **John Carlton, Ben Settle, Daniel Throssell, Justin Goff** — current writers whose emails/pages are effectively continuous bullet practice. Settle's long-form pages were cited by Copy Hackers as \"list after list of fascinations\"; Throssell's whole email style is the fascination-as-subject-line in its modern form.\n\n---\n\n## PART 5 — Drills for the modern channel\n\n1. **210-bullet week (Georgi drill).** 10 bullets × 21 types, one product you know well. Ugly drafting only — the point is volume.\n2. **700 → 100 (Parris drill).** Pick a long sales letter. Write bullets until 100 good ones survive. Notice that the last 200 you write are better than the first 200.\n3. **Fascination → preheader.** Take 20 bullets and force each into a 45–65 character subject line + preheader pair. If it doesn't survive the squeeze, it wasn't specific enough.\n4. **Right? Wrong! audit.** List 15 beliefs your market holds. For each: state it, kill it, promise the truth on a specific step/page/timestamp.\n5. **Named mechanism inventing.** Turn 5 generic tactics into named gimmicks (\"The Kiss Test,\" \"the pinch test,\" \"the 4:12 window\"). Named mechanisms are the modern secret substitute.\n6. **Blind-bullet sweep.** Highlight every bullet in a live high-performing promo (Agora, Bottom Line). Mark each as blind (withheld) or revealing. Count the ratio. Modern controls run ~80% blind.\n7. **Villain-swap.** Rewrite 10 Martin classics for a modern market: \"What credit companies don't tell you\" → \"What your AI tools don't tell you about your data.\"\n\n---\n\n## Sources\n\n- Clayton Makepeace, *The Screaming Eagle* Vol. 1 Iss. 1, \"21 Bullet Secrets That IGNITE The Selling Power Of Your Copy,\" Sept 8, 2006 — `pdfcoffee.com/140433867-21-bullet-secretspdf-pdf-free.html`\n- Stefan Georgi, \"On Writing Killer Fascination Bullets\" — `stefanpaulgeorgi.com/blog/on-copywriting-killer-fascination-bullets/`\n- Bert Shields, \"How To Write Bullets Like Bencivenga. (8 Rules And 37 Powerful Examples.)\" — `bertshieldscopy.com/2018/07/10/copywriting-how-to-write-bullets/`\n- Michael G. Feldstein, \"Parris Lampropoulos and the Art of Great Copywriting\" — LinkedIn, Feb 2021\n- Swiped.co: Double Your Dating swipe study (`swiped.co/file/double-your-dating-sales-letter/`), Dangerous Lies swipe (`swiped.co/file/dangerouslies-agorafinancial/`), collections index\n- Eben Pagan *Double Your Dating* archived letter — Wayback Machine, Jan 2007 capture\n- Copy Hackers: \"7 Deadly Fascinations\" (`copyhackers.com/2015/10/copywriting-formula/`) and \"5 Steps to writing bullet lists\" (`copyhackers.com/bullet-lists/`)\n- Kim Krause Schwalm, *Get Dangerously Good Copywriting System* module #3 \"The Truth About Fascinations\" — `kimschwalm.lpages.co`\n- John Bejakovic / Desert Kite — `bejakovic.com` (tags: Parris Lampropoulos, bullets)\n\n**Attribution notes:** Makepeace's newsletter quotes bullets from working controls of the era (Boardroom, Rodale, Bob Livingston Letter, Safe Money Report etc.); some examples are corporate house copy rather than individually signed. Eben Pagan's bullets come from the archived web page, which is the offer's own copy. Parris Lampropoulos wrote anonymously for decades — the quotes here are from attributed industry sources, not bylines.\n"}};</script><script>'use strict';
const D=window.STUDIO_DATA, KEY='fascination-studio.v1';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const fresh=()=>({schemaVersion:1,created:new Date().toISOString(),updated:null,route:'dashboard',day:1,lessons:{},lab:{},portfolio:[],assessments:[],annotations:{},notes:'',settings:{theme:'light'},sessions:[]});
let S=fresh(),storageOK=true,pending=null,view={lab:'builder',academy:'foundations',vaultSearch:'',vaultMechanism:'',vaultIndustry:'',vaultFormat:'',vaultStrength:'',vaultLevel:'',vaultSaved:false,portfolioSearch:'',portfolioMechanism:'',favorites:false,editing:null,example:null};
try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);validate(x);S=x;}}catch(e){storageOK=false;}
function validate(x){
 if(!x||x.schemaVersion!==1||!Array.isArray(x.portfolio)||!Array.isArray(x.assessments)||!Array.isArray(x.sessions)||!x.lessons||typeof x.lessons!=='object'||Array.isArray(x.lessons)||!x.lab||typeof x.lab!=='object'||!x.annotations||typeof x.annotations!=='object'||!x.settings||typeof x.settings!=='object')throw Error('Not a compatible version-1 studio backup.');
 if(!Number.isInteger(x.day)||x.day<1||x.day>30||typeof x.notes!=='string'||typeof x.route!=='string')throw Error('Invalid navigation or notes data.');
 const ids=new Set();for(let b of x.portfolio){if(!b||typeof b.id!=='string'||ids.has(b.id)||typeof b.bullet!=='string'||!Array.isArray(b.versions)||!b.versions.length||!b.versions.every(v=>v&&typeof v.text==='string'&&typeof v.id==='string')||!b.versions.some(v=>v.id===b.winner))throw Error('Invalid bullet or revision relationship.');ids.add(b.id);for(let k of ['audience','topic','context','why','answer','tags','results','lessons'])if(typeof b[k]!=='string')throw Error('Invalid portfolio field: '+k);if(!Number.isInteger(b.mechanism)||b.mechanism<1||b.mechanism>18)throw Error('Invalid mechanism.');}
 for(let a of x.assessments){if(!a||typeof a.id!=='string'||!Array.isArray(a.scores)||a.scores.length!==8||!a.scores.every(n=>Number.isInteger(n)&&n>=1&&n<=5)||typeof a.reason!=='string'||typeof a.bullet!=='string')throw Error('Invalid assessment.');if(a.bulletId&&!ids.has(a.bulletId))throw Error('Assessment references a missing portfolio bullet.');if(a.day&&(!Number.isInteger(a.day)||a.day<1||a.day>30))throw Error('Invalid assessment lesson.');}
 for(let [k,l] of Object.entries(x.lessons)){if(!/^([1-9]|[12][0-9]|30)$/.test(k)||!l||typeof l!=='object'||Array.isArray(l))throw Error('Invalid lesson record.');for(let f of ['recognition','writing','revision','transfer','answer','reflection'])if(l[f]!==undefined&&typeof l[f]!=='string')throw Error('Invalid exercise response.');if(l.scores&&(!Array.isArray(l.scores)||l.scores.length!==8||!l.scores.every(n=>Number.isInteger(n)&&n>=0&&n<=5)))throw Error('Invalid lesson ratings.');}
 const plain=o=>o&&typeof o==='object'&&!Array.isArray(o);
 if(!plain(x.lab)||!plain(x.annotations)||!plain(x.settings)||!['light','dark'].includes(x.settings.theme))throw Error('Invalid settings or workspace container.');
 const checkFields=(o,kind)=>{if(!plain(o))throw Error('Invalid '+kind+' record.');for(let [k,v] of Object.entries(o)){if(k==='scores'){if(!Array.isArray(v)||v.length!==8||!v.every(n=>Number.isInteger(n)&&n>=0&&n<=5))throw Error('Invalid score array.');}else if(['plan','reveal','open','feedback','favorite','independent','reference'].includes(k)){if(typeof v!=='boolean')throw Error('Invalid boolean field.');}else if(k==='mechanism'){if(!Number.isInteger(v)||v<1||v>18)throw Error('Invalid mechanism selection.');}else if(typeof v!=='string')throw Error('Invalid text field: '+k);}};
 for(let r of Object.values(x.lab))checkFields(r,'lab');
 for(let r of Object.values(x.annotations))checkFields(r,'annotation');
 for(let b of x.portfolio){if(!Number.isInteger(b.confidence)||b.confidence<1||b.confidence>5||typeof b.favorite!=='boolean'||new Set(b.versions.map(v=>v.id)).size!==b.versions.length)throw Error('Invalid confidence, favorite or duplicate version ID.');if(b.versions.some(v=>typeof v.date!=='string'||isNaN(Date.parse(v.date))))throw Error('Invalid revision date.');}
 if(new Set(x.assessments.map(a=>a.id)).size!==x.assessments.length)throw Error('Duplicate assessment ID.');
 for(let a of x.assessments)if(typeof a.date!=='string'||isNaN(Date.parse(a.date)))throw Error('Invalid assessment date.');
 const walk=(o,depth=0)=>{if(depth>16)throw Error('Backup too deeply nested.');if(o&&typeof o==='object'){for(let k of Object.keys(o)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Unsafe backup key.');walk(o[k],depth+1);}}};walk(x);
}
function save(){S.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}status();}
function status(){let e=$('#saveStatus');if(e){e.textContent=storageOK?'● Saved on this browser':'⚠ Session only · export now';e.className='save-status-pill'+(storageOK?'':' warning');}}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),4500);}
function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function backup(){download('fascination-studio-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2));toast('Backup downloaded. Keep a copy outside this browser.');}
const btn=(label,action,arg='',cls='btn-secondary')=>`<button type="button" class="btn ${cls}" data-action="${action}" data-arg="${esc(arg)}">${label}</button>`;
const card=(title,body)=>`<section class="card"><h2 class="card-title">${title}</h2>${body}</section>`;
const call=(title,text)=>`<div class="callout callout-teal"><div class="callout-title">${title}</div><p>${text}</p></div>`;
const header=(eyebrow,title,lead)=>`<header class="page-header"><div><div class="page-eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-lead">${lead}</p></div></header>`;
function area(label,path,value='',hint='',rows=4){return `<div class="form-group"><label class="form-label" for="${esc(path)}">${label}</label>${hint?`<span class="form-hint">${hint}</span>`:''}<textarea id="${esc(path)}" class="form-textarea serif-editor" rows="${rows}" data-bind="${esc(path)}">${esc(value)}</textarea></div>`;}
function input(label,path,value='',type='text'){return `<div class="form-group"><label class="form-label" for="${esc(path)}">${label}</label><input id="${esc(path)}" type="${type}" class="form-input" data-bind="${esc(path)}" value="${esc(value)}"></div>`;}
function select(label,path,value,options){return `<div class="form-group"><label class="form-label" for="${esc(path)}">${label}</label><select id="${esc(path)}" class="form-select" data-bind="${esc(path)}">${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`;}).join('')}</select></div>`;}
const mechOptions=D.mechanisms.map(m=>[m.id,m.name]);
const contexts=['Sales page','Email subject','Email opener','Landing page','Lead magnet','Social post','Video hook','Direct message','Product description','Ad / CTA'];
function getpath(path){return path.split('.').reduce((o,k)=>o?.[k],S);}
function setpath(path,value){let parts=path.split('.'),o=S;for(let k of parts.slice(0,-1))o=o[k]??=( {} );o[parts.at(-1)]=value;}
function lessonRecord(n){return S.lessons[n]??=( {scores:Array(8).fill(0)} );}
function ratings(prefix,scores){return `<p class="form-hint">Judgment scale: 1 weak · 2 developing · 3 acceptable · 4 strong with caveats · 5 strong and fully supported. Self-ratings are not scientific measurements.</p>`+D.rubric.map((r,i)=>`<div class="rubric-row"><div class="rubric-row-top"><label for="${prefix}.${i}"><strong>${r.name}</strong></label><select id="${prefix}.${i}" data-bind="${prefix}.${i}" data-number="true" aria-label="${r.name} rating"><option value="0">Rate…</option>${[1,2,3,4,5].map(n=>`<option ${scores?.[i]===n?'selected':''}>${n}</option>`).join('')}</select></div><p>${r.definition}</p><details><summary>Performance anchors</summary><p><b>1:</b> ${r.weak}</p><p><b>3:</b> ${r.acceptable}</p><p><b>5:</b> ${r.strong}</p><p>2 and 4 represent intermediate performance, with a written reason required.</p></details></div>`).join('');}
function nav(route,arg){S.route=route;if(route==='program'&&arg)S.day=+arg;view.example=null;save();render();window.scrollTo(0,0);$('#sidebar').classList.remove('mobile-open');}
const routes=[['dashboard','Studio overview','F'],['program','30-day practice','C'],['academy','The academy','A'],['lab','Writing laboratory','B'],['vault','Example vault','E'],['portfolio','My portfolio','B'],['assessment','Feedback & rubric','D'],['report','Skill report','F'],['settings','Backup & settings','↗']];
function render(){if(!routes.some(r=>r[0]===S.route))S.route='dashboard';document.documentElement.dataset.theme=S.settings.theme==='dark'?'dark':'light';$('#nav').innerHTML=routes.map(([id,t,tag])=>`<li><button class="nav-btn ${S.route===id?'active':''}" data-action="nav" data-arg="${id}" ${S.route===id?'aria-current="page"':''}><span class="nav-btn-left"><span class="nav-module-tag">${tag}</span>${t}</span></button></li>`).join('');$('#breadcrumb').textContent=routes.find(r=>r[0]===S.route)[1];let done=Object.values(S.lessons).filter(l=>l.completed).length;$('#sideProgress').innerHTML=`<div class="sidebar-day-top"><span>DAY ${S.day} / 30</span><span>${done} packets</span></div><div class="sidebar-day-title">${esc(D.lessons[S.day-1].title)}</div><div class="progress-bar-track"><div class="progress-bar-fill" style="width:${done/30*100}%"></div></div>`;$('#main').innerHTML=({dashboard,program,academy,lab,vault,portfolio,assessment,report,settings}[S.route])();status();}
function dashboard(){let completed=Object.values(S.lessons).filter(l=>l.completed).length,versions=S.portfolio.reduce((n,b)=>n+b.versions.length-1,0),used=new Set(S.portfolio.map(b=>b.mechanism)).size;let due=Object.entries(S.lessons).filter(([n,l])=>l.completed&&Date.now()-new Date(l.completed).getTime()>=7*86400000&&(!l.reviewed||Date.now()-new Date(l.reviewed)>7*86400000));return header('Private writing studio','Make the question worth asking.','Understand → Analyze → Generate → Evaluate → Revise → Apply → Review.')+`<div class="hero"><div><span class="badge badge-crimson">YOUR NEXT PRACTICE • 25–40 MIN</span><h2>Day ${S.day}. ${esc(D.lessons[S.day-1].title)}</h2><p>${esc(D.lessons[S.day-1].objective)}</p>${btn('Enter today’s workspace →','day',S.day,'btn-primary btn-lg')}</div><div class="hero-note"><span class="brand-eyebrow">THE STUDIO STANDARD</span><blockquote>Reveal enough to make it matter.<br>Withhold only what is worth discovering.</blockquote><p>No invented proof. No simulated AI critique.</p></div></div><div class="grid-4">${[[completed+'/30','Lesson packets','Completion ≠ competence'],[S.portfolio.length,'Saved bullet projects','Each has a traceable history'],[versions,'Revisions saved','Deliberate edits, not clicks'],[used+'/18','Mechanisms explored','Portfolio use, not mastery']].map(([n,t,sub])=>`<div class="stat-card"><span class="stat-label">${t}</span><strong class="stat-value">${n}</strong><span class="stat-meta">${sub}</span></div>`).join('')}</div><div class="grid-2 section-gap">${card('A focused practice cycle',`<ol class="spaced"><li>Read one lesson and interpret the example yourself.</li><li>Draft before opening the reference.</li><li>Rate the promise, not your excitement about it.</li><li>Revise with a diagnosis. Save useful work to your portfolio.</li></ol>${btn('Capture or develop an idea','nav','lab')}`)}${card('Review queue',due.length?due.map(([n])=>`<p>Day ${n} · spaced review due ${btn('Retrieve & review','day',n,'btn-ghost btn-sm')}</p>`).join(''):`<p>Completed work returns here for review after 7 days. Each daily lesson also retrieves work from a week earlier.</p>${btn('Review skill evidence','nav','report')}`)}</div>${call('Your data stays here','Auto-saves use this browser’s local storage. Nothing syncs to another browser or device. Export a JSON backup regularly; private browsing and file-origin storage can be unreliable.')} ${area('Studio notebook / quick capture','notes',S.notes,'Ideas, research questions and reminders. Automatically saved.',3)}`;}
function program(){let n=S.day,l=D.lessons[n-1],r=lessonRecord(n);return header(`Stage ${l.stage} / 4 • ${l.milestone?'Cumulative assessment':'Daily deliberate practice'}`,`Day ${n} · ${esc(l.title)}`,'20–40 minutes; milestone and final sessions may take 45–60. Work can be split across sessions. All responses save as you type.')+`<div class="day-strip">${D.lessons.map(x=>`<button class="day-pill ${x.day===n?'active':''} ${S.lessons[x.day]?.completed?'completed':''}" data-action="day" data-arg="${x.day}" title="${esc(x.title)}"><span class="day-pill-num">${x.day}</span><span class="day-pill-status">${S.lessons[x.day]?.completed?'Packet ✓':x.milestone?'Assess':'Practice'}</span></button>`).join('')}</div><div class="callout"><b>Today’s objective</b><p>${esc(l.objective)}</p><p class="form-hint">${n<=7?'Learn to see curiosity':n<=14?'Learn to generate fascination':n<=21?'Learn to control and refine it':'Apply independently'}. ${n>7?`Spaced retrieval: before reading, explain Day ${l.review} in your own words; reopen it after this session.`:'Begin with a familiar product and facts you can inspect.'}</p></div><section class="lesson-section"><div class="lesson-step-num">01 / Understand · 5 minutes</div><div class="lesson-prose"><p>${esc(l.core)}</p></div><div class="bullet-compare-grid"><div class="compare-box weak"><span class="compare-label">Ordinary / weaker for this task</span>${esc(l.weak)}</div><div class="compare-box strong"><span class="compare-label">Worked example / illustrative unless labelled</span>${esc(l.strong)}</div></div><p><b>Analysis:</b> The stronger candidate names a situation and invites a narrower question: <em>${esc(l.question)}</em> Its value depends on audience fit and the answer. The weaker line may be valid descriptive copy, but offers less reason to seek this particular information.</p><p class="form-hint">Later days: draft first, then use the example for comparison rather than imitation. Example effectiveness is not performance-tested.</p></section><section class="lesson-section"><div class="lesson-step-num">02 / Analyze · 4 minutes</div>${area('Recognition / diagnosis',`lessons.${n}.recognition`,r.recognition,l.recognition)}${btn('Reveal / revisit reference analysis','lessonReference',n)}${r.reference?`<div class="callout"><b>Reference reasoning — not the only effective answer</b><p>${esc(l.reference)}</p><p>Question: ${esc(l.question)}</p><p>${esc(l.answer)}</p><p>Audit the specific subject, the useful withheld detail, the audience’s reason to care, and any implied claim. A useful answer must match the likely expectation. In the weak version, a generic promise, overclaim or revealed answer reduces this particular curiosity opportunity.</p></div>`:''}</section><section class="lesson-section"><div class="lesson-step-num">03 / Generate · 8–12 minutes</div>${area('Original drafts / practice packet',`lessons.${n}.writing`,r.writing,l.writing,8)}${area('Actual answer, source, conditions and delivery location',`lessons.${n}.answer`,r.answer,'For each selected bullet: what will you deliver, where does the information come from, and what are its limits?',4)}</section><section class="lesson-section"><div class="lesson-step-num">04 / Revise & apply · 8 minutes</div>${area('Revisions and why each change helps',`lessons.${n}.revision`,r.revision,l.revision,6)}${area('Transfer to a new context',`lessons.${n}.transfer`,r.transfer,l.transfer,4)}</section><section class="lesson-section"><div class="lesson-step-num">05 / Evaluate & retain · 5–8 minutes</div><p><b>Evidence standard:</b> ${esc(l.criteria)}</p>${ratings(`lessons.${n}.scores`,r.scores)}${area('Rating reasons, recurring weakness and next review task',`lessons.${n}.reflection`,r.reflection,'Explain each score using draft evidence. Name one remaining risk and one specific next practice constraint.',5)}<label class="check"><input type="checkbox" data-bind="lessons.${n}.independent" ${r.independent?'checked':''}> I attempted this without copying the model and checked every promised answer.</label><div class="toolbar">${btn(r.completed?'Update completed packet':'Submit practice packet','completeLesson',n,'btn-primary')}${btn('Save selected draft in portfolio','newBullet','lesson')}${btn('Mark spaced review done','review',n)}</div><p class="form-hint">Submission checks that evidence fields and ratings exist; it does NOT automatically certify their quality. Milestone readiness is provisional and self-assessed.</p>${r.completed?`<p class="badge badge-gold">Packet submitted ${new Date(r.completed).toLocaleDateString()} · ${readiness(r.scores,r.independent)}</p>`:''}</section><div class="toolbar">${n>1?btn('← Previous day','day',n-1):''}${n<30?btn('Next day →','day',n+1):btn('Generate final report','nav','report','btn-primary')}</div>`;}
function readiness(scores,independent){return independent&&scores?.every(n=>n>=3)&&scores[5]>=4&&scores[7]>=4?'Provisional self-assessed readiness; validate with an unfamiliar reader.':'Revisit low-rated criteria before increasing difficulty.';}
function academy(){let tab=view.academy;return header('Module A • Study with a pencil','The fascination academy','Analytical lenses, not magic formulas. Study a principle, then return to your own writing.')+`<div class="subnav-tabs">${[['foundations','Foundations & ethics'],['mechanisms','18 mechanisms'],['research','Research & transfer'],['curriculum','30-day curriculum map']].map(([id,t])=>btn(t,'academyTab',id,tab===id?'btn-primary':'btn-secondary')).join('')}</div>`+(tab==='mechanisms'?D.mechanisms.map(m=>`<details class="card section-gap"><summary><b>${m.id}. ${m.name}</b></summary><p>${m.logic}</p><p><b>Use when:</b> ${m.when}</p><p><b>Fails when:</b> ${m.fail}</p><p><b>Practice:</b> ${m.practice}</p><div class="bullet-compare-grid"><div class="compare-box weak"><b>Ordinary / weaker:</b><p>${esc(m.weak)}</p></div><div class="compare-box strong"><b>Illustrative candidate:</b><p>${esc(m.example)}</p></div></div><p><b>Answer and reasoning:</b> ${esc(m.exampleAnswer)}</p><p class="form-hint">Original hypothetical teaching example, not a measured result. Multiple mechanisms can overlap; none guarantees response.</p>${btn('Explore source examples','mechVault',m.id)} ${btn('Practice this mechanism','mechLab',m.id)}</details>`).join(''):tab==='research'?researchAcademy():tab==='curriculum'?`<div class="card"><p>Four stages: Days 1–7 recognition; 8–14 extraction and generation; 15–21 controlled refinement; 22–30 independent application. Milestones: 7, 14, 21 and 30. Each workspace contains objective, core lesson, contrast, analysis, recognition, original writing, revision, transfer, rubric and tangible completion evidence.</p>${D.lessons.map(l=>`<p><b>${l.day}. ${esc(l.title)}</b> — ${esc(l.objective)} ${btn('Open','day',l.day,'btn-ghost btn-sm')}</p>`).join('')}</div>`:`${card('A useful missing detail, not an empty mystery',`<p>A fascination invites a specific reader to seek a useful piece of information. A feature describes a component; a benefit describes value; a generic teaser withholds the subject itself. A headline frames the overall offer and may or may not use fascination. Clarity often wins near a purchase decision.</p><div class="bullet-compare-grid"><div class="compare-box weak">“The shocking notebook secret.”<br>No recognizable question.</div><div class="compare-box strong">“The notebook detail that helps retrieve an old meeting decision.”<br>Subject + task + withheld detail.</div></div><p>Illustrative answer: an index linked to numbered pages. This is useful only if the reader wants retrieval and does not already regard the answer as obvious.</p>`)}${card('Six lenses for analysis',`<ol class="spaced"><li><b>Subject:</b> what real situation can the reader picture?</li><li><b>Revealed anchor:</b> what does the text actually say?</li><li><b>Withheld information:</b> which exact detail is missing?</li><li><b>Stakes:</b> why should anyone care?</li><li><b>Payoff:</b> what will knowing enable?</li><li><b>Audience:</b> whose problem or decision is this?</li></ol><p>Compress or omit components as appropriate. These are diagnostic tools, not a six-part sentence template.</p>`)}${card('Why curiosity can work—and fail',`<p>Information-gap theories offer one explanation for why noticing missing knowledge can attract attention. They do not establish that every open loop compels reading or purchase. Relevance, existing knowledge, clarity, credibility, answer value and friction affect the response. Novelty may earn a click from someone who will never buy.</p><p>Compare “how many paperclips are in my drawer?” with a specific unresolved problem from a client’s working day. Both omit an answer. Only one is likely to matter to that client. Do not use a fixed “losses hurt twice as much” multiplier or a universal blind-bullet ratio as a conversion law.</p>`)}${card('Advanced judgment & ethical delivery',`<ul class="spaced"><li><b>Specific ≠ proven:</b> only use numbers, locations and mechanisms that exist in your material.</li><li><b>Objections:</b> identify the true uncertainty before framing a question. Do not argue with an invented concern.</li><li><b>Ordinary subjects:</b> find a concrete use moment, friction or overlooked consequence.</li><li><b>Awareness:</b> novices need context, experts may need trade-offs, ready buyers may need direct terms.</li><li><b>Credibility:</b> replace hype and villains with operational detail and appropriate limits.</li><li><b>Clickbait:</b> literal truth is insufficient if the likely implication is misleading.</li><li><b>Answer contract:</b> write the actual information and delivery location first. Never attach a fake page number or timestamp.</li><li><b>Right reader:</b> prefer a relevant qualified action over empty curiosity clicks.</li></ul><p>Practice: take a favorite vault example, state its likely question, list claims needing verification and adapt only its principle to a fact you can substantiate.</p>${btn('Practice in laboratory','nav','lab')}`)}`);}
function researchAcademy(){const sources=['Customer questions','Sales objections','Reviews / testimonials','Product features','Customer frustrations','Repeated mistakes','Surprising facts','Misunderstood concepts','Hidden costs','Unusual benefits','Unexpected causes','Incomplete assumptions','Buyer-journey moments'];return card('From source to answer to framing',`<ol class="spaced"><li>Capture exact raw material with source, date and permission constraints.</li><li>Separate observed fact from your inference. Mark simulated research.</li><li>Identify the reader’s task, question or decision.</li><li>Write the useful full answer, its limitations and delivery location.</li><li>Generate different unanswered questions. Reject those you cannot pay off.</li><li>Choose a mechanism and draft, then audit likely implications.</li><li>Test whether an unfamiliar reader expects the answer you deliver.</li></ol>`)+`<div class="grid-2 section-gap">${sources.map((s,i)=>card(s,`<p>Look for ${['a decision behind a recurring question','the risk behind “this won’t work for us”','a concrete unexpected use, not a generalized endorsement','a capability in a real use moment','the precise symptom in customer language','a preventable error and its correction','a result with a traceable source and scope','a definition whose misunderstanding affects action','a documented fee, condition or recurring leak','a real secondary use, not an invented side effect','a diagnostic test and alternative explanations','a boundary condition where advice fails','a moment before a commitment or handoff'][i]}.</p><p><b>Practice:</b> record one source excerpt, one potential answer and two distinct questions. Verify before writing a claim.</p>`)).join('')}</div>`+card('One answer, several channels',`<p><b>Source:</b> hypothetical scheduling tool respects unavailable calendar blocks. <b>Answer:</b> create a recurring block and verify sync.</p><ul class="spaced"><li>Sales page: “The calendar setting that keeps client bookings out of your lunch break.”</li><li>Subject: “Clients booking over lunch?” Preheader: “Check which calendar blocks your scheduler respects.”</li><li>Social: “Your calendar shows lunch blocked. Your scheduler may be looking at a different calendar. Here’s what to check.”</li><li>Video: “Before changing scheduling apps, check which calendar your booking link reads.” Show the setting promptly.</li><li>DM: “If you’re comparing schedulers, want a checklist for testing blocked time?”</li><li>CTA: “Download the calendar-conflict checklist.” Direct clarity is appropriate here.</li></ul><p>Notice that not every adaptation withholds the answer equally. Match the channel and reader’s need.</p>`);}
function lab(){let tab=view.lab,forms={builder:['Fascination builder','Find the valuable information first. The guidance below is local decision support, not generated copy or AI analysis.'],breakdown:['Bullet breakdown','Record your interpretation before viewing a known case analysis. For arbitrary pasted text, the studio supplies diagnostic questions—not a fabricated interpretation.'],transform:['Transformation workshop','Ordinary information → valuable discovery → unanswered questions → reveal/withhold → versions → evaluation.'],angles:['Angle exploration','Explore different information promises. Changing a verb is not a new angle.'],rewrite:['Rewrite & compare','Keep an original, save revisions and choose a winner for a reason.'],capture:['Research capture','Keep raw evidence separate from interpretation.']};let r=S.lab[tab]??=( {} );return header('Module B • Writing laboratory',forms[tab][0],forms[tab][1])+`<div class="subnav-tabs">${Object.entries(forms).map(([id,v])=>btn(v[0],'labTab',id,id===tab?'btn-primary':'btn-secondary')).join('')}</div>`+(tab==='builder'?builder(r):tab==='breakdown'?breakdown(r):tab==='transform'?transform(r):tab==='angles'?angles(r):tab==='rewrite'?rewrite(r):capture(r));}
function builder(r){return `<div class="grid-2">${card('1. Establish the material',input('Product / service / idea','lab.builder.topic',r.topic)+input('Target audience & awareness','lab.builder.audience',r.audience)+area('Problem in a real situation','lab.builder.problem',r.problem,'What is happening, and to whom?',3)+input('Desired outcome','lab.builder.outcome',r.outcome)+area('Surprising fact / useful insight','lab.builder.insight',r.insight,'Leave blank rather than invent a fact.',3)+area('Mistake, misconception or objection','lab.builder.mistake',r.mistake,'Ground it in a real source.',3))}${card('2. Find the promise',area('Actual information you can deliver','lab.builder.answer',r.answer,'State the full answer, source, conditions and location. Required before guidance.',5)+select('Marketing context','lab.builder.context',r.context||'Sales page',contexts)+select('Mechanism to explore','lab.builder.mechanism',r.mechanism||1,mechOptions)+btn('Build a framing plan','buildPlan','','btn-primary')+(r.plan?`<div class="callout"><b>${esc(D.mechanisms[(+r.mechanism||1)-1].name)}</b><p>${esc(D.mechanisms[(+r.mechanism||1)-1].practice)}</p><p>For <b>${esc(r.audience)}</b>, identify which part of your answer helps with <b>${esc(r.problem)}</b>. Reveal the concrete situation. Withhold only the discriminating detail. Make the payoff proportionate to your actual answer.</p><p>Write three genuinely different questions first, then draft. We have not verified or semantically evaluated your inputs.</p></div>`:''))}</div>${card('3. Draft, evaluate, revise',area('Potential unanswered questions','lab.builder.questions',r.questions,'List at least three. Select the most useful, not the most mysterious.',4)+area('Draft several versions','lab.builder.drafts',r.drafts,'Vary the question or revealed anchor, not just adjectives.',6)+area('Chosen version and reason','lab.builder.winner',r.winner,'What would a reader expect to discover? Which claims need checking?',4)+btn('Save to portfolio with history','newBullet','builder','btn-primary'))}`;}
function breakdown(r){let known=D.vault.find(x=>x.bullet.trim().toLowerCase()===(r.bullet||'').trim().toLowerCase());return card('Your analysis first',area('Paste a bullet','lab.breakdown.bullet',r.bullet,'Use an exact vault line for a known reference analysis.',3)+['Subject / situation','Revealed information','Withheld information','Likely reader question','Benefit or consequence','Relevant audience','Confusing ambiguity'].map((t,i)=>area(t,'lab.breakdown.a'+i,r['a'+i],'Your interpretation; distinguish text from inference.',2)).join('')+btn('Reveal diagnostic comparison','breakdownFeedback','','btn-primary'))+(r.reveal?card(known?'Known-source reference':'Structured diagnostic — no automated semantic analysis',known?exampleAnalysis(known):`<p>There is no stored model analysis for this pasted line. Compare your answers with these tests:</p><ol class="spaced"><li>Can you underline the exact subject in the text?</li><li>Does your “revealed” description add facts the author did not state?</li><li>Can the question be answered with the content you actually have?</li><li>What decision changes after the answer?</li><li>What could an unfamiliar reader mistakenly infer?</li><li>Does the audience need curiosity here, or a direct answer?</li></ol><p>This checklist does not claim to understand or rate your prose.</p>`):'');}
function transform(r){let fields=[['ordinary','Ordinary feature / sentence','Start with the complete, unembellished information.'],['valuable','What is genuinely valuable?','Name the reader’s task or decision; distinguish fact from inference.'],['questions','Possible unanswered questions','Write three different questions supported by the material.'],['choice','Strongest question and why','Why would this reader care now?'],['reveal','What to reveal / withhold','Keep the subject understandable. Hide only the missing discriminator.'],['drafts','Draft multiple versions','Try distinct framing strategies with the same facts.'],['evaluation','Compare and choose','Use the rubric. Identify one weakness in each.'],['winner','Selected revised version','Explain the change and remaining risk.']];return call('Worked transformation','Feature: numbered notebook pages → value: retrieve decisions → questions: which detail enables retrieval? how is the index maintained? → select retrieval detail for a busy consultant → reveal meeting-decision retrieval, withhold the index → draft “The notebook detail that helps retrieve an old meeting decision” → check obviousness and audience relevance → consider a direct benefit if the reader already knows indexing.')+card('Work the chain',fields.map(([k,t,h])=>area(t,'lab.transform.'+k,r[k],h,3)).join('')+btn('Save selected version','newBullet','transform','btn-primary'));}
function angles(r){return card('One source, several discoveries',input('Topic and audience','lab.angles.topic',r.topic)+area('Full answer / source material','lab.angles.source',r.source,'Paste usable facts, not claims you hope are true.',5)+btn('Open the angle map','angleMap','','btn-primary'))+(r.open?`<div class="grid-2 section-gap">${[['mistake','What do diligent people get wrong? What is the correction?'],['cause','What overlooked factor could explain the symptom? What test checks it?'],['benefit','What genuinely useful secondary outcome follows?'],['consequence','What happens later because of an ordinary decision?'],['myth','Which actual assumption has an evidenced exception?'],['solution','Which specific problem has a less obvious fix?'],['discovery','Which overlooked detail changes a decision?'],['shortcut','Which step can safely be removed, with what trade-off?']].map(([k,h])=>card(k[0].toUpperCase()+k.slice(1),area('Question, real answer and candidate bullet','lab.angles.'+k,r[k],h+' If no answer exists, mark “needs research.”',4))).join('')}</div>`:'');}
function rewrite(r){return call('Example revision diagnosis','Original: “Unlock the shocking productivity secret.” Diagnosis: no concrete subject or decision. Revision: “The feedback request that turns ‘looks good’ into a usable editing decision.” Why: reveals a familiar review problem, withholds the request, offers practical value. Answer: ask which passage is least clear to the intended reader and why. No performance guarantee.')+card('Save a traceable comparison',area('Original / weak version','lab.rewrite.original',r.original,'Preserve the starting point.',4)+area('Diagnosis','lab.rewrite.diagnosis',r.diagnosis,'What is weak and what should change?',3)+area('Revision 1','lab.rewrite.v1',r.v1,'Change the angle, clarity or evidence burden deliberately.',4)+area('Revision 2','lab.rewrite.v2',r.v2,'Try a different repair.',4)+area('Selected winner','lab.rewrite.winner',r.winner,'Copy the selected version exactly, or revise further.',3)+area('What changed and what you learned','lab.rewrite.lesson',r.lesson,'Compare on the same rubric; note any remaining weakness.',4)+btn('Save original and revisions','newBullet','rewrite','btn-primary'));}
function capture(r){return card('Evidence ledger',input('Source / date / permission notes','lab.capture.source',r.source)+select('Raw material type','lab.capture.type',r.type||'Customer question',['Customer question','Objection','Review','Feature','Frustration','Mistake','Surprising fact','Misunderstood concept','Hidden cost','Unusual benefit','Unexpected cause','Assumption','Buyer-journey moment'])+area('Exact raw material','lab.capture.raw',r.raw,'Label simulated research. Avoid private customer details.',5)+area('Observed facts versus your interpretation','lab.capture.interpretation',r.interpretation,'What is supported, and what still needs verification?',4)+area('Useful answer, limits and delivery location','lab.capture.answer',r.answer,'Do not fill evidence gaps with creativity.',4)+btn('Carry into builder','captureBuilder','','btn-primary'));}
function vault(){if(view.example)return vaultDetail(D.vault.find(x=>x.id===view.example));let q=view.vaultSearch.toLowerCase();let results=D.vault.filter(x=>(!view.vaultSaved||S.annotations[x.id]?.favorite)&&(!q||[x.bullet,x.source,x.audience,x.objective,x.industry].join(' ').toLowerCase().includes(q))&&(!view.vaultMechanism||x.mechanism===+view.vaultMechanism)&&(!view.vaultIndustry||x.industry===view.vaultIndustry)&&(!view.vaultFormat||x.format===view.vaultFormat)&&(!view.vaultStrength||x.strength===view.vaultStrength)&&(!view.vaultLevel||x.level===view.vaultLevel));return header('Module E • Source-labelled study library','The example vault',`${D.vault.length} searchable study entries from your two supplied documents, the three brief examples, original teaching examples and diagnostic failures.`)+call('Study the mechanism. Verify the claim.','Attributions and performance claims in the attached documents have not been independently verified. House copy is not silently attributed to a named writer. Historical health, financial, legal and safety copy is not current advice. Source page numbers refer to the original products, not this studio.')+`<div class="card filter-panel"><label for="vaultQuery" class="form-label">Search copy, audience, industry, source or objective</label><input class="form-input" id="vaultQuery" data-filter="vaultSearch" value="${esc(view.vaultSearch)}" placeholder="e.g. shrimp, Boardroom, consulting"><div class="grid-3 section-gap">${filterSelect('Mechanism','vaultMechanism',view.vaultMechanism,mechOptions)}${filterSelect('Industry / audience category','vaultIndustry',view.vaultIndustry,[...new Set(D.vault.map(x=>x.industry))].sort())}${filterSelect('Format','vaultFormat',view.vaultFormat,[...new Set(D.vault.map(x=>x.format))])}${filterSelect('Strength / type','vaultStrength',view.vaultStrength,[...new Set(D.vault.map(x=>x.strength))])}${filterSelect('Skill level','vaultLevel',view.vaultLevel,['Beginner','Intermediate'])}</div>${btn('Clear filters','clearVault')} ${btn(view.vaultSaved?'★ Saved studies only':'☆ Show saved studies','savedStudies')} ${btn('Read supplied documents & provenance','sources')}</div><p class="result-count">${results.length} matching examples · Select a card to analyze before revealing commentary.</p><div class="grid-2">${results.map(x=>`<article class="card vault-card"><span class="badge">${esc(x.industry)} · ${esc(x.level)}</span><blockquote>${esc(x.bullet)}</blockquote><p class="form-hint">${esc(x.source)}</p><div class="toolbar">${btn('Analyze example →','example',x.id)}${btn(S.annotations[x.id]?.favorite?'★ Saved study':'☆ Save study','studyFavorite',x.id,'btn-ghost')}</div></article>`).join('')||'<div class="card">No examples match. Try fewer filters.</div>'}</div>`;}
function filterSelect(label,key,value,options){return `<div><label class="form-label" for="filter-${key}">${label}</label><select class="form-select" id="filter-${key}" data-filter="${key}"><option value="">All</option>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`;}).join('')}</select></div>`;}
function exampleAnalysis(x){return `<dl class="analysis-list">${[['Actual wording',x.bullet],['Reader question / interpretation',x.question],['Revealed information',x.revealed],['Withheld information',x.withheld],['Anticipated payoff',x.payoff],['Relevant audience',x.audience],['Why not a generic benefit?', x.generic || 'A generic “learn useful tips” line does not identify a concrete missing detail. This example should be judged by whether its particular situation and question are meaningful to this audience; not every source line succeeds.'],['Risks / answer status',x.risk],['Transfer practice',x.transfer]].map(([t,v])=>`<dt>${t}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;}
function vaultDetail(x){if(!x){view.example=null;return vault();}let a=S.annotations[x.id]??=( {} );return header('Example study',esc(x.industry),x.attribution)+btn('← Back to filtered vault','vaultBack')+`<div class="bullet-showcase">${esc(x.bullet)}</div><p class="form-hint">${esc(x.source)}</p><div class="card section-gap"><b>Learning objective:</b> ${esc(x.objective)}${area('Your analysis: subject, revealed, withheld, question, payoff, reader and ambiguity',`annotations.${x.id}.analysis`,a.analysis,'Write your own interpretation first. Label inferred details.',7)}${area('Apply the principle to another topic',`annotations.${x.id}.transfer`,a.transfer,'Use an answer you can actually deliver.',4)}${btn('Reveal reference commentary','exampleReveal',x.id,'btn-primary')} ${btn(a.favorite?'★ Saved for review':'☆ Save for review','studyFavorite',x.id)}</div>${a.reveal?card('Reference commentary — multiple interpretations are possible',exampleAnalysis(x)+`<p class="form-hint">Mechanism tag is a study classification, not an exclusive or objective category: ${esc(D.mechanisms[x.mechanism-1].name)}.</p>`):''}`;}
function newProject(){return {id:uid(),bullet:'',audience:'',topic:'',mechanism:1,context:'Sales page',why:'',answer:'',tags:'',results:'',lessons:'',confidence:3,favorite:false,versions:[],winner:'',created:new Date().toISOString()};}
function portfolio(){if(view.editing)return portfolioEditor();let q=view.portfolioSearch.toLowerCase(),arr=S.portfolio.filter(b=>(!q||[b.bullet,b.audience,b.topic,b.tags,b.why,b.context].join(' ').toLowerCase().includes(q))&&(!view.portfolioMechanism||b.mechanism===+view.portfolioMechanism)&&(!view.favorites||b.favorite));return header('Your original work','Bullet portfolio','Projects keep originals, revisions, selected winners, answers, assessments and real-world observations together.')+`<div class="toolbar">${btn('＋ New bullet project','newBullet','','btn-primary')}${btn(view.favorites?'★ Favorites only':'☆ Show favorites','favoriteFilter')}</div><div class="card section-gap"><label class="form-label" for="portfolioQuery">Search bullets, topic, audience or tags</label><input id="portfolioQuery" data-filter="portfolioSearch" class="form-input" value="${esc(view.portfolioSearch)}">${filterSelect('Mechanism','portfolioMechanism',view.portfolioMechanism,mechOptions)}</div><p class="result-count">${arr.length} projects found</p><div class="grid-2">${arr.map(b=>`<article class="card"><span class="badge">${esc(b.context)} · ${b.versions.length} version(s)</span><blockquote class="portfolio-quote">${esc(b.bullet)}</blockquote><p>${esc(b.audience)} · ${esc(b.topic)}</p><p class="form-hint">${esc(b.tags)} · Confidence ${b.confidence}/5 (self-reported)</p><div class="toolbar">${btn('Open & revise','editBullet',b.id)}${btn(b.favorite?'★':'☆','favoriteBullet',b.id,'btn-ghost')}${btn('Assess','assessBullet',b.id,'btn-ghost')}</div></article>`).join('')||card('Your library starts with a real answer','<p>No saved projects match. Draft in the laboratory or create a project above. Drafts remain separate from completed practice packets.</p>')}</div>`;}
function portfolioEditor(){let b=S.portfolio.find(x=>x.id===view.editing);if(!b){view.editing=null;return portfolio();}let ix=S.portfolio.indexOf(b),p='portfolio.'+ix;return header('Portfolio project','Write. Compare. Keep the evidence.','Metadata and working edits auto-save. “Save version” creates an immutable snapshot; choosing a winner loads that text as the selected bullet.')+btn('← All projects','portfolioBack')+`<div class="grid-2 section-gap">${card('Working copy',area('Bullet / working revision',p+'.bullet',b.bullet,'Use Save version to preserve this wording.',6)+input('Audience',p+'.audience',b.audience)+input('Topic / offer',p+'.topic',b.topic)+select('Mechanism',p+'.mechanism',b.mechanism,mechOptions)+select('Context',p+'.context',b.context,contexts)+input('Tags (comma separated)',p+'.tags',b.tags)+select('Confidence (self-reported)',p+'.confidence',b.confidence,[1,2,3,4,5])+btn('Save version snapshot','saveVersion',b.id,'btn-primary'))}${card('Answer & rationale',area('Why it might work',p+'.why',b.why,'State the question, value, fit and evidence burden.',4)+area('Actual information promised',p+'.answer',b.answer,'Include source, limitations and delivery location.',5)+area('Lessons learned / revision diagnosis',p+'.lessons',b.lessons,'What changed and why? What remains weak?',4)+area('Real-world test / plan / results',p+'.results',b.results,'Label unrun tests. Record hypothesis, audience, exposures, qualified actions, guardrails and uncertainty.',5)+btn('Self-assess working copy','assessBullet',b.id))}</div>${card('Revision history & comparison',`<div class="grid-2">${b.versions.map((v,i)=>`<section class="compare-box ${b.winner===v.id?'strong':''}"><span class="compare-label">${i===0?'Original':'Revision '+i} ${b.winner===v.id?'· Selected winner':''}</span><p>${esc(v.text)}</p><p class="form-hint">${new Date(v.date).toLocaleString()}</p>${btn('Select as winner','winner',b.id+'|'+v.id,'btn-secondary btn-sm')}</section>`).join('')}</div><p class="form-hint">Selecting a version does not delete other versions. Save unsnapshotted changes first if you wish to preserve them.</p>`)}${card('Linked assessment history',S.assessments.filter(a=>a.bulletId===b.id).map(a=>`<p>${new Date(a.date).toLocaleDateString()} · ${a.scores.map((s,i)=>D.rubric[i].name+': '+s).join(' · ')}<br>${esc(a.reason)}</p>`).join('')||'<p>No self-assessments yet.</p>')}`;}
function assessment(){let r=S.lab.assessment??=( {scores:Array(8).fill(0)} );return header('Module D • Judgment, not a magic score','Feedback & assessment','The studio uses self-assessment, stored reference reasoning and transparent decision rules. It does not call an AI service or understand arbitrary prose.')+card('Assess your own attempt first',area('Bullet being evaluated','lab.assessment.bullet',r.bullet,'Paste a draft or open Assess from a portfolio project.',4)+input('Audience and context','lab.assessment.audience',r.audience)+area('Exact promised answer and evidence','lab.assessment.answer',r.answer,'What is actually deliverable? Include conditions.',4)+ratings('lab.assessment.scores',r.scores)+area('Criterion-specific reasons / what works / what is weak','lab.assessment.reason',r.reason,'Support all ratings with observations from the text. Include the likely reader question and a specific proposed revision.',6)+area('Learning from this attempt','lab.assessment.lesson',r.lesson,'Name the lesson you will apply next time.',3)+btn('Record assessment & show decision feedback','recordAssessment','','btn-primary'))+(r.feedback?card('Transparent decision feedback',feedback(r)):'')+card('How to calibrate judgment',`<p>A rating of 5 means the criterion is strongly supported in this context, not “scientifically persuasive.” Another reader may disagree. Ask them what answer they expect, whether they care and what they distrust before showing your rationale.</p><p>Use a recognition exercise on Days 7, 14, 21 or 30 to rank alternatives and defend your choice. These supply model reasoning only after your attempt. No single phrasing is the sole correct answer.</p>${btn('Open next milestone','day',[7,14,21,30].find(n=>!S.lessons[n]?.completed)||30)}`);}
function feedback(r){let s=r.scores||[],weak=D.rubric.filter((x,i)=>s[i]<3),strong=D.rubric.filter((x,i)=>s[i]>=4),b=r.bullet||'';return `<p><b>Based only on your ratings:</b> ${strong.length?'Potential strengths: '+strong.map(x=>x.name).join(', ')+'.':'No dimension was self-rated strong yet.'}</p><p>${weak.length?'Prioritize: '+weak.map(x=>x.name).join(', ')+'.':'No criterion rated below acceptable. That does not establish audience effectiveness.'}</p>${s[5]<4||s[7]<4?'<p class="callout">Credibility or alignment is below 4. Audit the answer and implied claims before polishing intrigue.</p>':''}<p><b>Mechanical observations (not semantic critique):</b> ${b.trim().split(/\s+/).filter(Boolean).length} words; ${b.length} characters. ${/guarantee|always|never|secret|shocking|overnight/i.test(b)?'An absolute or hype-associated word appears. Check whether it is justified; this flag does not prove the copy is bad.':'No monitored hype word found; this does not verify credibility.'}</p><ol class="spaced"><li>Write the likely reader question in plain language. Is it about the answer, or about understanding the sentence?</li><li>Underline the concrete subject and remove unsupported claims.</li><li>Change one low-rated dimension, then compare original and revised against the same criterion.</li><li>Ask an unfamiliar target reader what they expect. Compare with the actual answer.</li></ol><p><b>Your recorded diagnosis:</b> ${esc(r.reason||r.reflection||'')}</p>`;}
function report(){let completed=Object.keys(S.lessons).filter(n=>S.lessons[n].completed),ass=S.assessments,skills=D.rubric.map((r,i)=>{let arr=ass.map(a=>a.scores[i]);return {...r,avg:arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0,low:arr.filter(n=>n<3).length,first:arr[0],last:arr.at(-1)};});let weak=skills.filter(s=>s.avg&&s.avg<3),strong=skills.filter(s=>s.avg>=4),tests=S.portfolio.filter(b=>b.results.trim());return header('Module F • Personal evidence report','What have you demonstrated?','Completion, self-reported quality and real audience evidence are deliberately separate. This report is a local summary, not a mastery certification.')+`<div class="toolbar">${btn('Download personal skill report','downloadReport','','btn-primary')}${btn('Print report','print')}</div><div class="grid-3 section-gap">${card('Completion',`<strong class="stat-value">${completed.length}/30</strong><p>Practice packets submitted</p><p>${S.sessions.length} recorded practice / assessment sessions</p>`)}${card('Production evidence',`<strong class="stat-value">${S.portfolio.length}</strong><p>Portfolio projects · ${S.portfolio.reduce((n,b)=>n+b.versions.length,0)} saved versions</p><p>${new Set(S.portfolio.map(b=>b.mechanism)).size}/18 mechanisms used in saved projects</p>`)}${card('Judgment evidence',`<strong class="stat-value">${ass.length}</strong><p>Self-assessment records</p><p>${tests.length} projects with test notes (may include unrun plans)</p>`)}</div>${card('Skill-level observations',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Criterion</th><th>Self-rating mean</th><th>First → latest</th><th>Ratings below 3</th></tr></thead><tbody>${skills.map(s=>`<tr><td>${s.name}</td><td>${s.avg?s.avg.toFixed(1)+'/5':'No evidence'}</td><td>${s.first?s.first+' → '+s.last:'—'}</td><td>${s.low}</td></tr>`).join('')}</tbody></table></div><p class="form-hint">Means summarize your own judgments across potentially different tasks. They are not objective skill measurements, controlled improvement estimates or conversion results.</p>`)}${card('Milestone readiness',`<div class="grid-2">${[7,14,21,30].map(n=>`<div class="callout"><b>Day ${n} · ${n===30?'Final independent assessment':'Cumulative assessment'}</b><p>${S.lessons[n]?.completed?readiness(S.lessons[n].scores,S.lessons[n].independent):'No submitted evidence yet.'}</p>${btn('Open packet','day',n,'btn-secondary btn-sm')}</div>`).join('')}</div><p><b>Successful program evidence:</b> complete the four cumulative packets, independently produce the final nine-bullet set across three topics and formats using five mechanisms, retain three diagnosed revisions and satisfy promise alignment with traceable sources. The app checks submission completeness; you or an external reviewer must verify these qualitative standards.</p>`)}${card('Strengths, recurring weaknesses & next steps',`<p><b>Potential self-reported strengths:</b> ${strong.length?strong.map(x=>x.name).join(', '):'Not enough strong self-rated evidence yet.'}</p><p><b>Priority practice:</b> ${weak.length?weak.map(x=>x.name).join(', '):'Review your lowest-rated criterion; no low average does not mean no weakness.'}</p><p><b>Repeated low ratings:</b> ${skills.filter(s=>s.low>1).map(x=>x.name+' ('+x.low+')').join(', ')||'No repeated low-rating pattern recorded.'}</p><p>Next week: choose the lowest-supported criterion, retrieve an earlier weak attempt, write three fresh versions on a different topic and seek an unfamiliar target reader’s interpretation. Run a modest real-world test only after verifying every promise.</p><h3 class="card-title">Recent diagnoses</h3>${ass.slice(-5).reverse().map(a=>`<p><b>${new Date(a.date).toLocaleDateString()}</b> ${esc(a.reason)}<br><span class="form-hint">Next learning: ${esc(a.lesson||'Not recorded')}</span></p>`).join('')||'<p>Write criterion-specific reasons in an assessment to build this record.</p>'}`)}${card('Saved work to revisit',S.portfolio.filter(b=>b.favorite).map(b=>`<p>${esc(b.bullet)} ${btn('Revisit','editBullet',b.id,'btn-ghost btn-sm')}</p>`).join('')||'<p>Favorite projects to create your personal review shortlist. “Best” here means selected by you, not highest measured conversion.</p>')}`;}
function reportText(){let lines=['# Fascination Studio — personal skill report','Generated '+new Date().toLocaleString(),'Self-assessed evidence only; not a mastery certificate.','',`Packets: ${Object.values(S.lessons).filter(l=>l.completed).length}/30`,`Portfolio projects: ${S.portfolio.length}`,`Assessment records: ${S.assessments.length}`,'','## Criteria'];D.rubric.forEach((r,i)=>{let a=S.assessments.map(x=>x.scores[i]);lines.push(`${r.name}: ${a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)+'/5 self-rating average; first '+a[0]+', latest '+a.at(-1):'No evidence'}`);});lines.push('','## Milestones');[7,14,21,30].forEach(n=>lines.push(`Day ${n}: ${S.lessons[n]?.completed?readiness(S.lessons[n].scores,S.lessons[n].independent):'Not submitted'}`));lines.push('','## Diagnoses and practice learning');S.assessments.forEach(a=>lines.push(a.date+'\n'+a.reason+'\nNext: '+(a.lesson||'Not recorded')));lines.push('','## Real-world observations (may include plans)');S.portfolio.filter(b=>b.results).forEach(b=>lines.push(b.bullet+'\n'+b.results));lines.push('','## Recommended next steps','Practice the lowest-supported criterion on fresh material. Seek a target reader’s uncued interpretation. Verify all claims before testing. Compare qualified outcomes, not clicks alone.','Calendar completion and rising self-ratings do not establish mastery or causal improvement.');return lines.join('\n');}
