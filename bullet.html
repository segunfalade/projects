<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A private, offline training studio for deliberate fascination-bullet practice."><title>Fascination — The Copywriter’s Practice Studio</title><style>:root {
  --bg-primary: #FAF8F5;
  --bg-secondary: #F2EFE9;
  --bg-surface: #FFFFFF;
  --bg-elevated: #FDFCFB;
  --bg-subtle: #EAE5DC;
  --text-primary: #191816;
  --text-secondary: #4A4741;
  --text-muted: #78736A;
  --border-color: #DFD9CE;
  --border-strong: #C6BEB0;
  --accent-primary: #9E2A2B;
  --accent-primary-hover: #7D1F20;
  --accent-primary-soft: #F9EBEC;
  --accent-secondary: #1D4E56;
  --accent-secondary-soft: #E8F2F4;
  --accent-gold: #B07D2B;
  --accent-gold-soft: #FBF4E6;
  --success: #236B42;
  --success-soft: #E7F4EC;
  --warning: #B86B14;
  --warning-soft: #FDF3E6;
  --danger: #B42318;
  --danger-soft: #FDECEB;
  --shadow-sm: 0 1px 3px rgba(25, 24, 22, 0.06);
  --shadow-md: 0 4px 12px rgba(25, 24, 22, 0.08);
  --shadow-lg: 0 12px 32px rgba(25, 24, 22, 0.14);
  --font-serif: 'Georgia', 'Charter', 'Cambria', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --sidebar-width: 272px;
  --header-height: 60px;
}

[data-theme="dark"] {
  --bg-primary: #121210;
  --bg-secondary: #1A1917;
  --bg-surface: #21201D;
  --bg-elevated: #282622;
  --bg-subtle: #312E29;
  --text-primary: #F2EFE9;
  --text-secondary: #C2BDB3;
  --text-muted: #8C867B;
  --border-color: #35322C;
  --border-strong: #4A463E;
  --accent-primary: #E05A5B;
  --accent-primary-hover: #EB7172;
  --accent-primary-soft: rgba(224, 90, 91, 0.15);
  --accent-secondary: #52B2C2;
  --accent-secondary-soft: rgba(82, 178, 194, 0.15);
  --accent-gold: #E2A94B;
  --accent-gold-soft: rgba(226, 169, 75, 0.15);
  --success: #47B875;
  --success-soft: rgba(71, 184, 117, 0.15);
  --warning: #E59838;
  --warning-soft: rgba(229, 152, 56, 0.15);
  --danger: #F0655B;
  --danger-soft: rgba(240, 101, 91, 0.15);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Layout Shell */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  overflow-y: auto;
  transition: transform 0.25s ease;
}

.sidebar-brand {
  padding: 18px 20px 16px;
  border-bottom: 1px solid var(--border-color);
}

.brand-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-primary);
  font-weight: 700;
  display: block;
  margin-bottom: 3px;
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-primary);
}

.brand-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.sidebar-day-banner {
  margin: 12px 14px;
  padding: 12px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--accent-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.sidebar-day-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-bottom: 4px;
}

.sidebar-day-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.35;
}

.progress-bar-track {
  width: 100%;
  height: 6px;
  background: var(--bg-subtle);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent-primary);
  border-radius: 999px;
  transition: width 0.3s ease;
}

.progress-bar-fill.secondary {
  background: var(--accent-secondary);
}

.progress-bar-fill.success {
  background: var(--success);
}

.nav-section-label {
  padding: 14px 20px 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 600;
}

.nav-list {
  list-style: none;
  padding: 0 10px;
}

.nav-item {
  margin-bottom: 2px;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
}

.nav-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.nav-btn.active {
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-weight: 600;
}

.nav-btn-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.nav-module-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
}

.nav-btn.active .nav-module-tag {
  background: var(--accent-primary);
  color: #fff;
}

.nav-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
}

.sidebar-footer {
  margin-top: auto;
  padding: 14px;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Main Content Area */
.main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Top Header */
.top-header {
  height: var(--header-height);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 80;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mobile-menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--border-color);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  cursor: pointer;
}

.breadcrumb-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.save-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--success-soft);
  color: var(--success);
  border: 1px solid rgba(35, 107, 66, 0.2);
}

.save-status-pill.warning {
  background: var(--warning-soft);
  color: var(--warning);
  border-color: rgba(184, 107, 20, 0.25);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

/* Main Container */
.main-content {
  padding: 28px 34px 64px;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
}

/* Typography & Editorial Headers */
.page-header {
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
}

.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-primary);
  font-weight: 700;
  margin-bottom: 6px;
}

.page-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--text-primary);
}

.page-lead {
  font-size: 15.5px;
  color: var(--text-secondary);
  max-width: 780px;
  margin-top: 8px;
  line-height: 1.6;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 15px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent-primary);
  color: #FFFFFF;
}

.btn-primary:hover {
  background: var(--accent-primary-hover);
}

.btn-secondary {
  background: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.btn-secondary:hover {
  background: var(--bg-subtle);
}

.btn-teal {
  background: var(--accent-secondary);
  color: #FFFFFF;
}

.btn-teal:hover {
  opacity: 0.92;
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: transparent;
}

.btn-ghost:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

.btn-lg {
  padding: 11px 20px;
  font-size: 14.5px;
}

/* Cards & Grid Layouts */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

.card-elevated {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 22px;
  box-shadow: var(--shadow-md);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.card-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Stat Cards */
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.stat-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

.stat-value {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 6px 0 4px;
}

.stat-meta {
  font-size: 12px;
  color: var(--text-secondary);
}

/* Sub-navigation Tabs */
.subnav-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.tab-btn {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.tab-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.tab-btn.active {
  background: var(--text-primary);
  color: var(--bg-surface);
  border-color: var(--text-primary);
}

/* Badges & Pills */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--text-secondary);
}

.badge-crimson {
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
}

.badge-teal {
  background: var(--accent-secondary-soft);
  color: var(--accent-secondary);
}

.badge-gold {
  background: var(--accent-gold-soft);
  color: var(--accent-gold);
}

.badge-success {
  background: var(--success-soft);
  color: var(--success);
}

.badge-warning {
  background: var(--warning-soft);
  color: var(--warning);
}

.badge-danger {
  background: var(--danger-soft);
  color: var(--danger);
}

/* Callout & Editorial Boxes */
.callout {
  padding: 16px 18px;
  border-radius: var(--radius-md);
  border-left: 4px solid var(--accent-primary);
  background: var(--bg-secondary);
  margin: 14px 0;
}

.callout-teal {
  border-left-color: var(--accent-secondary);
  background: var(--accent-secondary-soft);
}

.callout-gold {
  border-left-color: var(--accent-gold);
  background: var(--accent-gold-soft);
}

.callout-success {
  border-left-color: var(--success);
  background: var(--success-soft);
}

.callout-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
  color: var(--text-primary);
}

/* Quote / Fascination Display Box */
.bullet-showcase {
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 1.45;
  padding: 18px 22px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-strong);
  border-left: 4px solid var(--accent-primary);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  margin: 12px 0;
}

.bullet-compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 14px 0;
}

.compare-box {
  padding: 15px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.compare-box.weak {
  background: var(--danger-soft);
  border-left: 4px solid var(--danger);
}

.compare-box.strong {
  background: var(--success-soft);
  border-left: 4px solid var(--success);
}

.compare-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: block;
}

.compare-box.weak .compare-label {
  color: var(--danger);
}

.compare-box.strong .compare-label {
  color: var(--success);
}

/* Forms & Writing Inputs */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 5px;
}

.form-hint {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-textarea.serif-editor {
  font-family: var(--font-serif);
  font-size: 16px;
  line-height: 1.55;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-primary-soft);
}

.editor-meta-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Day Selector Grid in 30-Day Program */
.day-strip {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 22px;
}

.day-pill {
  padding: 8px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.day-pill:hover {
  border-color: var(--accent-primary);
  background: var(--bg-elevated);
}

.day-pill.active {
  background: var(--accent-primary);
  color: #FFFFFF;
  border-color: var(--accent-primary);
}

.day-pill.completed {
  border-color: var(--accent-gold);
  background: var(--accent-gold-soft);
}

.day-pill.competent {
  border-color: var(--success);
  background: var(--success-soft);
}

.day-pill.active.competent,
.day-pill.active.completed {
  background: var(--accent-primary);
  color: #FFFFFF;
}

.day-pill-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}

.day-pill-status {
  font-size: 10px;
  opacity: 0.85;
}

/* Lesson Sections */
.lesson-section {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 22px 24px;
  margin-bottom: 18px;
}

.lesson-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
}

.lesson-step-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-primary);
}

.lesson-prose p {
  margin-bottom: 12px;
  color: var(--text-primary);
  line-height: 1.7;
}

.lesson-prose ul, .lesson-prose ol {
  margin: 10px 0 14px 22px;
}

.lesson-prose li {
  margin-bottom: 6px;
}

/* Rubric Sliders & Tables */
.rubric-row {
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  background: var(--bg-elevated);
}

.rubric-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.rubric-score-btns {
  display: flex;
  gap: 4px;
}

.score-btn {
  width: 30px;
  height: 28px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  border-radius: 4px;
  cursor: pointer;
}

.score-btn.selected {
  background: var(--accent-primary);
  color: #fff;
  border-color: var(--accent-primary);
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}

.data-table th,
.data-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--border-color);
  text-align: left;
  vertical-align: top;
}

.data-table th {
  background: var(--bg-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
}

/* Modal & Scratchpad Drawer */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 14, 12, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  max-width: 780px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 26px;
  box-shadow: var(--shadow-lg);
}

/* Toast Notification */
.toast-container {
  position: fixed;
  bottom: 22px;
  right: 22px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--text-primary);
  color: var(--bg-surface);
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Anatomy Highlight Pills */
.anatomy-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.anatomy-cell {
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
}

.anatomy-cell-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent-primary);
  font-weight: 700;
  margin-bottom: 4px;
}

/* Responsive */
@media (max-width: 1024px) {
  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .day-strip {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .anatomy-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.mobile-open {
    transform: translateX(0);
  }
  .main-wrapper {
    margin-left: 0;
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .grid-2, .grid-3, .grid-4, .bullet-compare-grid, .anatomy-grid {
    grid-template-columns: 1fr;
  }
  .day-strip {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .main-content {
    padding: 18px 16px 48px;
  }
}

@media print {
  .sidebar, .top-header, .subnav-tabs, .no-print {
    display: none !important;
  }
  .main-wrapper {
    margin-left: 0 !important;
  }
  .card, .lesson-section {
    break-inside: avoid;
    box-shadow: none;
    border: 1px solid #ccc;
  }
}

</style></head><body><a class="skip-link" href="#main">Skip to workspace</a><div class="app-shell"><aside id="sidebar" class="sidebar" aria-label="Studio navigation"><div class="sidebar-brand"><div class="brand-mark"><span class="brand-symbol" aria-hidden="true">f</span><div><span class="brand-eyebrow">The copywriter’s studio</span><div class="brand-title">Fascination</div></div></div><p class="brand-subtitle">A 30-day deliberate practice system</p></div><div class="sidebar-day-banner" id="sideProgress"></div><div class="nav-section-label">Learn · write · refine</div><ul class="nav-list" id="nav"></ul><div class="sidebar-footer"><button class="btn btn-secondary" data-action="backup">↓ Export my work</button><p>PRIVATE BY DESIGN<br>Local storage · no account · no AI connection</p></div></aside><div class="main-wrapper"><header class="top-header"><div class="header-left"><button id="menuToggle" class="mobile-menu-btn" data-action="menu" aria-label="Toggle navigation">☰</button><span class="breadcrumb-title" id="breadcrumb"></span></div><div class="header-right"><span id="saveStatus" class="save-status-pill" role="status" aria-live="polite"></span></div></header><main id="main" class="main-content" tabindex="-1"></main></div></div><div id="modal" class="modal-backdrop"></div><div id="toasts" class="toast-container" role="status" aria-live="polite"></div><noscript>This offline studio requires JavaScript. Enable it in a modern browser.</noscript><script>window.STUDIO_DATA={"lessons": [{"day": 1, "title": "See the missing information", "objective": "Distinguish a fascination from a feature, benefit and empty teaser.", "core": "A feature describes the thing; a benefit explains its usefulness. A fascination creates a valuable unanswered question. None is always superior: a buyer ready to purchase may need a clear price rather than another mystery. Reveal the subject and stakes; consider withholding the decisive detail, not the entire meaning.", "weak": "A notebook with numbered pages", "strong": "The notebook detail that helps you retrieve an old meeting decision without reading every page", "answer": "Numbered pages plus a dated index link decisions to locations. This is a hypothetical product method, not a tested performance claim.", "question": "Which detail makes retrieval easier?", "recognition": "Classify four lines: numbered pages; find notes faster; a shocking secret; the notebook detail that helps retrieve a decision. Explain the difference.", "writing": "Choose a familiar product. Write one feature, one benefit, one empty teaser and two genuine fascinations.", "revision": "Replace the empty teaser with a recognizable situation and one missing detail.", "transfer": "Turn your best line into a landing-page subheading.", "criteria": "The final line must identify a subject, a useful question and a deliverable answer.", "review": 1, "stage": 1, "milestone": false, "reference": "Numbered pages = feature; find notes faster = benefit; a shocking secret = empty teaser; the retrieval-detail line = fascination candidate. The candidate still needs audience fit and a non-obvious answer."}, {"day": 2, "title": "Map the anatomy", "objective": "Separate revealed anchors, withheld information and implied payoff.", "core": "Use six lenses: situation, revealed anchor, withheld detail, stakes, payoff and reader. They diagnose copy, not dictate a sentence structure. In a short bullet, one phrase may do several jobs. Do not confuse your inferred explanation with what the author actually wrote.", "weak": "Useful travel advice", "strong": "What never to eat on an airplane.", "answer": "Historical Mel Martin example supplied in the brief. The actual answer is not supplied. Food safety or comfort are possible reader interpretations, not verified explanations.", "question": "Which item should I avoid, and why?", "recognition": "Annotate the airplane line using all six lenses. Mark every inference as an inference.", "writing": "Write three bullets for travelers, with six-part annotations for each. Use only information you can actually supply.", "revision": "Fix the line whose subject or payoff requires the most explanation.", "transfer": "Adapt it as a video hook without inventing a safety warning.", "criteria": "Your annotation must separate text, interpretation and unknown answer.", "review": 1, "stage": 1, "milestone": false, "reference": "Airplane is the setting. “Never” supplies a prohibition. The item and reason are missing. A health or comfort payoff is an inference; do not invent the actual menu item or claim the original answer is known."}, {"day": 3, "title": "Curiosity is conditional", "objective": "Explain why a gap matters to one reader and not another.", "core": "Information-gap accounts of curiosity suggest that awareness of missing knowledge can motivate attention. This is not a law that every open loop forces reading. Relevance, comprehension, credibility, expected usefulness and cost all change the response. A puzzle about an irrelevant detail can be ignored effortlessly.", "weak": "A secret every professional needs", "strong": "If your client approves the proposal but delays the deposit, which sentence should your follow-up lead with?", "answer": "Illustrative answer: state the agreed start date and ask whether the deposit will clear before that date. No collection result is guaranteed.", "question": "What sentence gets a concrete next step?", "recognition": "Compare an interested freelancer and a salaried analyst. Which reader has a reason to care? Why might even the freelancer ignore it?", "writing": "Write the same useful insight for two audiences; include a reason each would want the answer.", "revision": "Remove the assumed universal promise from your weaker version.", "transfer": "Write a helpful DM that gives enough context to avoid feeling like bait.", "criteria": "Name a plausible reason your target reader still would not click.", "review": 1, "stage": 1, "milestone": false, "reference": "A freelancer who is waiting for a deposit may value a next-step sentence. A salaried analyst may not have that task. Even the freelancer can ignore it if the sender lacks credibility or the advice seems obvious."}, {"day": 4, "title": "Specificity without invention", "objective": "Use concrete details as anchors without manufacturing proof.", "core": "Specificity clarifies an idea but does not prove it. A precise fake percentage is worse than an honest general statement. Use observable nouns, real steps and documented conditions. Numbers belong only when countable in your material or supported by appropriate evidence.", "weak": "The amazing way to avoid admin", "strong": "The invoice field to check before you chase an apparently late payment", "answer": "Illustrative workflow: compare the purchase-order reference on the invoice with the buyer’s approved PO. A mismatch can delay processing; it is not the only cause.", "question": "Which field could explain the delay?", "recognition": "Which is safer: “cuts delays by 84%” with no study, or “the invoice field to check”? Explain evidence needed for the first.", "writing": "Extract five concrete nouns from a product you know. Draft three lines with no invented metrics.", "revision": "Replace every unsupported superlative or statistic.", "transfer": "Compress one into an email subject under 55 characters.", "criteria": "Concrete detail must come from your source, not decorative precision.", "review": 1, "stage": 1, "milestone": false, "reference": "The unsupported 84% is not evidence. A study would need a defined sample, outcome, comparison and scope. “Invoice field” supplies an identifiable object without pretending to quantify results."}, {"day": 5, "title": "Intrigue or confusion?", "objective": "Keep the subject understandable while leaving one useful detail unresolved.", "core": "Useful withholding narrows the reader’s question. Confusion multiplies possible meanings. “The blue method” with no context offers no recognizable task or payoff. Write the literal answer first, then hide only the information that is both valuable and non-obvious. Sometimes giving a direct tip is the right choice.", "weak": "The blue method changes everything", "strong": "The calendar setting that stops a client booking over your lunch break", "answer": "Illustrative answer: add a recurring unavailable block that the scheduler respects; check the tool’s calendar integration.", "question": "Which calendar setting protects lunch?", "recognition": "Compare both lines. Write the exact question each produces; flag the line that only creates “What does that mean?”", "writing": "Draft four versions of a scheduling tip: fully revealing, too blind, balanced and intentionally direct.", "revision": "Repair the too-blind version without adding more than five words.", "transfer": "Use the direct version as a CTA and explain why clarity beats mystery there.", "criteria": "A reader can identify the task before discovering the withheld setting.", "review": 1, "stage": 1, "milestone": false, "reference": "The blue-method line mainly provokes “what is that?” The calendar line makes the subject and task clear, then asks which setting. A direct CTA can appropriately reveal the action."}, {"day": 6, "title": "Check the promise", "objective": "Audit literal and implied claims against the answer you can deliver.", "core": "A bullet creates a contract of expectation, including implications. An accurate sentence can still mislead if the likely inference is false. Keep an answer ledger: source, actual answer, limits, and location. If no answer exists, research first. Historical health, legal and financial swipes are not current evidence.", "weak": "This secret wipes out every fee", "strong": "The account fee to check before you move your emergency fund", "answer": "Illustrative answer: compare maintenance fees, minimum balances and withdrawal conditions in the actual account terms. No institution-specific fee claim is assumed.", "question": "Which fee could offset the benefit?", "recognition": "Audit “The bills it’s OK to pay late.” What facts and jurisdiction-specific terms would you need before publishing a modern adaptation?", "writing": "Write three bullets and an exact deliverable answer, its limits and source for each.", "revision": "Remove an implication your source cannot substantiate.", "transfer": "Make one into an honest lead magnet title.", "criteria": "Every important promise has an answer and a source or is explicitly hypothetical.", "review": 1, "stage": 1, "milestone": false, "reference": "You would need current account or creditor terms, penalty and reporting rules, eligibility and jurisdiction. “OK” could misleadingly imply no adverse consequence; neither the brief nor bank proves that."}, {"day": 7, "title": "Milestone 1: diagnose blind", "objective": "Retrieve the fundamentals without copying a model.", "core": "Work closed-book first. Recognition is easier than production, so assess both. Diagnose subject, gap, relevance and credibility; then write and revise. A high self-rating alone is not independent evidence. Use a peer or audience check when available.", "weak": "Discover the secret to better work", "strong": "If your meeting notes never become assigned tasks, inspect this handoff before buying another app", "answer": "Illustrative answer: check whether every decision is recorded with one named owner and a next date.", "question": "Which handoff loses ownership?", "recognition": "Rank: “Boost productivity”; “The secret they hide”; the meeting-notes line. Justify strongest and name one weakness.", "writing": "From a product you know, draft three distinct bullets without viewing examples. Annotate the strongest and write its real answer.", "revision": "Revise your weakest using one diagnosis from Days 1–6.", "transfer": "Adapt the winner to a subject line and a sales-page bullet.", "criteria": "Submit a closed-book diagnosis, original, revised version and answer ledger; score all eight rubric dimensions.", "review": 1, "stage": 1, "milestone": true, "reference": "The meeting-notes line is the best curiosity candidate for a reader with that problem. “Boost productivity” is a generic benefit; “secret they hide” offers no usable subject. The best candidate could still be too familiar or poorly substantiated."}, {"day": 8, "title": "Mine real questions", "objective": "Extract useful angles from audience language rather than starting with formulas.", "core": "Collect raw customer questions with context and consent where needed. Preserve exact wording separately from your interpretation. Ask what decision prompted the question and what answer would change it. Research is an extraction process, not permission to invent a surprising fact.", "weak": "Our course has flexible lessons", "strong": "What to do when you miss a week of lessons—without restarting the course", "answer": "Hypothetical course policy: use a short retrieval quiz, then repeat only missed skills before returning. Verify a real course supports this before use.", "question": "How can I restart without wasting completed work?", "recognition": "Find the private worry in “Will I fall behind if I travel?” Distinguish it from a request for lesson length.", "writing": "Collect or clearly simulate five audience questions. Label simulated research. Extract three different decisions and write one bullet per decision.", "revision": "Replace a generic benefit with a phrase that reflects an actual worry.", "transfer": "Write a course onboarding email opener.", "criteria": "Keep raw quote, interpretation, answer and final bullet linked.", "review": 1, "stage": 2, "milestone": false, "reference": "The question expresses fear of lost progress or time, not merely a request for lesson duration. Keep this inferred worry distinct from the literal quote and validate it where possible."}, {"day": 9, "title": "Features into discoveries", "objective": "Trace a technical property to a meaningful situation.", "core": "Use feature → use moment → friction removed → answer → framing. Do not jump from a specification to an unproved performance outcome. A local cache means work may remain available offline; it does not automatically mean data can never be lost. Explore conditions and exceptions first.", "weak": "Includes offline mode", "strong": "Which inspection notes remain available when your technician loses cell service?", "answer": "Hypothetical software: previously downloaded work orders are available offline; sync requires connectivity and conflict handling. Verify actual behavior.", "question": "What can I still access offline?", "recognition": "Find the unsupported leap in “Offline mode means you will never lose data.”", "writing": "Pick three product features. Trace each to a specific use moment and draft three discoveries.", "revision": "Add a necessary condition without making the line unreadable.", "transfer": "Adapt one as a product-description bullet.", "criteria": "Your payoff follows from a real capability, with limits preserved.", "review": 2, "stage": 2, "milestone": false, "reference": "Offline access does not imply zero risk of loss. The relevant conditions include which records were downloaded, device state and how syncing works."}, {"day": 10, "title": "Hidden mistakes", "objective": "Reveal a preventable error without shaming the reader.", "core": "A mistake angle works when a diligent person could plausibly make the error. Name the situation and the consequence, then withhold the discriminating step. Avoid unsupported “biggest cause” claims. Make the answer actionable and preserve other possible explanations.", "weak": "Avoid expensive hiring mistakes", "strong": "The reference-check question that helps distinguish a great interview from reliable follow-through", "answer": "Illustrative answer: ask for a specific example of meeting a commitment under pressure, then probe the referee’s direct observation. Not a guarantee of hiring quality.", "question": "Which question reveals follow-through?", "recognition": "Why is “the number-one hiring mistake” a stronger evidence burden than “a reference-check question”?", "writing": "Write four mistakes your reader could make in good faith; choose two with usable corrective answers.", "revision": "Replace blame or insult with an observable situation.", "transfer": "Use the strongest as a consulting email opener.", "criteria": "The corrective answer is specific, feasible and not a universal cure.", "review": 3, "stage": 2, "milestone": false, "reference": "“Number one” asserts a comparative ranking across causes. “A reference-check question” promises a specific tool without claiming it dominates all hiring outcomes."}, {"day": 11, "title": "Counterintuitive exceptions", "objective": "Challenge a belief only where a real exception exists.", "core": "Contradiction is not insight. State the common assumption, identify a documented condition where it fails, explain the reason, then tease that condition. “Right? Wrong!” can overstate a nuanced answer. A conditional reversal is often more honest and more useful.", "weak": "More options are always better", "strong": "When removing a pricing option makes the remaining plans easier to compare", "answer": "Illustrative scenario: two tiers differ only in naming; merging them removes a distinction with no meaningful use-case difference. No conversion lift is assumed.", "question": "Which option is adding confusion?", "recognition": "Explain why “fewer plans always sell more” is not justified by this scenario.", "writing": "List five assumptions in your market. Find one legitimate exception and draft three framings around it.", "revision": "Add the boundary condition to an over-broad reversal.", "transfer": "Create a social post opener that promises an explanation, not a miracle.", "criteria": "The contrarian claim has a reason and a stated scope.", "review": 4, "stage": 2, "milestone": false, "reference": "The example supports removing a meaningless distinction in a defined scenario. It cannot justify a universal claim about fewer tiers or a measured conversion effect."}, {"day": 12, "title": "Hidden causes", "objective": "Connect symptoms to a plausible cause without false certainty.", "core": "A hidden-cause angle helps an audience that has tried obvious fixes. Distinguish correlation, hypothesis and demonstrated cause. Promise a diagnostic check when you cannot establish causality. In medical or legal contexts do not improvise causal advice from a swipe.", "weak": "Your leads are bad", "strong": "Before replacing your lead source, check where qualified enquiries stop reaching sales", "answer": "Illustrative answer: test the form-to-CRM handoff with a controlled submission and inspect assignment rules. This diagnoses routing, not every pipeline problem.", "question": "Could a routing failure be losing good enquiries?", "recognition": "Compare “Your CRM is killing sales” with the diagnostic line. Which claims more than the evidence supports?", "writing": "Map three symptoms to two possible causes each. Draft a diagnostic fascination for one.", "revision": "Change a false certainty into a useful check.", "transfer": "Write a short video hook with a promised demonstration.", "criteria": "The answer explains a test and acknowledges alternatives.", "review": 5, "stage": 2, "milestone": false, "reference": "The CRM accusation asserts a cause. A controlled routing test investigates a possible cause while leaving alternatives open."}, {"day": 13, "title": "Distinct angles, not synonyms", "objective": "Generate genuinely different unanswered questions from one source.", "core": "Angle diversity changes the information the reader wants, not just the opening word. Examine a mistake, cause, overlooked benefit, consequence, objection and useful shortcut. Reject any angle for which you lack an answer. A smaller set of grounded options beats a large stack of fabricated ones.", "weak": "A better reusable bottle", "strong": "The removable bottle part to check when yesterday’s coffee flavour lingers", "answer": "Hypothetical product instructions: remove and wash the lid gasket according to care guidance. Verify materials and disassembly safety.", "question": "Which part retains the flavour?", "recognition": "Are “Discover the bottle secret” and “The bottle secret revealed” different angles? Explain.", "writing": "Use one product manual or source paragraph. Produce six angle questions, select three answerable ones and draft them.", "revision": "Delete two synonym-only versions and replace with different questions.", "transfer": "Turn one into an ad and one into a helpful DM.", "criteria": "At least three versions promise different information from the same factual source.", "review": 6, "stage": 2, "milestone": false, "reference": "The two secret variants invite the same question. A mistake angle and a cleaning-detail angle might be distinct only if each has a different real answer."}, {"day": 14, "title": "Milestone 2: research to draft", "objective": "Produce a small evidence-backed bullet set from raw material.", "core": "Return to Day 7 and retrieve your weakest criterion. Today build from a source rather than a swipe. Keep a ledger of facts, inferred value and unsupported claims removed. Use at least three mechanisms; do not select a mechanism merely because you have not used it yet.", "weak": "Learn everything about our service", "strong": "What your onboarding checklist should settle before the first client call", "answer": "Hypothetical consulting process: confirm owner, source files and decision deadline before kickoff. This is a procedural recommendation.", "question": "What must be settled before kickoff?", "recognition": "Evaluate two claims from your chosen source: one explicit, one inferred. Which can you publish as fact?", "writing": "Use a real product page, manual or customer interview. Draft six bullets across three mechanisms; record answer and source for each.", "revision": "Revise two low-scoring bullets and explain the changes without using “punchier.”", "transfer": "Adapt two to different channels.", "criteria": "A source ledger, six drafts, two revisions and complete self-assessment form the milestone packet.", "review": 7, "stage": 2, "milestone": true, "reference": "An explicit source fact can support a properly scoped claim. An inference should be marked as an interpretation or tested, not laundered into a statistic."}, {"day": 15, "title": "Choose useful specifics", "objective": "Select details that narrow the question rather than decorate the sentence.", "core": "A count is useful when it helps a reader imagine a bounded answer. “Three renewal clauses” is meaningful only if your material actually contains three. Choose a concrete object, condition or moment before reaching for a statistic. Precision should reduce uncertainty about the subject, not simulate authority.", "weak": "The ultimate lease guide", "strong": "The renewal clause to check before you budget next year’s rent", "answer": "Illustrative answer: inspect escalation terms and notice deadlines in the actual lease; get qualified advice for interpretation.", "question": "Which clause changes the renewal cost?", "recognition": "Which details aid comprehension: “ultimate”, “renewal clause”, “next year”, an unsupported “38%”?", "writing": "Draft five lines using objects, moments or conditions from your source; use no numerical results.", "revision": "Shorten the best line without removing its identifying noun.", "transfer": "Write a lead magnet title with a clear deliverable.", "criteria": "Each specific has a source and helps the reader identify the issue.", "review": 8, "stage": 3, "milestone": false, "reference": "“Renewal clause” and “next year” identify an object and decision moment. “Ultimate” adds little. An unsupported 38% creates an unjustified evidence burden."}, {"day": 16, "title": "Value of the answer", "objective": "Improve the payoff rather than increasing hype.", "core": "A gap can be clear but commercially irrelevant. Ask what decision the answer enables, what friction it removes and what happens if the reader does nothing. If the payoff is trivial, find a better insight instead of attaching “shocking” to it. Curiosity is an invitation to value, not a substitute for value.", "weak": "The secret colour of our dashboard", "strong": "Which dashboard view shows unassigned client requests before the weekly handoff?", "answer": "Hypothetical tool: filter open requests by owner equals blank. This helps inspect ownership but does not guarantee no request is missed.", "question": "Where can I find unassigned requests?", "recognition": "Explain why a founder might care about unassigned work more than a hidden colour setting.", "writing": "Rank five potential answers by audience usefulness. Draft only the top two and explain the decision each supports.", "revision": "Replace a trivial answer with a higher-value one from the same product.", "transfer": "Make one a sales email opening line.", "criteria": "The answer supports an identifiable task or decision.", "review": 9, "stage": 3, "milestone": false, "reference": "Unassigned requests can affect ownership and client service. A hidden colour setting may be trivial unless it supports a consequential task for that reader."}, {"day": 17, "title": "Audience awareness", "objective": "Adjust the revealed information to the reader’s starting knowledge.", "core": "An unaware reader needs a recognizable symptom; a solution-aware reader may care about trade-offs; a buyer ready to act may need direct terms. These are planning lenses, not fixed psychological stages. Explain essential jargon for novices and remove elementary mysteries for experts.", "weak": "The API secret everyone needs", "strong": "What happens to queued orders when your integration hits a rate limit?", "answer": "Hypothetical integration: retries use backoff; failed requests appear in a review queue. Check real documentation.", "question": "Are orders retried or dropped?", "recognition": "Would this line help a shop owner unfamiliar with APIs? What context is missing?", "writing": "Write one insight for a novice owner and an experienced developer. Name what each already knows.", "revision": "Replace an expert’s obvious question with a real implementation trade-off.", "transfer": "Create a landing-page hook for each audience.", "criteria": "Each version withholds something the intended reader plausibly does not know.", "review": 10, "stage": 3, "milestone": false, "reference": "A nontechnical owner may need “when your shop sends too many orders at once” rather than API terminology. An expert may want retry, queue and failure semantics."}, {"day": 18, "title": "Skeptical-reader edit", "objective": "Earn trust through restraint, mechanisms and verifiable boundaries.", "core": "Sophisticated readers often reject blanket secret language and invented villains. Concrete operational nouns and modest claims can outperform intensity. Treat naming a mechanism as a memory aid, never as evidence. Admit a limitation when it matters to the buying decision.", "weak": "The revolutionary system agencies fear", "strong": "The handoff check we use when two consultants share one client account", "answer": "Illustrative process: compare named owner, last commitment and next date before switching responsibility. No agency conspiracy or measured uplift is implied.", "question": "What does the handoff check cover?", "recognition": "Identify the unsupported villain and superlative in the weak line.", "writing": "Rewrite three hype-heavy bullets for a skeptical operations director. Add a genuine limitation to one.", "revision": "Replace “secret”, “revolutionary” and “guaranteed” with concrete information or delete them.", "transfer": "Write a restrained consulting proposal bullet.", "criteria": "No conspiratorial implication or ungrounded guarantee remains.", "review": 11, "stage": 3, "milestone": false, "reference": "The weak line invents an adversary (“agencies fear”) and an exceptional status (“revolutionary”). Neither demonstrates a useful process."}, {"day": 19, "title": "Variation under constraints", "objective": "Explore different framings without changing the facts.", "core": "Variation is useful when you deliberately change subject emphasis, revealed detail or question—not facts. Constraints force selection. Do not confuse shorter with better: retain the reader’s ability to identify both the topic and value. Draft freely, then select against a rubric.", "weak": "Improve your revision process", "strong": "The comment to resolve before another round of design revisions", "answer": "Illustrative answer: clarify which stakeholder has final approval when comments conflict.", "question": "Which unresolved comment blocks progress?", "recognition": "Compare a 12-word clear line and a 7-word cryptic line you write. Explain the trade-off.", "writing": "Write five distinct framings of one verified answer: under 12 words, question, consequence, symptom and outcome-led.", "revision": "Improve the weakest without making it longer.", "transfer": "Make a subject/preheader pair whose parts add information rather than repeat.", "criteria": "Facts and promise remain stable across all five variants.", "review": 12, "stage": 3, "milestone": false, "reference": "The shorter line is not better if it removes the recognizable task. Compare whether a new reader can state the intended question, not just which rhythm you prefer."}, {"day": 20, "title": "Revision with a diagnosis", "objective": "Make a targeted change and preserve a traceable version history.", "core": "Revision begins with a cause: vague subject, low payoff, implausible implication, obvious answer or mismatched audience. Record original → diagnosis → change → expected effect → new risk. Compare against the same criteria; liking the new rhythm is not evidence of improved conversion.", "weak": "Get better results from feedback", "strong": "Which feedback request turns “looks good” into a usable editing decision?", "answer": "Illustrative answer: ask the reviewer to identify the passage least clear to the intended reader and explain why.", "question": "What should I ask a vague reviewer?", "recognition": "What specifically changes between these two lines: subject, missing detail, payoff or evidence burden?", "writing": "Retrieve your lowest-scoring earlier draft. Create three revisions, each targeting a different problem.", "revision": "Select a winner and explain both the improvement and one remaining weakness.", "transfer": "Adapt the winner as a DM without sounding manipulative.", "criteria": "Keep original and all revisions; select a winner with reasoning.", "review": 13, "stage": 3, "milestone": false, "reference": "The revision replaces a generic improvement promise with a familiar review response, a concrete editing decision and a withheld request. It still needs a useful answer."}, {"day": 21, "title": "Milestone 3: controlled critique", "objective": "Evaluate and revise under constraints across two audiences.", "core": "Retrieve mechanisms from Days 8–14 without a list. Use the rubric to compare your own versions before viewing any reference. Inspect alignment first: an exciting but unsupported line cannot pass by averaging high creativity scores. Score changes are self-observations, not measured conversion gains.", "weak": "A breakthrough for every team", "strong": "If your project board is up to date but deadlines still slip, inspect this ownership gap", "answer": "Illustrative answer: tasks have assigned workers but no single person accountable for the final dependency handoff. Other causes may also exist.", "question": "Which ownership gap is hiding on the board?", "recognition": "Rank three of your earlier bullets and justify the strongest for two different readers.", "writing": "Write four bullets for two audiences from one source. Include at least three mechanisms retrieved from memory.", "revision": "Revise two without increasing length; record before and after rubric ratings.", "transfer": "Transfer two winners into an email and a sales page.", "criteria": "A complete packet includes rankings, four drafts, two constrained revisions and claim audits.", "review": 14, "stage": 3, "milestone": true, "reference": "The strongest ranking depends on reader priorities. A developer might care about implementation conditions while a manager cares about ownership. Explain the criterion rather than asserting a universal winner."}, {"day": 22, "title": "Sales-page sequencing", "objective": "Build a set with varied entry points and coherent promises.", "core": "A bullet stack should offer multiple relevant discoveries, not ten versions of one mystery. Vary stakes and mechanisms while keeping one offer clear. Sequence by reader priorities; do not assume a “blind bullet ratio” universally predicts results. Direct facts can sit alongside curiosity when buyers need them.", "weak": "Everything you need to onboard", "strong": "What to agree before kickoff so a missing approver does not stall delivery", "answer": "Hypothetical playbook: name decision authority and backup approval before scheduling implementation. No delay-prevention guarantee.", "question": "What agreement prevents an approval bottleneck?", "recognition": "Audit a three-bullet stack for duplicated questions and contradictory promises.", "writing": "Write a six-bullet set for a real offer: two practical, two diagnostic and two objection-led. Map each to a real answer.", "revision": "Remove the weakest duplicate and replace it with a new decision.", "transfer": "Select one as the page headline and explain whether it is broad enough.", "criteria": "Every bullet points to distinct useful content in the same offer.", "review": 15, "stage": 4, "milestone": false, "reference": "Repeated questions do not add distinct value to a stack. Check that each line has its own answer and that conditions do not contradict one another."}, {"day": 23, "title": "Inbox curiosity", "objective": "Fit a truthful subject and preheader to an email’s actual content.", "core": "The inbox has little context. Reveal the topic early; use the preheader to add stakes or scope. A character budget is a design constraint, not a performance law. Never imply a reply, personal emergency or account problem to manufacture opens. Inspect the first paragraph for immediate promise delivery.", "weak": "You won’t believe this", "strong": "Before you renew your scheduling tool", "answer": "Illustrative email explains checking calendar conflict handling and team-seat terms before renewal.", "question": "What should I check before renewal?", "recognition": "Compare an honest renewal subject with “RE: Your account is in danger.” Identify misleading implications.", "writing": "Create three subject/preheader pairs for one actual email; keep each subject below 55 characters. Write the first paragraph and answer.", "revision": "Cut repetition between subject and preheader while preserving the topic.", "transfer": "Turn one into a sales email opening line.", "criteria": "The email pays off the subject without irrelevant suspense.", "review": 16, "stage": 4, "milestone": false, "reference": "An honest renewal subject describes the topic. A false “RE:” or invented account emergency misrepresents relationship or urgency, even if it increases opens."}, {"day": 24, "title": "Video and social hooks", "objective": "Create a comprehensible first line and satisfy it promptly.", "core": "A hook must survive without a sales page around it. Use a visible situation or a recognisable decision. Reveal the promised answer early enough to respect the viewer; do not stretch a trivial payoff across a long video. Retention is not the same as a qualified action.", "weak": "Wait until the end for this secret", "strong": "If your exported spreadsheet loses leading zeros, check this import setting first", "answer": "Illustrative demo: import the affected identifier column as text, using the actual spreadsheet tool’s import options.", "question": "Which setting preserves the identifiers?", "recognition": "Why would a vague “wait for it” hook be less useful to an analyst with a live problem?", "writing": "Write three 15–25-word video hooks, a 90-word demonstration script and a two-line social opener.", "revision": "Remove one inflated stake and replace it with a visible symptom.", "transfer": "Make a lead magnet title that promises a troubleshooting checklist.", "criteria": "The script resolves the exact hook and does not imply unsupported loss.", "review": 17, "stage": 4, "milestone": false, "reference": "An analyst with a live issue wants a recognizable symptom and a prompt demonstration. A vague wait-for-it request raises attention cost before revealing value."}, {"day": 25, "title": "Permission-based outreach", "objective": "Use relevant observation without pretending intimacy or knowledge.", "core": "A DM should earn attention by being relevant and low-friction. Use only public or provided context; do not invent a recipient’s pain. Sometimes reveal the useful detail and ask permission to send a guide. Reply rate alone cannot show trust or qualified demand.", "weak": "I know your team is losing money", "strong": "If you are comparing booking tools, I have a checklist for the calendar conflicts demos rarely show. Want it?", "answer": "Hypothetical asset: a checklist to test overlapping calendars, time zones and blocked time. Do not claim demos rarely show it without observation; safer alternative: “a checklist to test calendar conflicts.”", "question": "What should I test beyond the demo?", "recognition": "Locate the unsupported assumption in the weak line and the “rarely” claim in the sample. Rewrite both.", "writing": "Write two permission-based DMs for distinct audiences using actual context and a real useful asset.", "revision": "Reveal enough of the asset to make its usefulness judgeable.", "transfer": "Turn one into an ad CTA that explains what happens after clicking.", "criteria": "No false personalization; the offered asset exists and matches the promise.", "review": 18, "stage": 4, "milestone": false, "reference": "“I know” asserts private knowledge you may not have. “Demos rarely show” makes a comparative frequency claim. Safer outreach offers a concrete calendar-conflict checklist without either assertion."}, {"day": 26, "title": "Regulated and high-stakes copy", "objective": "Recognize when evidence and qualified review must lead the writing.", "core": "Financial, health and legal claims can cause real harm. Historical swipes often use guarantees, absolutes or outdated claims. Analyze their structure without endorsing the advice. Avoid invented causality and outcome promises. Jurisdiction, product terms and qualified compliance review matter; a disclaimer does not cure a misleading headline.", "weak": "Erase every tax bill instantly", "strong": "The record to gather before you ask an adviser about a home-office deduction", "answer": "Illustrative educational answer: gather records of business use and expenses, then check applicable rules with a qualified adviser. No entitlement is asserted.", "question": "Which records support an informed advice session?", "recognition": "Take one high-stakes example from the vault. Separate rhetorical technique from facts needing independent verification.", "writing": "Write three cautious educational bullets in finance, health or property. List evidence and reviewer needed for each.", "revision": "Remove an implied guarantee even if the literal words are hedged.", "transfer": "Create a financial-services lead magnet title without investment promises.", "criteria": "No unsupported entitlement, safety claim, medical outcome or guaranteed return.", "review": 19, "stage": 4, "milestone": false, "reference": "A historical headline can teach withholding while making an unsupported claim. List the exact factual propositions and evidence needed; rhetorical strength is not factual support."}, {"day": 27, "title": "Measure beyond the click", "objective": "Design a practical real-world test with relevant outcomes.", "core": "A/B tests need a clear hypothesis, stable destination and meaningful outcome. Opens and clicks can increase while qualified actions fall. Small samples are noisy; do not declare winners from tiny differences. Record exposure, outcome definition, timing, audience and limitations. Keep promised information identical when isolating framing.", "weak": "This version feels stronger", "strong": "Which renewal detail is worth checking before you compare the headline price?", "answer": "Illustrative content explains matching term length, included seats and overage rules before price comparison.", "question": "Which detail changes a fair price comparison?", "recognition": "If A has 20 clicks/100 views and B 18/100, can you confidently claim A converts better? What else is missing?", "writing": "Design a two-variant test with hypothesis, audience, exposure count, primary qualified outcome and guardrail. If unrun, label it a plan.", "revision": "Improve one variant without changing the underlying offer.", "transfer": "Record actual observations in the portfolio or label them “not run.”", "criteria": "Separate practice preference, self-rating and observed audience behavior.", "review": 20, "stage": 4, "milestone": false, "reference": "The small click-count difference is noisy and says nothing by itself about qualified conversion. You need a defined outcome, comparable exposure, uncertainty analysis and trustworthy promise delivery."}, {"day": 28, "title": "Spaced retrieval and repair", "objective": "Return to recurring weaknesses without relying on familiar examples.", "core": "Use earlier feedback to choose today’s constraint. Retrieve before rereading: explain the principle, produce new work, then compare. Repeating a favorite mechanism can hide a weakness elsewhere. Improvement means applying a diagnosis to a fresh topic, not only polishing one well-known line.", "weak": "A secret to better lessons", "strong": "The review question that reveals whether you can use a lesson without looking back", "answer": "Illustrative answer: solve a new problem from memory, then explain the reason for the solution and compare with a reference.", "question": "Which retrieval question tests transfer?", "recognition": "Revisit Days 7, 14 and 21. Which weak criterion recurs? Quote evidence from your drafts.", "writing": "On a new topic, draft four bullets using your two least-practiced mechanisms. Explain the answer for each.", "revision": "Repair the recurring weakness in two drafts; compare them with the older attempts.", "transfer": "Choose a channel you have used least and adapt a winner.", "criteria": "Name a recurring error, show an old example and demonstrate a repair on a fresh topic.", "review": 21, "stage": 4, "milestone": false, "reference": "Quote an earlier draft and feedback reason. A repeated weakness is a pattern in evidence, not simply the criterion you dislike. Repair it on fresh material."}, {"day": 29, "title": "Capstone rehearsal", "objective": "Work from a minimally guided brief and audit delivery.", "core": "Choose a real audience, an offer you can inspect and a decision worth influencing. Build your own brief and source ledger before writing. No model should supply your angle. Use the reference only after your first attempt to check reasoning, not borrow wording. Identify gaps that require research instead of filling them with confidence.", "weak": "We have the best training", "strong": "What a learner should be able to demonstrate before skipping the practice session", "answer": "Illustrative instructional answer: solve a novel task, explain the reasoning and meet the stated rubric without a worked example.", "question": "Which demonstration justifies skipping practice?", "recognition": "Audit your own brief: what would a skeptical reader need verified?", "writing": "Produce eight bullets across two topics and three formats, using at least four mechanisms. No vault until you finish.", "revision": "Select three, revise each, and write delivery locations for every promised answer.", "transfer": "Package one as a landing-page hook, one as email and one as a video opener.", "criteria": "Complete a source audit, drafts, three revision histories and criterion-specific justification.", "review": 22, "stage": 4, "milestone": false, "reference": "Your brief should identify audience, decision, actual product answer and verification gaps. Missing evidence is a research task rather than a creative invitation."}, {"day": 30, "title": "Final independent assessment", "objective": "Demonstrate transferable judgment and set a next-practice plan.", "core": "The calendar is not a mastery certificate. Assess independent generation, diagnosis, revision and transfer using unfamiliar material. Seek another reader’s interpretation when possible. A promising self-assessed result should still be validated in use. Document what you have not demonstrated as clearly as what you have.", "weak": "Master copywriting in 30 days guaranteed", "strong": "The gap in your best bullet that only an unfamiliar reader can reveal", "answer": "Illustrative answer: ask a target reader what they expect to learn, then compare that expectation with the actual answer. Do not coach their response first.", "question": "Does the reader expect the answer I actually provide?", "recognition": "Rank three new candidates you create; defend the winner and explain when a clear benefit would work better.", "writing": "Closed-book: choose three different topics and audiences; write nine bullets across sales page, email and video, with at least five mechanisms. Provide sources and exact answers.", "revision": "Revise three weak attempts without increasing one of their lengths. Explain changes and remaining risks.", "transfer": "Create a complete three-channel mini-campaign for one winner, including promise delivery.", "criteria": "Final packet: nine bullets, three revisions, three-channel campaign, full rubric and next steps. Report “self-assessed” unless independently reviewed.", "review": 23, "stage": 4, "milestone": true, "reference": "An effective winner is context-dependent. A direct benefit or clear price may beat fascination when the audience already wants the solution and needs terms, not another mystery."}], "mechanisms": [{"id": 1, "name": "Curiosity gap / open loop", "logic": "Expose a useful situation but leave one identifiable detail missing.", "when": "When the answer matters and is not already obvious.", "fail": "An irrelevant riddle or withholding the subject entirely.", "practice": "Write the full answer, then hide just its decisive detail.", "weak": "Useful notebook tips", "example": "The notebook detail that helps retrieve an old meeting decision", "exampleAnswer": "Numbered pages linked to a dated index. The gap is the organizing detail, not the subject."}, {"id": 2, "name": "Unexpected benefit", "logic": "Connect a familiar feature to a non-obvious useful payoff.", "when": "When secondary value is real and relevant.", "fail": "An invented side effect or irrelevant novelty.", "practice": "Trace a feature two steps downstream and verify the link.", "weak": "Our bottle is easy to clean", "example": "The removable lid part that can stop yesterday’s coffee flavour lingering", "exampleAnswer": "In this hypothetical design, a removable gasket can be washed according to the care instructions. The less obvious payoff is flavour, not merely ease of cleaning."}, {"id": 3, "name": "Counterintuitive truth", "logic": "Show a legitimate exception to an intuitive rule.", "when": "When you can explain the boundary condition.", "fail": "Contradiction for attention or universal claims from one case.", "practice": "State belief, exception and supporting reason before drafting.", "weak": "Always add more pricing tiers", "example": "When removing a plan makes your pricing easier to compare", "exampleAnswer": "Hypothetical case: two tiers differ only by name. Removing a meaningless distinction helps comparison; it does not establish a conversion lift."}, {"id": 4, "name": "Hidden mistake", "logic": "Identify a preventable error a diligent reader could make.", "when": "When you have a specific correction.", "fail": "Shame, fear or an unproved number-one-cause claim.", "practice": "Mine support cases for repeated, correctable errors.", "weak": "Avoid invoice errors", "example": "The invoice field to check before you chase an apparently late payment", "exampleAnswer": "Compare the purchase-order reference against the buyer’s actual approved PO. The potentially hidden error is a mismatch, not necessarily a late payer."}, {"id": 5, "name": "Overlooked detail / method", "logic": "Surface a valuable detail not prominent in common guidance.", "when": "When you have evidence it is genuinely overlooked.", "fail": "Calling public basics a secret or inventing an institutional villain.", "practice": "Inspect manuals and terms for meaningful conditions.", "weak": "Secret software tips", "example": "The export option to inspect before you manually reformat every date", "exampleAnswer": "Hypothetical exporter includes a locale setting. The useful overlooked method exists in the product; no institution is alleged to hide it."}, {"id": 6, "name": "Specific problem / surprising solution", "logic": "Start from a recognizable symptom and offer a less obvious check.", "when": "When the symptom is precise enough for self-recognition.", "fail": "A broad “if you want better results” or an unverified remedy.", "practice": "Describe the failure in the audience’s own words.", "weak": "Write better proposals", "example": "If a client approves the proposal but delays the deposit, which sentence should lead your follow-up?", "exampleAnswer": "State the agreed start date and ask whether the deposit will clear before it. The symptom is specific; the proposed solution is a concrete question, not a payment guarantee."}, {"id": 7, "name": "Contrarian insight", "logic": "Explain why a common strategy fails in a particular context.", "when": "When your alternative follows from a real mechanism.", "fail": "Posturing as contrary without evidence.", "practice": "Find when the opposite approach solves a real bottleneck.", "weak": "Always compete with discounts", "example": "Why a smaller scope can be a better response to a lower budget than a lower day rate", "exampleAnswer": "Illustrative consulting reasoning: preserve the unit economics while removing lower-priority deliverables. The contrarian insight challenges discount-first thinking with an operational alternative."}, {"id": 8, "name": "Before / after contrast", "logic": "Reveal a useful change while withholding the bridge.", "when": "When both starting state and outcome are grounded.", "fail": "Invented transformation metrics or missing constraints.", "practice": "Compare observable states without manufacturing a percentage.", "weak": "Better meeting notes", "example": "From scattered decisions to a searchable index—which page detail makes the difference?", "exampleAnswer": "In the hypothetical notebook, numbered pages support an index. The before and after are descriptive states, not invented productivity statistics."}, {"id": 9, "name": "Unusual use", "logic": "Reveal a useful new application for a familiar asset.", "when": "When the use is safe, feasible and documented.", "fail": "Trivial novelty or unsafe hacks.", "practice": "List underused capabilities and their real tasks.", "weak": "Use your calendar better", "example": "The calendar block you can use as a client-booking guardrail", "exampleAnswer": "A scheduler that respects unavailable calendar blocks can use recurring breaks. Verify the actual integration and test it; the calendar is repurposed as ilure rather than imitate surface structure.", "revealed": "Use an index to find your notes", "withheld": "Nothing usefully bounded, or the answer is already revealed.", "question": "Does the reader ask a useful question or simply “what does that mean?”", "payoff": "Clear useful advice, but it reveals the method. Not necessarily bad copy; simply not a strong withheld-information fascination.", "risk": "Clear useful advice, but it reveals the method. Not necessarily bad copy; simply not a strong withheld-information fascination.", "transfer": "Name a specific reader, decision and true answer; decide whether withholding improves the copy."}], "rubric": [{"name": "Curiosity", "definition": "Does the reader form a specific question worth resolving?", "weak": "“A shocking secret” — no bounded gap.", "acceptable": "A clear question, but its answer may be obvious.", "strong": "A meaningful non-obvious question tied to a useful answer."}, {"name": "Specificity", "definition": "Are details concrete, pertinent and grounded?", "weak": "Abstract promise or fake metric.", "acceptable": "Identifiable subject with some unnecessary generality.", "strong": "Verifiable objects, moments or conditions narrow the gap."}, {"name": "Relevance", "definition": "Does this matter to the intended reader now?", "weak": "No audience or task.", "acceptable": "A plausible audience need, weak context.", "strong": "A concrete audience decision or frustration is addressed."}, {"name": "Clarity", "definition": "Can a reader understand the subject without the answer?", "weak": "An unexplained riddle.", "acceptable": "Understandable but needs rereading.", "strong": "Immediate subject and one clear missing link."}, {"name": "Answer value", "definition": "What useful decision or action will the answer enable?", "weak": "Trivial payoff.", "acceptable": "Some useful information.", "strong": "A consequential, feasible next decision or action."}, {"name": "Credibility", "definition": "Are literal and implied claims proportionate to evidence?", "weak": "Miracle, invented statistic or villain.", "acceptable": "Plausible but with missing conditions.", "strong": "Grounded promise, limits and evidence are transparent."}, {"name": "Originality", "definition": "Is the angle fresh for this audience rather than merely decorated?", "weak": "Cliché with “secret” added.", "acceptable": "Familiar angle with relevant context.", "strong": "A distinctive true insight selected from real material."}, {"name": "Alignment", "definition": "Will the actual content satisfy the expectation?", "weak": "No answer or bait-and-switch.", "acceptable": "Partial answer with an unstated limitation.", "strong": "Specific answer, source and location match likely expectations."}], "sources": {"fascination-bank.md": "# The Mel Martin Fascination Bank\n\n~70 authentic fascinations, transcribed from primary/secondary sources and grouped for training use.\nEach item is tagged with its source. Provenance notes at the bottom.\n\n> **What a \"fascination\" is:** Mel Martin's term for a bullet that creates irresistible curiosity instead of stating a benefit. Marty Edelston said his copy \"made you vibrate.\" Lawrence Bernstein's definition is the sharpest:\n> *\"Bullets make your prospects wonder IF your product works. Fascinations make your prospects wonder HOW your product works.\"*\n\n---\n\n## A. The canon — Edelston's eulogy list & the envelope four\n*(Quoted by Brian Kurtz from Marty Edelston's 1994 eulogy; the last four were the ones Martin hand-picked for the outer envelope for \"maximum vibration.\")*\n\n1. What never to eat on an airplane\n2. How to collect interest from two different banks at the same time\n3. The two most forgotten tax deductions\n4. Bills it's okay to pay late\n5. What credit companies don't tell you\n6. How to refund airlines' non-refundable ticket\n7. How to make your car very, very hard to steal\n8. Vitamins never to buy in a health food store\n9. How to know when a slot machine is ready to pay off\n10. What banks don't want you to know\n11. Safest place in any hotel room to hide valuables\n12. How to travel free on luxury cruise ships. Lots of passengers you meet on board are doing it but never tell you. Page 367\n\n## B. Other widely-cited Martin bullets\n*(Circulated by Lawrence Bernstein's collection, Justin Goff, Jeremy Mac, Breakthrough Marketing Secrets, etc.)*\n\n13. Best numbers in any lottery\n14. College aid for families WITH money\n15. How to get reimbursed for stock market losses\n16. Fight heart disease with beer\n17. Common sex positions that cause impotence\n18. Diseases you can catch from your pet\n\n## C. \"The Book of Secrets\" letter — the ad that saved Boardroom's biggest flop\n*(Transcribed by Csaba Borzasi, Game of Conversions. Third attempt at the same book: \"The Book of Checklists\" flopped, \"The Great Book of Inside Knowledge\" flopped worse, \"The Book of Secrets\" sold 600,000+ copies over a decade. 90% of the letter is fascinations. Page references as quoted.)*\n\n**Money, shopping & consumer traps**\n19. DIETING SECRETS: Did you know there are two kinds of calories — one is less fattening than the other? (p. 178)\n20. What car dealers charge you for twice — you could read your bill over and over and still not spot the scam\n21. How the color of your car affects your chances of being stopped for speeding\n22. \"Diamonds are forever\" — right? Wrong! They're only precious stones. Three other precious stones are safer long-term investments\n23. How to borrow on your life insurance without reducing the death benefit — even if you never repay the loan\n24. BANK SECRETS: The first loan they offer you is always the most expensive kind — what to hold out for instead\n25. AIRLINE SECRETS: A flight that suits your schedule best may never show up on a travel agent's computer — what to demand to see\n26. How to get discounts from stores that claim none\n27. Why the IRS likes joint returns — eye-opening tax breaks (p. 361
