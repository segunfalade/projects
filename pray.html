<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hour of Prayer</title>
  <style>
    /* ---- CSS Variables & Root ---- */
    :root {
      --bg: #0a0e17;
      --bg-secondary: #111827;
      --fg: #f0f4f8;
      --muted: #667085;
      --accent: #f59e0b;
      --accent-dim: rgba(245, 158, 11, 0.15);
      --card: rgba(17, 24, 39, 0.8);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }

    /* ---- Viewport ---- */
    @-ms-viewport { width: device-width; }
    @viewport { width: device-width, initial-scale=1.0; }

    /* ---- Container ---- */
    .container {
      max-width: 380px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ---- Streak ---- */
    .streak {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .streak-value {
      color: var(--accent);
      font-weight: 600;
    }

    /* ---- Sections ---- */
    .section {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .section.hidden { display: none; }

    /* ---- Countdown to Midnight ---- */
    #countdownDisplay {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    #countdownDisplay span {
      min-width: 50px;
      text-align: center;
    }

    .countdown-note {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    /* ---- Timer Display ---- */
    #timerDisplay {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      margin: 1rem 0;
      color: var(--fg);
    }

    #timerDisplay .divider {
      opacity: 0.5;
    }

    /* ---- Buttons ---- */
    .btn {
      width: 100%;
      padding: 1rem 1.25rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--accent);
      color: var(--bg);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35); }
    .btn:active { transform: translateY(0); }
    .btn:focus { outline: 2px solid var(--fg); outline-offset: 2px; }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--fg);
      border: 1px solid var(--muted);
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    /* ---- Alarm Overlay ---- */
    #alarmOverlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 23, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }

    #alarmOverlay.active {
      opacity: 1;
      visibility: visible;
    }

    .alarm-card {
      background: var(--card);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
      animation: popIn 0.45 cubic-bezier(0.16,1,0.3,1);
      max-width: 90%;
      width: 90%;
    }

    @keyframes popIn {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .alarm-card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    .alarm-card p {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .alarm-card .btn {
      width: auto;
      padding: 0.85rem 1.5rem;
      margin: 0.25rem;
    }

    /* ---- Responsive ---- */
    @media (max-width: 480px) {
      .container { padding: 1.5rem 1rem; }
      h1 { font-size: 1.6rem; }
      #timerDisplay { font-size: 3.5rem; }
      .btn { padding: 0.9rem 1rem; font-size: 0.95rem; }
      .alarm-card { padding: 1.5rem 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Hour of Prayer</h1>
      <p class="subtitle">A focused 1-hour habit, daily at 12 AM</p>
    </header>

    <!-- Streak Display -->
    <div class="streak">
      Streak: <span class="streak-value" id="streakCount">0</span> days
    </div>

    <!-- Countdown to Midnight Section -->
    <section id="countdownSection" class="section">
      <p>Time until prayer starts:</p>
      <div id="countdownDisplay">
        <span id="days">00</span>:<span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
      </div>
      <p class="countdown-note">Auto-starts 1-hour timer at 12 AM local time</p>
    </section>

    <!-- 1-Hour Timer Section -->
    <section id="timerSection" class="section hidden">
      <p>Prayer Timer</p>
      <div id="timerDisplay">60:00</div>
      <div class="buttons">
        <button class="btn" id="startBtn">Start</button>
        <button class="btn btn-secondary" id="stopBtn">Stop</button>
        <button class="btn btn-danger" id="resetBtn">Reset</button>
      </div>
    </section>

    <!-- Alarm Overlay -->
    <div id="alarmOverlay">
      <div class="alarm-card">
        <h2>Time's Up!</h2>
        <p>Your 1-hour prayer session has ended.</p>
        <button class="btn" id="acknowledgeBtn">Session Complete</button>
        <button class="btn btn-secondary" id="resetFromAlarm">Start New Session</button>
      </div>
    </div>

    <script>
      // ---- Initialization ----
      const SESSION_DURATION = 3600; // 1 hour in seconds
      const COUNTDOWN_SECTION = document.getElementById('countdownSection');
      const TIMER_SECTION = document.getElementById('timerSection');
      const TIMER_DISPLAY = document.getElementById('timerDisplay');
      const STREAK_COUNT = document.getElementById('streakCount');
      const ALARM_OVERLAY = document.getElementById('alarmOverlay');

      // ---- Streak State from LocalStorage ----
      let streak = parseInt(localStorage.getItem('prayerStreak') || '0');
      let lastSessionDate = localStorage.getItem('lastPrayerDate');
      let timerInterval = null;
      let remainingSeconds = SESSION_DURATION;

      // ---- Format seconds to MM:SS ----
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      // ---- Update Streak Logic ----
      function updateStreak() {
        const today = new Date().toISOString().split('T')[0];

        if (lastSessionDate === null) {
          streak = 1;
        } else if (lastSessionDate === today) {
          // Already prayed today, do nothing
          return;
        } else {
          const diffDays = Math.floor((new Date() - new Date(lastSessionDate)) / 86400000);
          if (diffDays === 1) {
            streak += 1;
          } else if (diffDays > 1) {
            // Gap exceeded, streak resets to 1 (user is recommitting)
            streak = 1;
          }
          // If diffDays <= 0 (shouldn't happen normally), keep current streak
        }

        STREAK_COUNT.textContent = streak;
        localStorage.setItem('prayerStreak', streak.toString());
        localStorage.setItem('lastPrayerDate', today);
      }

      // ---- Update Timer Display ----
      function updateTimerDisplay() {
        TIMER_DISPLAY.textContent = formatTime(remainingSeconds);
      }

      // ---- Start Timer ----
      function startTimer() {
        if (timerInterval) return; // already running
        timerInterval = setInterval(() => {
          remainingSeconds--;
          updateTimerDisplay();

          if (remainingSeconds <= 0) {
            endSession();
          }
        }, 1000);
      }

      // ---- Stop Timer ----
      function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      // ---- Reset Timer ----
      function resetTimer() {
        stopTimer();
        remainingSeconds = SESSION_DURATION;
        updateTimerDisplay();
      }

      // ---- End Session (Alarm) ----
      function endSession() {
        stopTimer();
        timerInterval = null;
        remainingSeconds = SESSION_DURATION; // reset for next time
        updateTimerDisplay();

        // Update streak if this is a new day
        updateStreak();

        // Show alarm overlay
        ALARM_OVERLAY.classList.add('active');
      }

      // ---- Acknowledge Alarm ----
      document.getElementById('acknowledgeBtn').addEventListener('click', () => {
        ALARM_OVERLAY.classList.remove('active');
        // Automatically start a new session after acknowledgment
        startTimer();
      });

      document.getElementById('resetFromAlarm').addEventListener('click', () => {
        ALARM_OVERLAY.classList.remove('active');
        resetTimer();
        startTimer();
      });

      // ---- Button Events ----
      document.getElementById('startBtn').addEventListener('click', startTimer);
      document.getElementById('stopBtn').addEventListener('click', stopTimer);
      document.getElementById('resetBtn').addEventListener('click', resetTimer);

      // ---- Countdown to Midnight Logic ----
      function getTimeToMidnight() {
        const now = new Date();
        const nextMidnight = new Date();
        nextMidnight.setHours(24, 0, 0, 0);
        nextMidnight.setDate(nextMidnight.getDate() + 1); // tomorrow's midnight
        return nextMidnight - now; // milliseconds
      }

      function updateCountdown() {
        const msToMidnight = getTimeToMidnight();
        const totalSeconds = Math.floor(msToMidnight / 1000);

        if (totalSeconds <= 0) {
          // It's 12 AM or past - start the timer immediately
          COUNTDOWN_SECTION.classList.add('hidden');
          TIMER_SECTION.classList.remove('hidden');
          resetTimer();
          startTimer(); // auto-start at midnight
          return;
        }

        // Convert to HH:MM:SS
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
      }

      // ---- Initialize on Load ----
      document.addEventListener('DOMContentLoaded', () => {
        // Initialize streak display
        updateStreak();

        // Initial countdown update
        updateCountdown();

        // Update countdown every second
        setInterval(updateCountdown, 1000);

        // Initial timer display
        updateTimerDisplay();
      });
    </script>
  </div>
</body>
</html>
