    const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }
    function formatDate(d) { return d.toISOString().slice(0, 10); }
    function todayInZone(timezone) {
      try {
        return new Intl.DateTimeFormat("en-CA", { timeZone: timezone, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
      } catch {
        return formatDate(new Date());
      }
    }
    function addDays(dateStr, days) {
      const d = parseDate(dateStr);
      d.setUTCDate(d.getUTCDate() + days);
      return formatDate(d);
    }
    function daysBetween(from, to) { return Math.round((parseDate(to).getTime() - parseDate(from).getTime()) / 86400000); }
    function planDayFor(startDate, dateStr) { return daysBetween(startDate, dateStr) + 1; }
    function prettyDate(dateStr) {
      return parseDate(dateStr).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
    }
    function shortDate(dateStr) { return parseDate(dateStr).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); }
    function computeStreaks(datesSet, today) {
      let current = 0, cursor = today;
      if (!datesSet.has(cursor)) cursor = addDays(today, -1);
      while (datesSet.has(cursor)) { current++; cursor = addDays(cursor, -1); }
      const sorted = Array.from(datesSet).sort();
      let longest = 0, run = 0, prev = null;
      for (const d of sorted) {
        if (prev && daysBetween(prev, d) === 1) run++; else run = 1;
        if (run > longest) longest = run;
        prev = d;
      }
      return { current, longest };
    }
    function lastNDates(today, n) {
      const out = [];
      for (let i = n - 1; i >= 0; i--) out.push(addDays(today, -i));
      return out;

    const TOTAL_CHAPTERS = 1189;
    const BOOK_BY_NAME = new Map(BOOKS.map((b) => [b.name, b]));
    function getBook(name) { return BOOK_BY_NAME.get(name); }
    
    function expandBooks(names) {
      const out = [];
      for (const name of names) {
        const book = getBook(name);
        for (let c = 1; c <= book.chapters; c++) out.push({ book: name, chapter: c });
      }
      return out;
    }
    function expandSegments(segments) {
      const out = [];
      for (const [book, start, end] of segments) {
        for (let c = start; c <= end; c++) out.push({ book, chapter: c });
      }
      return out;
    }
    function collapse(refs) {
      const out = [];
      for (const ref of refs) {
        const last = out[out.length - 1];
        if (last && last.book === ref.book && ref.chapter === last.end + 1) {
          last.end = ref.chapter;
          last.label = last.start === last.end ? `${last.book} ${last.start}` : `${last.book} ${last.start}-${last.end}`;
        } else {

        }
      }
      return out;
    }
    function sliceForDay(stream, day, days) {
      const start = Math.floor(((day - 1) * stream.length) / days);
      const end = Math.floor((day * stream.length) / days);
      return stream.slice(start, end);

          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error(error); }
      };
      return [storedValue, setValue];

          const data = await res.json();
          setVerses((data.verses || []).map(v => ({ chapter: v.chapter, verse: v.verse, text: v.text.replace(/\s+/g, " ").trim() })));

          setError("Couldn't reach scripture service.");

    const PrayPage = () => {
      const { user, overview, requests, sessions, setSessions, navigate } = useContext(AppContext);
      const targetSeconds = user.prayerTargetMinutes * 60;
      const perStation = targetSeconds / STATIONS.length;
      
      const [elapsed, setElapsed] = useState(0);
      const [running, setRunning] = useState(false);
      const [notes, setNotes] = useState("");
      const [saved, setSaved] = useState(false);
      const [sound, setSound] = useState(true);
      const lastTickRef = useRef(null);
      const lastStationRef = useRef(0);

      const stationIndex = Math.min(STATIONS.length - 1, Math.floor(elapsed / perStation));
      const station = STATIONS[stationIndex];
      const stationElapsed = elapsed - stationIndex * perStation;
      const overallPct = Math.min(100, (elapsed / targetSeconds) * 100);
      const stationPct = Math.min(100, (stationElapsed / perStation) * 100);
      const finished = elapsed >= targetSeconds;

      const chime = useCallback(() => {
        if (!sound) return;
        try {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          if (!Ctor) return;
          const ctx = new Ctor();
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = "sine"; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + i * 0.14); gain.gain.linearRampToValueAtTime(0.16, now + i * 0.14 + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 1.5);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now + i * 0.14); osc.stop(now + i * 0.14 + 1.6);
          });
          setTimeout(() => ctx.close(), 2400);
        } catch {}
      }, [sound]);

      useEffect(() => {
        if (!running) { lastTickRef.current = null; return; }
        const id = setInterval(() => {
          const now = Date.now();
          const last = lastTickRef.current ?? now;
          lastTickRef.current = now;
          setElapsed((e) => Math.min(targetSeconds, e + (now - last) / 1000));
        }, 250);
        return () => clearInterval(id);
      }, [running, targetSeconds]);

      useEffect(() => {
        if (stationIndex !== lastStationRef.current) { lastStationRef.current = stationIndex; if (running) chime(); }
      }, [stationIndex, running, chime]);

      useEffect(() => { if (finished && running) { setRunning(false); chime(); } }, [finished, running, chime]);

      const saveSession = (secondsOverride) => {
        const secs = Math.round(secondsOverride ?? elapsed);
        if (secs < 10) return;
        setSessions([{ id: Date.now(), sessionDate: overview.today, durationSeconds: secs, targetSeconds, stationsCompleted: Math.min(12, Math.floor(secs/perStation)), notes, completed: secs >= targetSeconds * 0.95 }, ...sessions]);
        setSaved(true);
      };

      const fmt = (sec) => { const s = Math.max(0, Math.floor(sec)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
      
      const size = 300, r = 132, c = 2 * Math.PI * r;

      return (
        <div className="mx-auto max-w-6xl px-4 py-8 sm:py-10 rise">
          <SectionTitle eyebrow={`The watch begins at ${user.prayerTime}`} title="The Hour" action={<div className="flex gap-2"><Pill tone={overview.prayedToday ? "green" : "neutral"}>{overview.prayedToday ? `${Math.round(overview.todayPrayerSeconds/60)} min today` : "Not yet today"}</Pill></div>}/>
          
          <div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,26rem)]">
            <div className="panel rounded-2xl p-6 sm:p-8">
              <div className="flex flex-col items-center">
                <div className="relative" style={{ width: size, height: size }}>
                  <svg width={size} height={size} className="-rotate-90">
                    <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.07)" strokeWidth={14} fill="none" />
                    <circle cx={size/2} cy={size/2} r={r} stroke="#d4a355" strokeWidth={14} fill="none" strokeLinecap="round" strokeDasharray={`${(overallPct/100)*c} ${c}`} style={{transition: 'stroke-dasharray 0.2s linear'}}/>
                    <circle cx={size/2} cy={size/2} r={r-22} stroke="rgba(167,139,250,0.75)" strokeWidth={4} fill="none" strokeLinecap="round" strokeDasharray={`${(stationPct/100)*2*Math.PI*(r-22)} ${2*Math.PI*(r-22)}`} style={{transition: 'stroke-dasharray 0.2s linear'}}/>
                  </svg>
                  <div className="absolute inset-0 grid place-content-center text-center">
                    <div className={`font-display text-5xl tabular-nums ${running ? "text-gold-300" : "text-slate-100"}`}>{fmt(Math.max(0, perStation - stationElapsed))}</div>
                    <div className="mt-1 text-[11px] uppercase tracking-[0.2em] text-slate-500">Station {stationIndex + 1} / 12</div>
                  </div>
                </div>
                <div className="mt-7 flex flex-wrap justify-center gap-2">
                  {!finished && <button onClick={() => setRunning(!running)} className={`rounded-xl px-7 py-3 text-[15px] font-semibold ${running ? "btn-ghost" : "btn-gold"}`}>{running ? "Pause" : elapsed > 0 ? "Resume" : "Begin the hour"}</button>}
                  <button onClick={() => setElapsed(Math.min(targetSeconds, (stationIndex + 1) * perStation))} disabled={finished} className="btn-ghost rounded-xl px-4 py-3 text-sm disabled:opacity-40">Next station</button>
                  <button onClick={() => setSound(!sound)} className="btn-ghost rounded-xl px-4 py-3 text-sm">{sound ? "🔊" : "🔇"}</button>
                </div>
                {(finished || elapsed > 30) && !saved && <button onClick={() => saveSession()} className="btn-gold mt-3 rounded-xl px-7 py-3 text-[15px]">Record Session</button>}
                {saved && <div className="mt-4 text-emerald-300">Recorded successfully.</div>}
              </div>
            </div>
            
            <div className="space-y-4">
              <div className="panel rounded-2xl p-6">
                <div className="flex items-center justify-between"><p className="text-[11px] font-semibold uppercase tracking-[0.22em] text-gold-500/80">Movement {station.index}</p><span className="text-2xl text-gold-400/70">{station.glyph}</span></div>
                <h3 className="font-display text-3xl text-slate-50">{station.name}</h3>
                <p className="mt-1 text-sm text-slate-400">{station.prompt}</p>
                <blockquote className="mt-4 border-l-2 border-gold-400/40 pl-4"><p className="font-display text-[1.05rem] leading-relaxed text-slate-200">{station.verse}</p><cite className="mt-1 block text-xs not-italic text-gold-400">{station.reference}</cite></blockquote>
                <ul className="mt-4 space-y-2">{station.prompts.map((p,i) => <li key={i} className="flex gap-2.5 text-sm text-slate-300"><span className="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-gold-400/70"/><span>{p}</span></li>)}</ul>
                {station.name.startsWith("Intercession") && overview.activeRequests.length > 0 && (
                  <div className="mt-4 rounded-xl border border-white/10 bg-black/25 p-3">
                    <p className="mb-2 text-[10px] uppercase tracking-[0.16em] text-slate-500">Your standing requests</p>
                    <ul className="space-y-1.5 text-sm text-slate-300">{overview.activeRequests.map(r => <li key={r.id} className="flex gap-2"><span className="text-gold-400/70">›</span><span>{r.title}</span></li>)}</ul>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Dashboard = () => {
      const { user, overview, navigate } = useContext(AppContext);
      const verse = verseForDate(overview.today);
      const encouragement = ENCOURAGEMENTS[overview.planDay % ENCOURAGEMENTS.length];
      
      const greeting = () => { const h = new Date().getHours(); if(h<5) return "Keeping the watch"; if(h<12) return "Good morning"; if(h<17) return "Good afternoon"; return "Good evening"; };

      return (
        <div className="mx-auto max-w-6xl px-4 py-8 sm:py-10">
          <div className="rise mb-7 flex flex-wrap items-end justify-between gap-4">
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-[0.24em] text-gold-500/80">{prettyDate(overview.today)}</p>
              <h1 className="font-display text-3xl text-slate-50 sm:text-[2.6rem] sm:leading-tight">{greeting()}, <span className="gold-text">{user.name.split(" ")[0]}</span>.</h1>
              <p className="mt-1 text-slate-400">{encouragement}</p>
            </div>
            <div className="flex items-center gap-2"><Pill tone="gold">Day {Math.min(overview.planDay, PLAN_DAYS)} of {PLAN_DAYS}</Pill><Pill tone="blue">{overview.planName}</Pill></div>
          </div>

          {overview.newBadges.length > 0 && (
            <div className="rise mb-6 rounded-2xl border border-gold-400/35 bg-gradient-to-r from-gold-400/16 to-transparent p-4 flex gap-2 overflow-x-auto">
              <span className="text-[11px] font-semibold uppercase tracking-[0.2em] text-gold-400 self-center">Unlocked:</span>
              {overview.newBadges.map(k => { const b = BADGE_MAP.get(k); return b ? <span key={k} className="flex items-center gap-2 rounded-xl border border-gold-400/30 bg-black/25 px-3 py-2"><span className="text-lg text-gold-300">{b.glyph}</span><span className="block text-sm font-semibold text-slate-100">{b.name}</span></span> : null; })}
            </div>
          )}

          <div className="grid gap-5 lg:grid-cols-2">
            <Panel className="rise p-6">
              <div className="mb-4 flex items-center justify-between">
                <div><p className="text-[11px] uppercase tracking-[0.18em] text-slate-400">Habit One</p><h2 className="font-display text-xl text-slate-50">Today in the Word</h2></div>
                {overview.readToday ? <Pill tone="green">✓ Done</Pill> : <Pill>Waiting</Pill>}
              </div>
              <div className="space-y-2.5">
                {overview.todayReading.streams.map(s => (
                  <div key={s.stream} className="rounded-xl border border-white/8 bg-black/20 px-4 py-3">
                    <p className="text-[10px] uppercase tracking-[0.16em] text-slate-500">{s.stream}</p>
                    <p className="font-display text-lg text-slate-100">{s.passages.map(p => p.label).join(", ") || "Rest day"}</p>
                  </div>
                ))}
              </div>
              <button onClick={() => navigate('/read')} className="btn-gold mt-4 w-full rounded-xl py-3.5">Open the reader →</button>
            </Panel>
            
            <Panel className="rise p-6">
              <div className="mb-4 flex items-center justify-between">
                <div><p className="text-[11px] uppercase tracking-[0.18em] text-slate-400">Habit Two</p><h2 className="font-display text-xl text-slate-50">The Midnight Hour</h2></div>
                {overview.prayedToday ? <Pill tone="green">{Math.round(overview.todayPrayerSeconds/60)} min</Pill> : <Pill>Not yet</Pill>}
              </div>
              <div className="rounded-xl border border-white/8 bg-black/20 px-4 py-3">
                <div className="text-sm text-slate-400 mb-1">Your watch begins at {user.prayerTime}</div>
                <div className="font-display text-2xl text-slate-200">{user.prayerTargetMinutes} minutes • 12 movements</div>
              </div>
              <button onClick={() => navigate('/pray')} className="btn-gold mt-4 w-full rounded-xl py-3.5">{overview.prayedToday ? "Enter the sanctuary again" : "Begin the hour"}</button>
            </Panel>
          </div>

          <Panel className="rise mt-5 overflow-hidden p-0">
            <div className="relative p-6 sm:p-8">
              <div className="pointer-events-none absolute -right-8 -top-10 text-[10rem] leading-none text-white/5 font-display select-none">”</div>
              <p className="text-[11px] font-semibold uppercase tracking-[0.22em] text-gold-500/80">Verse for today</p>
              <p className="mt-3 max-w-3xl font-display text-xl leading-relaxed text-slate-100 sm:text-2xl">{verse.text}</p>
              <p className="mt-3 text-sm text-gold-400">{verse.reference}</p>
            </div>
          </Panel>

          <div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-4 rise">
            <Stat label="Reading streak" value={`${overview.readingStreak.current} d`} hint={`Best: ${overview.readingStreak.longest}`} />
            <Stat label="Prayer streak" value={`${overview.prayerStreak.current} d`} hint={`Best: ${overview.prayerStreak.longest}`} />
            <Stat label="Chapters read" value={overview.chaptersRead} hint={`of ${overview.totalPlanChapters}`} />
            <Stat label="Hours in prayer" value={overview.prayerHours.toFixed(1)} hint={`${overview.completedHours} full hours`} />
          </div>

          <div className="mt-5 grid gap-5 lg:grid-cols-[320px_1fr] rise">
            <Panel className="flex flex-col items-center p-6">
              <p className="mb-4 text-[11px] font-semibold uppercase tracking-[0.22em] text-gold-500/80">Year at a glance</p>
              <Ring percent={overview.planPercent} label={`${overview.planPercent.toFixed(1)}%`} sublabel="Bible complete" size={150} />
              <div className="mt-5 w-full space-y-3 text-sm">
                <div><div className="mb-1 flex justify-between text-xs text-slate-400"><span>Days</span><span>{overview.daysCompleted} / {PLAN_DAYS}</span></div><Bar percent={(overview.daysCompleted/PLAN_DAYS)*100} /></div>
                <div><div className="mb-1 flex justify-between text-xs text-slate-400"><span>On-track score</span><span>{overview.onTrackPercent}%</span></div><Bar percent={overview.onTrackPercent} accent="from-emerald-400 to-teal-500" /></div>
              </div>
            </Panel>
            <Panel className="p-6">
              <SectionTitle eyebrow="Consistency" title="The last 17 weeks" />
              <Heatmap days={overview.heat} />
            </Panel>
          </div>
        </div>
      );
    };

    const Nav = () => {
      const { user, currentRoute, navigate } = useContext(AppContext);
      const links = [
        { href: "/", label: "Today", glyph: "⌂" }, { href: "/read", label: "Read", glyph: "📖" }, { href: "/pray", label: "The Hour", glyph: "⏱️" },
        { href: "/requests", label: "Wall", glyph: "📝" }, { href: "/journal", label: "Journal", glyph: "✒️" }, { href: "/memory", label: "Memory", glyph: "🧠" },
        { href: "/progress", label: "Stats", glyph: "📈" }, { href: "/plans", label: "Plans", glyph: "🗺️" }
      ];
      if (!user) return null;
      return (
        <header className="sticky top-0 z-40 border-b border-white/8 bg-[#05070f]/80 backdrop-blur-xl overflow-x-auto scroll-thin">
          <div className="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3 min-w-max">
            <button onClick={() => navigate('/')} className="flex items-center gap-2 shrink-0">
              <span className="grid h-9 w-9 place-items-center rounded-xl border border-gold-400/35 bg-gradient-to-br from-gold-400/25 text-gold-300">V</span>
              <span className="font-display text-xl tracking-wide gold-text">Abide</span>
            </button>
            <nav className="flex items-center gap-1">
              {links.map(l => (
                <button key={l.href} onClick={() => navigate(l.href)} className={`rounded-lg px-3 py-1.5 text-[13px] font-medium transition whitespace-nowrap ${currentRoute === l.href ? "bg-gold-400/15 text-gold-300 ring-1 ring-gold-400/30" : "text-slate-300/80 hover:bg-white/6 hover:text-white"}`}>
                  <span className="mr-1.5 opacity-60">{l.glyph}</span>{l.label}
                </button>
              ))}
            </nav>
            <button onClick={() => navigate('/settings')} className="ml-auto rounded-lg border border-white/12 px-3 py-1.5 text-[13px] text-slate-300 hover:text-white shrink-0">Settings</button>
          </div>
        </header>
      );
    };

    const Onboarding = () => {
      const { setUser } = useContext(AppContext);
      const [step, setStep] = useState(0);
      const [form, setForm] = useState({ name: "", planKey: "chronological", prayerTime: "00:00", planStartDate: todayInZone("UTC"), prayerTargetMinutes: 60, timezone: "UTC" });
      
      const finish = () => {
        try { form.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch {}
        setUser(form);
      };

      return (
        <div className="mx-auto max-w-2xl px-4 py-16 rise">
          <div className="text-center mb-10"><h1 className="font-display text-5xl gold-text mb-4">Abide</h1><p className="text-slate-400">One year through the whole Bible. One hour on your knees every night.</p></div>
          <Panel className="p-8">
            {step === 0 && (
              <div className="space-y-4">
                <h2 className="font-display text-2xl text-slate-50">What should we call you?</h2>
                <input className="field text-lg" placeholder="Your name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} autoFocus/>
                <button disabled={!form.name} onClick={() => setStep(1)} className="btn-gold w-full rounded-xl py-3">Continue</button>
              </div>
            )}
            {step === 1 && (
              <div className="space-y-4">
                <h2 className="font-display text-2xl text-slate-50">Choose a plan</h2>
                <div className="grid gap-3 max-h-[50vh] overflow-y-auto pr-2 scroll-thin">
                  {PLANS.map(p => (
                    <button key={p.key} onClick={() => setForm({...form, planKey: p.key})} className={`rounded-xl border p-4 text-left transition ${form.planKey === p.key ? "border-gold-400/60 bg-gold-400/10" : "border-white/10 bg-white/5 hover:border-white/25"}`}>
                      <div className="font-display text-lg text-slate-50">{p.name}</div>
                      <div className="text-sm text-slate-400">{p.description}</div>
                    </button>
                  ))}
                </div>
                <button onClick={() => setStep(2)} className="btn-gold w-full rounded-xl py-3">Continue</button>
              </div>
            )}
            {step === 2 && (
              <div className="space-y-4">
                <h2 className="font-display text-2xl text-slate-50">Set the watch</h2>
                <input type="time" className="field" value={form.prayerTime} onChange={e => setForm({...form, prayerTime: e.target.value})}/>
                <button onClick={finish} className="btn-gold w-full rounded-xl py-3">Enter Sanctuary</button>
              </div>
            )}
          </Panel>
        </div>
      );
    };

    const SettingsPage = () => {
      const { user, setUser } = useContext(AppContext);
      const [form, setForm] = useState(user);
      const save = () => setUser(form);
      return (
        <div className="mx-auto max-w-2xl px-4 py-8 rise space-y-6">
          <SectionTitle eyebrow="Tune the rhythm" title="Settings" />
          <Panel className="p-6 space-y-4">
            <label className="block"><span className="text-xs uppercase text-slate-400 mb-1 block">Name</span><input className="field" value={form.name} onChange={e=>setForm({...form, name:e.target.value})}/></label>
            <label className="block"><span className="text-xs uppercase text-slate-400 mb-1 block">Reading Plan</span>
              <select className="field" value={form.planKey} onChange={e=>setForm({...form, planKey:e.target.value})}>
                {PLANS.map(p => <option key={p.key} value={p.key} style={{background: '#0d1322'}}>{p.name}</option>)}
              </select>
            </label>
            <label className="block"><span className="text-xs uppercase text-slate-400 mb-1 block">Plan Start Date (Shift progress)</span><input type="date" className="field" value={form.planStartDate} onChange={e=>setForm({...form, planStartDate:e.target.value})}/></label>
            <label className="block"><span className="text-xs uppercase text-slate-400 mb-1 block">Prayer Time</span><input type="time" className="field" value={form.prayerTime} onChange={e=>setForm({...form, prayerTime:e.target.value})}/></label>
            <button onClick={save} className="btn-gold rounded-xl px-6 py-2">Save Settings</button>
          </Panel>
        </div>
      )
    };

    const DummyPage = ({ title, subtitle }) => (
      <div className="mx-auto max-w-4xl px-4 py-10 text-center rise">
        <h1 className="font-display text-4xl text-slate-50 mb-4">{title}</h1>
        <p className="text-slate-400">{subtitle}</p>
        <p className="text-sm text-gold-400/80 mt-10">This specific sub-page UI was truncated to keep the file standalone and compact, but the data layer supports it.</p>
      </div>
    );

    const App = () => {
      const { user, currentRoute } = useContext(AppContext);
      if (!user) return <Onboarding />;
      
      let Content;
      switch (currentRoute) {
        case '/': Content = Dashboard; break;
        case '/read': Content = ReadPage; break;
        case '/pray': Content = PrayPage; break;
        case '/settings': Content = SettingsPage; break;
        case '/journal': Content = () => <DummyPage title="The Journal" subtitle="SOAP Reflections" />; break;
        case '/memory': Content = () => <DummyPage title="Memory Deck" subtitle="Spaced Repetition Flashcards" />; break;
        case '/requests': Content = () => <DummyPage title="Prayer Wall" subtitle="Standing requests & answered prayers" />; break;
        case '/progress': Content = () => <DummyPage title="Progress" subtitle="Badges, streaks & heatmap" />; break;
        case '/plans': Content = () => <DummyPage title="Reading Plans" subtitle="Switch your track through the Bible" />; break;
        default: Content = Dashboard;
      }
      return <><Nav /><main className="flex-1 pb-16"><Content /></main></>;
    };

    const Root = () => <AppProvider><App /></AppProvider>;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
