<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Copywriting Business OS — a standalone operating system for a freelance copywriting practice. One HTML file, no server, no account.">
<title>Copywriting Business OS — Command Center</title>
<style>
:root{
  --paper:#f4f1ea; --paper2:#eae5da; --ink:#1b1a17; --ink2:#5a554a;
  --rule:#c8c0af; --stamp:#b23a2b; --stamp-d:#7c2519; --stamp-l:#e8c9c1;
  --taupe:#6f6757; --inkblue:#2c4a63;
  --disp:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
::selection{background:var(--stamp-l)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:var(--paper2)}
::-webkit-scrollbar-thumb{background:var(--rule);border:3px solid var(--paper2)}
.lbl{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;line-height:1.2}
.mono{font-family:var(--mono)}
/* layout */
#side{position:fixed;top:0;left:0;width:252px;height:100vh;background:var(--paper2);border-right:1px solid rgba(27,26,23,.25);display:flex;flex-direction:column;z-index:50}
#brand{padding:22px 20px 18px;border-bottom:1px solid rgba(27,26,23,.2);display:flex;gap:10px;align-items:center}
#brand .t1{font-family:var(--disp);font-size:15px}
#brand .t2{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;font-size:9px;color:var(--stamp);margin-top:3px}
#nav{flex:1;overflow-y:auto;padding:8px 0}
#nav button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;padding:10px 12px 10px 20px;color:var(--ink2)}
#nav button:hover{color:var(--ink);background:rgba(244,241,234,.6)}
#nav button.on{border-left-color:var(--stamp);background:var(--paper);color:var(--ink)}
#nav .n{font-family:var(--mono);font-size:10px;color:var(--taupe)}
#nav button.on .n{color:var(--stamp)}
#nav .l{font-family:var(--mono);text-transform:uppercase;letter-spacing:.11em;font-size:11px}
#sidefoot{padding:14px 20px;border-top:1px solid rgba(27,26,23,.2);display:flex;flex-direction:column;gap:10px}
#main{margin-left:252px}
#wrap{max-width:1180px;margin:0 auto;padding:0 48px 100px}
#topbar{display:none}
/* cover */
#cover{margin:0 -48px;padding:40px 48px 36px;border-bottom:1px solid rgba(27,26,23,.25);position:relative;overflow:hidden;
  background:
    radial-gradient(1200px 300px at 20% 0%,rgba(255,255,255,.55),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(27,26,23,.045) 27px 28px),
    linear-gradient(115deg,var(--paper) 55%,var(--paper2));
}
#cover h1{font-family:var(--disp);font-weight:600;letter-spacing:-.026em;line-height:1.02;font-size:clamp(2rem,4.6vw,3.4rem);margin:26px 0 0;max-width:22ch}
#cover .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;max-width:900px;margin-top:30px}
#cover .col{border-top:1px solid rgba(27,26,23,.3);padding-top:10px}
#cover .col p{margin:8px 0 0;font-size:13.5px;line-height:1.55}
#seal{position:absolute;right:22px;top:118px;width:118px;height:118px;border:2px solid rgba(178,58,43,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:rotate(-4deg);pointer-events:none}
/* bands */
.band{border-bottom:1px solid rgba(27,26,23,.25);padding:32px 0 16px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.band h2{font-family:var(--disp);font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.02;letter-spacing:-.02em;margin:0;flex:1;min-width:220px}
.band .num{font-family:var(--mono);color:var(--stamp);font-size:13px}
.band p.desc{width:100%;margin:8px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.6;max-width:62ch}
.subband{display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(27,26,23,.2);padding-bottom:6px;margin:32px 0 12px}
.subband .ruleline{flex:1;height:1px;background:var(--rule)}
.grid2{display:grid;grid-template-columns:1fr 260px;gap:48px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}#cover .cols{grid-template-columns:1fr}aside.margin{border-left:none!important;padding-left:0!important}}
aside.margin{border-left:1px solid rgba(27,26,23,.2);padding-left:32px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:11px;padding:10px 14px;border:1px solid rgba(27,26,23,.35);background:transparent;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ink:hover{background:var(--stamp);border-color:var(--stamp)}
.btn.stamp{background:var(--stamp);color:var(--paper);border-color:var(--stamp)}
.btn.stamp:hover{background:var(--stamp-d);border-color:var(--stamp-d)}
.btn.sm{font-size:10px;padding:6px 10px}
.btn.quiet{border:none;color:var(--ink2);padding:6px 8px}
.btn.quiet:hover{background:none;color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* stamps */
.stamp{display:inline-flex;align-items:center;border:1px solid rgba(27,26,23,.4);padding:3px 6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.13em;font-size:10px;line-height:1;white-space:nowrap;color:var(--ink)}
.stamp.red{border-color:var(--stamp);color:var(--stamp)}
.stamp.blue{border-color:var(--inkblue);color:var(--inkblue)}
.stamp.taupe{border-color:rgba(111,103,87,.6);color:var(--taupe)}
.chip{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:10px;padding:4px 8px;border:1px solid rgba(27,26,23,.2);background:none;color:var(--ink2)}
.chip:hover{border-color:rgba(27,26,23,.6);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* rows / ledger */
.row{border-bottom:1px solid rgba(200,192,175,.7);padding:10px 4px;display:block;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
button.row:hover{background:rgba(234,229,218,.5)}
.empty{border:1px dashed rgba(27,26,23,.25);padding:34px 24px;text-align:center;margin:12px 0}
.empty h4{font-family:var(--disp);font-size:1.15rem;margin:12px 0 6px}
.empty p{color:var(--ink2);font-size:13px;max-width:46ch;margin:0 auto;line-height:1.6}
/* forms */
.fld{display:block;margin:0}
.fld .lbl{color:var(--taupe)}
.fld .hint{font-size:11px;color:var(--taupe);margin:4px 0 0;line-height:1.5}
.in{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(27,26,23,.3);padding:6px 2px;font-size:14px;color:var(--ink)}
.in:focus{outline:none;border-bottom-color:var(--stamp)}
textarea.in{line-height:1.6;resize:vertical}
select.in{cursor:pointer}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid rgba(27,26,23,.25);padding:8px 10px;flex:1;min-width:220px;background:transparent}
.searchbox input{flex:1;border:none;background:none;outline:none;font-size:13px;color:var(--ink)}
/* modal */
#scrim{position:fixed;inset:0;background:rgba(27,26,23,.45);z-index:90;display:none}
#modal{position:fixed;z-index:95;top:0;left:0;right:0;bottom:0;display:none;overflow-y:auto;padding:32px 16px}
#modal.open{display:block}#scrim.open{display:block}
#mbox{background:var(--paper);border:1px solid rgba(27,26,23,.3);box-shadow:0 24px 60px -20px rgba(27,26,23,.45);max-width:640px;margin:0 auto}
#mbox.wide{max-width:820px}
#mhead{display:flex;gap:16px;padding:20px 24px 16px;border-bottom:1px solid rgba(27,26,23,.2)}
#mhead h3{font-family:var(--disp);font-size:1.55rem;margin:0;line-height:1.2;letter-spacing:-.015em}
#mhead p{font-size:12.5px;color:var(--ink2);margin:4px 0 0}
#mbody{padding:20px 24px}
#mfoot{padding:16px 24px;border-top:1px solid rgba(27,26,23,.2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mx{background:none;border:none;color:var(--ink2);font-size:18px;line-height:1;padding:4px}
#mx:hover{color:var(--stamp)}
/* palette */
#pal{position:fixed;z-index:120;top:12vh;left:50%;transform:translateX(-50%);width:min(640px,92vw);background:var(--paper);border:1px solid rgba(27,26,23,.3);box-shadow:0 30px 80px -24px rgba(27,26,23,.5);display:none}
#pal.open{display:block}
#pal input{width:100%;border:none;background:none;outline:none;font-size:15px;padding:14px 16px;color:var(--ink)}
#palres{max-height:52vh;overflow-y:auto;border-top:1px solid rgba(27,26,23,.2)}
#palres button{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid rgba(200,192,175,.6);padding:10px 16px;display:flex;gap:12px;align-items:center}
#palres button.cur{background:var(--paper2)}
/* onboarding */
#onb{position:fixed;inset:0;z-index:200;background:var(--paper);overflow-y:auto;display:none}
#onb.open{display:block}
#onb .inner{max-width:640px;margin:0 auto;padding:48px 20px 80px}
/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:10px 16px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:10px;box-shadow:0 12px 30px -12px rgba(27,26,23,.5)}
.toast.warn{background:var(--stamp);border-color:var(--stamp)}
/* pipeline */
.pipe{display:flex;gap:1px;background:rgba(200,192,175,.6);border:1px solid rgba(200,192,175,.6);overflow-x:auto;padding:0}
.pcol{width:218px;flex-shrink:0;background:rgba(234,229,218,.4)}
.pcol header{background:var(--paper);border-bottom:1px solid rgba(200,192,175,.6);padding:8px 10px;display:flex;gap:8px;align-items:baseline}
.pcard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid rgba(27,26,23,.15);padding:10px;margin:0}
.pcard:hover{border-color:rgba(27,26,23,.5)}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:rgba(27,26,23,.15);display:block}.dots i.f{background:var(--ink)}.dots i.fr{background:var(--stamp)}
.alertbox{border:1px solid rgba(178,58,43,.5);background:rgba(178,58,43,.05);margin-top:16px}
.alertbox header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(178,58,43,.3)}
.kv{border-top:1px solid var(--rule);padding-top:6px}
.kv p{margin:6px 0 0;font-size:12.5px;line-height:1.6}
.timeline{list-style:none;margin:8px 0 0;padding:0}
.timeline li{border-left:1px solid rgba(27,26,23,.2);padding:0 0 16px 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-3.5px;top:6px;width:6px;height:6px;background:var(--ink)}
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:rgba(200,192,175,.6);border:1px solid rgba(200,192,175,.6)}
.statgrid>div{background:var(--paper);padding:10px}
.statgrid .b{font-family:var(--mono);font-size:19px;line-height:1}
@media(max-width:760px){.statgrid{grid-template-columns:repeat(3,1fr)}#cover{margin:0 -20px;padding:32px 20px}#wrap{padding:0 20px 80px}}
@media(max-width:900px){
  #side{transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}
  #main{margin-left:0}
  #topbar{display:flex;position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid rgba(27,26,23,.25);padding:12px 16px;align-items:center;gap:12px}
}
kbd{font-family:var(--mono);font-size:10px;border:1px solid rgba(27,26,23,.2);padding:1px 6px;color:var(--taupe)}
.big-red{font-family:var(--disp);font-size:1.35rem;line-height:1.2;color:var(--stamp);letter-spacing:-.012em;margin:8px 0 0}
.countbox{border:2px solid rgba(27,26,23,.3);padding:8px 12px;text-align:left;background:none;min-width:110px}
.countbox:hover{background:var(--ink);color:var(--paper)}
.countbox.red{border-color:var(--stamp);color:var(--stamp)}
.countbox.red:hover{background:var(--stamp);color:var(--paper)}
.countbox .cb-n{font-family:var(--mono);font-size:22px;line-height:1}
.countbox .cb-l{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:9px;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>

var LS_KEY = "copywriting-os-v1";
function uid(p){ return (p||"r")+"_"+Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function shortD(iso){ if(!iso) return "—"; var d=new Date(iso.length<=10?iso+"T00:00:00Z":iso); if(isNaN(d)) return "—"; return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"}); }
function daysFrom(iso){ if(!iso) return null; var d=new Date(iso.length<=10?iso+"T00:00:00Z":iso); if(isNaN(d)) return null; var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/864e5); }
function dueLabel(due){ var d=daysFrom(due); if(d===null) return "—"; if(d<0) return Math.abs(d)+"d overdue"; if(d===0) return "due today"; if(d===1) return "due tomorrow"; return "in "+d+"d"; }

    settings:{name:"",audience:"Founders of B2B service businesses who sell expertise — coaches, consultants, fractional executives.",positioning:"I help expertise-led businesses say what they actually do — so the right visitors recognise themselves and enquire.",coreService:"Homepage Message Audit (fixed scope, £450)",objective:"Book three audits this quarter and convert two into longer projects.",sampleData:true,onboarded:false},

    insights:[
      {id:"ins_cred",createdAt:D(2026,1,12),updatedAt:D(2026,1,20),title:"Expert-service sites open with credentials instead of the costly problem",notes:"Reviewed 11 homepages of executive coaches. 9 of 11 open with certification and biography. Only 2 name a specific costly problem above the fold.",source:"Own audit notes, 11 sites",category:"Positioning",entryType:"observation",evidence:"observed",implication:"A homepage headline audit is a credible, low-friction door-opener.",proposedAction:"Build the 7-Question Clarity Check around this finding.",status:"actionable",tags:["homepage","positioning"],links:[{type:"offer",id:"off_clarity"}]},
      {id:"ins_revenue",createdAt:D(2026,1,10),updatedAt:D(2026,1,18),title:"Buyers describe the problem as lost revenue, never as 'messaging'",notes:"In 6 discovery conversations the word 'messaging' never appeared unprompted. Owners said 'we lose deals to someone cheaper' or 'people don't get what we do until call two'.",source:"Discovery calls Nov–Jan",category:"Buyer psychology",entryType:"client insight",evidence:"proven",implication:"My marketing must translate copy problems into commercial losses.",proposedAction:"Rewrite the audit page to lead with the lost-deal symptom.",status:"implemented",tags:["messaging"],links:[{type:"offer",id:"off_audit"}]},
      {id:"ins_teardown",createdAt:D(2026,1,14),updatedAt:D(2026,1,21),title:"Teardown-first emails get replies. Pitch-first emails get silence.",notes:"24 pitch-first emails in December: 1 reply. 19 teardown-first in January: 6 replies, 3 calls. The teardown contains three specific observations before any mention of a service.",source:"Outreach log",category:"Outreach",entryType:"market signal",evidence:"observed",implication:"Leading with specific unpaid observation is the mechanism.",proposedAction:"Make teardown-first the default format.",status:"actionable",tags:["outreach"],links:[{type:"offer",id:"off_tpl"}]},
