<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1917" />
<title>Speak in 60 — 60-Day Communication Training Plan</title>
<meta name="description" content="Interactive 60-day small talk + public speaking training tracker for an introverted freelancer. Saves in your browser; download/upload progress anytime." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
<style>
:root{
  --paper:#f7f4ee;--ink:#1c1917;--muted:#78716c;--faint:#a8a29e;--line:#e7e5e4;--line2:#f5f5f4;--card:#fff;
  --moss:#2f7f72;--moss-d:#23665c;--moss-l:#eef6f4;--moss-m:#d6eae5;--moss-t:#7dbcaf;
  --amber:#d97706;--amber-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;--blue:#0284c7;--blue-l:#e0f2fe;--violet:#7c3aed;--violet-l:#ede9fe;--green:#059669;--green-l:#d1fae5;--rose:#e11d48;--rose-l:#ffe4e6;
  --r:14px;--r-sm:10px;--sh:0 1px 2px rgba(28,25,23,.05);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:var(--serif);letter-spacing:-.01em;font-weight:600;line-height:1.15}
a{color:var(--moss-d)}
code{background:var(--line2);padding:1px 5px;border-radius:5px;font-size:.85em}
.hide{display:none!important}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(247,244,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:17px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--moss-d);color:#fff;display:grid;place-items:center;font-size:16px}
.daypill{background:var(--ink);color:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.shell{display:flex;min-height:100dvh}
.side{display:none}
main{flex:1;min-width:0;padding:16px 14px calc(84px + env(safe-area-inset-bottom));max-width:1120px;margin:0 auto;width:100%}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:10px;font-weight:500;color:var(--muted)}
.bottomnav button .ic{font-size:18px;line-height:1}
.bottomnav button.on{color:var(--moss-d)}
@media(min-width:960px){
  .topbar,.bottomnav{display:none}
  .side{display:flex;flex-direction:column;width:250px;flex-shrink:0;position:sticky;top:0;height:100dvh;background:rgba(255,255,255,.7);border-right:1px solid var(--line);padding:22px 12px 12px}
  .side .brand{padding:0 8px 18px;font-size:19px}.side .brand .logo{width:38px;height:38px;border-radius:11px;font-size:19px}
  .side nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .side nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);text-align:left}
  .side nav button:hover{background:var(--line2);color:var(--ink)}
  .side nav button.on{background:var(--moss-l);color:var(--moss-d)}
  .side .progbox{background:var(--ink);color:#fff;border-radius:16px;padding:14px;font-size:11px;color:#a8a29e}
  .side .progbox b{display:block;color:#fff;font-family:var(--serif);font-size:24px;font-weight:600}
  main{padding:28px 32px 48px}
}
.progbox .bar{background:#44403c;margin:8px 0 6px}.progbox .bar i{background:var(--moss-t)}

/* ---------- primitives ---------- */
.page{display:flex;flex-direction:column;gap:16px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.h1{font-size:clamp(24px,5vw,32px);margin-top:3px}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h h3{font-size:17px}.card-h .sub{margin:0;font-size:13px}
.card-b{padding:14px 16px}
.card-b.tight{padding:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.g4{grid-template-columns:repeat(4,1fr)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-weight:600;font-size:14px;padding:0 14px;height:40px;transition:.15s;white-space:nowrap}
.btn.p{background:var(--moss-d);color:#fff}.btn.p:hover{background:#1d524a}
.btn.s{background:var(--line2);color:var(--ink)}.btn.s:hover{background:var(--line)}
.btn.o{border:1px solid #d6d3d1;background:#fff}.btn.o:hover{background:var(--line2)}
.btn.g{color:var(--muted)}.btn.g:hover{background:var(--line2);color:var(--ink)}
.btn.d{background:var(--red);color:#fff}
.btn.w{background:#fff;color:var(--ink)}.btn.wt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn.sm{height:32px;font-size:12px;padding:0 10px;border-radius:9px}.btn.lg{height:48px;font-size:15px;padding:0 20px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--line2);color:#57534e;white-space:nowrap}
.badge.moss{background:var(--moss-m);color:var(--moss-d)}.badge.amber{background:var(--amber-l);color:#92400e}.badge.red{background:var(--red-l);color:#b91c1c}.badge.blue{background:var(--blue-l);color:#075985}.badge.violet{background:var(--violet-l);color:#5b21b6}.badge.green{background:var(--green-l);color:#065f46}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.lbl small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;background:#fff;min-height:40px}
.in:focus{outline:none;border-color:var(--moss-t);box-shadow:0 0 0 3px var(--moss-m)}
textarea.in{min-height:72px;resize:vertical}
.in.xs{min-height:34px;padding:5px 9px;font-size:13px}
.field{display:flex;flex-direction:column}
.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:999px;transition:width .4s}
.bar.amber i{background:var(--amber)}.bar.stone i{background:#a8a29e}.bar.thin{height:5px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--line2);padding:4px;border-radius:12px;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.tabs button .n{background:var(--line);border-radius:999px;font-size:10px;padding:1px 6px}
.tabs button.on .n{background:var(--moss-m);color:var(--moss-d)}
.empty{border:1px dashed #d6d3d1;background:#fafaf9;border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.stat{padding:14px}
.stat .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:28px;font-weight:600;margin-top:2px}
.stat .s{font-size:11px;color:var(--muted);margin-top:2px}
.stat.good .v{color:#047857}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--moss-d)}
input[type=range]{accent-color:var(--moss);width:100%}
.scores{display:flex;flex-wrap:wrap;gap:4px}
.scores button{min-width:30px;height:30px;padding:0 6px;border-radius:7px;background:var(--line2);font-size:12px;font-weight:700;color:#57534e}
.scores button.on{background:var(--moss-d);color:#fff}
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;font-weight:700}
.notice{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid;text-align:left;width:100%}
.notice .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.notice b{display:block;font-size:14px}.notice small{font-size:12px;opacity:.8}
.notice.amber{background:var(--amber-l);border-color:#fde68a;color:#78350f}.notice.amber .ico{background:var(--amber);color:#fff}
.notice.stone{background:#fff;border-color:var(--line)}.notice.stone .ico{background:var(--ink);color:#fff}
.notice.ok{background:var(--green-l);border-color:#a7f3d0;color:#065f46}.notice.err{background:var(--red-l);border-color:#fecaca;color:#991b1b}

/* tasks */
.task{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px}
.task:hover{background:#fafaf9}
.task.done{opacity:.6}
.task .box{margin-top:3px;width:20px;height:20px;flex-shrink:0;border:2px solid #d6d3d1;border-radius:6px;display:grid;place-items:center;background:#fff;font-size:12px;color:#fff}
.task.done .box{background:var(--moss-d);border-color:var(--moss-d)}
.task .kind{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex-shrink:0;margin-top:1px}
.task p{font-size:14px;line-height:1.45}
.task.done p{text-decoration:line-through;text-decoration-color:#a8a29e}
.task .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:3px}
.task .meta button{color:var(--moss);font-weight:700;text-transform:none;letter-spacing:0;font-size:11.5px}
.task .meta button:hover{text-decoration:underline}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--ink);color:#fff;padding:22px 20px}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(47,127,114,.35);filter:blur(50px)}
.hero .eyebrow{color:var(--moss-t)}
.hero h1{font-size:clamp(26px,6vw,38px);margin-top:6px}
.hero h1 em{color:var(--moss-t);font-style:normal}
.hero .theme{color:#d6d3d1;font-size:14px;margin-top:10px;max-width:560px}
.hero .date{color:#a8a29e;font-size:13px;margin-top:2px}
.hero .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.hero .prog{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:13px;color:#a8a29e}
.hero .prog b{color:#fff;font-weight:600;display:block}
@media(min-width:720px){.hero{padding:28px 30px}.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.hero .prog{margin-top:0}}

/* week chips */
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.weeks::-webkit-scrollbar{display:none}
.weeks button{flex-shrink:0;min-width:112px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px}
.weeks button small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.weeks button b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weeks button .bar{margin-top:7px;height:4px}
.weeks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.weeks button.on small{color:var(--moss-t)}.weeks button.on .bar{background:rgba(255,255,255,.2)}
.weekhead{background:linear-gradient(135deg,var(--moss-l),#fff);padding:18px 16px}
.weekmeta{display:grid;gap:12px;padding:14px 16px;border-top:1px solid var(--line2);font-size:13px}
@media(min-width:720px){.weekmeta{grid-template-columns:repeat(3,1fr)}}
.weekmeta .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.daycard{display:flex;flex-direction:column}
.daycard.today{box-shadow:0 0 0 2px var(--moss),0 0 0 4px var(--paper)}
.daycard.focus{box-shadow:0 0 0 2px var(--amber),0 0 0 4px var(--paper)}
.daycard.complete{background:#f4faf8}
.daynum{width:36px;height:36px;border-radius:11px;background:var(--line2);display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:600;flex-shrink:0}
.daynum.done{background:var(--moss-d);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.chips span{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.chips .soc{background:var(--blue-l);color:#075985}.chips .rec{background:var(--rose-l);color:#9f1239}
.notebox{border-top:1px solid var(--line2);padding:8px 12px}
.notebox textarea{font-size:13px;min-height:56px}

/* tables → cards on mobile */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;background:#fafaf9;font-weight:700}
.tbl td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl .act{white-space:nowrap;text-align:right}
.tbl .act button{padding:5px;border-radius:6px;color:var(--faint);font-size:14px}.tbl .act button:hover{background:var(--line2);color:var(--ink)}
.tblwrap{overflow-x:auto}
@media(max-width:700px){
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody,.tbl.resp tr,.tbl.resp td{display:block;width:100%}
  .tbl.resp tr{border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .tbl.resp td{border:0;padding:2px 0;font-size:13px}
  .tbl.resp td::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .tbl.resp td.wide{grid-column:1/-1}
  .tbl.resp td.act{grid-column:1/-1;text-align:right;padding-top:6px}
  .tbl.resp td.act::before{display:none}
}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(28,25,23,.45);backdrop-filter:blur(3px)}
#modal.open{display:flex}
.dlg{background:#fff;width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){#modal{align-items:center;padding:20px}.dlg{border-radius:20px}}
.dlg-h{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);z-index:1}
.dlg-h h3{font-size:18px}
.dlg-b{padding:18px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.dlg-b .full{grid-column:1/-1}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 18px}
.counter{grid-column:1/-1;background:#fff1f2;border:1px solid #fecdd3;border-radius:16px;padding:14px;text-align:center}
.counter .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#be123c}
.counter .btns{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
.counter .big{width:92px;height:92px;border-radius:50%;background:var(--rose);color:#fff;font-size:34px;font-weight:700;box-shadow:0 8px 20px rgba(225,29,72,.3)}
.counter .big:active{transform:scale(.95)}
.counter .pm{width:46px;height:46px;border-radius:50%;background:#fff;color:#be123c;border:1px solid #fecdd3;font-size:20px}
.counter .foot{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#be123c}

/* impromptu */
.imp{text-align:center;padding:28px 18px;border-radius:var(--r) var(--r) 0 0;transition:.3s}
.imp.speak{background:var(--ink);color:#fff}.imp.prep{background:var(--amber-l)}.imp.done{background:var(--moss-l)}
.imp h2{font-size:clamp(20px,5vw,28px);margin:14px auto;max-width:520px;min-height:2.4em}
.imp .time{font-family:var(--serif);font-size:clamp(48px,14vw,68px);font-weight:600;font-variant-numeric:tabular-nums}
.imp.speak .time.low{color:#f87171}
.imp .bar{max-width:360px;margin:8px auto 0}.imp.speak .bar{background:rgba(255,255,255,.2)}
.imp .rec{position:absolute;top:14px;right:14px;width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.topics li{display:flex;gap:10px;padding:9px 16px;border-top:1px solid var(--line2);font-size:14px;align-items:flex-start}
.topics li.used{color:var(--faint)}.topics li.cur{background:var(--amber-l);font-weight:600}
.topics li .n{color:var(--faint);font-size:12px;width:18px;flex-shrink:0;margin-top:2px}
.topics li button{margin-left:auto;color:var(--moss);font-size:12px;font-weight:700}
.quote{border-left:4px solid var(--moss-t);background:#fafaf9;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.55}
.ol{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ol li{display:flex;gap:10px}
.ol li .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--line2);font-size:11px;font-weight:700;display:grid;place-items:center}
.ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ul li{display:flex;gap:10px}.ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--moss);flex-shrink:0;margin-top:8px}
.kit label{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line2);cursor:pointer;align-items:flex-start}
.kit label input{margin-top:3px;width:17px;height:17px;accent-color:var(--moss-d)}
.kit label.done .t{text-decoration:line-through;color:var(--faint)}
.kit .t{font-size:14px;font-weight:500}.kit .u{font-size:12px;color:var(--muted)}
.kit .c{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.rules{display:grid}
@media(min-width:720px){.rules{grid-template-columns:repeat(3,1fr)}}
.rules div{padding:16px;border-top:1px solid var(--line2)}
.rules .n{font-family:var(--serif);font-size:28px;color:var(--moss);font-weight:600}
.gate li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.gate li .d{font-size:12px;color:var(--muted)}
.gate li .st{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:2px}
.st.ok{background:var(--green)}.st.no{background:#f87171}.st.na{background:#d6d3d1}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.tally{grid-template-columns:repeat(3,1fr)}}
.tally div{background:#fafaf9;border-radius:10px;padding:8px 10px}

/* impromptu timer */
const IMP={topic:null,phase:'idle',sec:0,len:90,used:[],pausedFrom:'prep',timer:null};
function impStop(){if(IMP.timer){clearInterval(IMP.timer);IMP.timer=null}}
function impTick(){IMP.sec=Math.max(0,IMP.sec-1);if(IMP.sec===0){if(IMP.phase==='prep'){IMP.phase='speak';IMP.sec=IMP.len}else{IMP.phase='done';impStop()}render();return}
 const t=$('#imp-time'),b=$('#imp-bar');if(t){t.textContent=fmtT(IMP.sec);t.classList.toggle('low',IMP.phase==='speak'&&IMP.sec<=10)}if(b)b.style.width=(impPct()*100)+'%'}
function impStart(){impStop();IMP.timer=setInterval(impTick,1000)}
const fmtT=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
const impPct=()=>IMP.phase==='speak'?1-IMP.sec/IMP.len:IMP.phase==='prep'?1-IMP.sec/5:IMP.phase==='done'?1:0;
function impPick(t){if(!t){const pool=TOPICS.filter(x=>!IMP.used.includes(x));const src=pool.length?pool:TOPICS;t=src[Math.floor(Math.random()*src.length)];if(!pool.length)IMP.used=[]}IMP.topic=t;if(!IMP.used.includes(t))IMP.used.push(t);IMP.phase='prep';IMP.sec=5;impStart();render()}

  <h2>${IMP.topic?esc(IMP.topic):'Your topic will appear here'}</h2>

   ${IMP.topic?`<button class="btn ${p==='speak'?'wt':'g'} lg" data-act="imp-reset">↺</button>`:''}</div>
  ${p==='speak'?'<span class="rec"></span>':''}</div>
  <div class="row between" style="padding:10px 16px;border-top:1px solid var(--line2);font-size:13px"><span style="color:var(--muted)">Length:</span><div class="row" style="gap:4px">${[60,90,120].map(l=>`<button class="btn ${IMP.len===l?'p':'s'} sm" data-act="imp-len" data-l="${l}">${l}s</button>`).join('')}</div><span style="font-size:12px;color:var(--faint);margin-left:auto">${IMP.used.length}/${TOPICS.length} used this session</span></div></div>

function toMarkdown(){

 SKILLS.forEach((k,i)=>L.push(`| ${i+1} | ${k} | ${RCOLS.map(c=>s.rubric[c][i]??'').join(' | ')} |`));
 L.push('','## Weekly Reviews','');
 Object.entries(s.weeklyReviews).forEach(([w,r])=>L.push(`### Week ${w}${r.completedAt?' ✓':''}`,'',`- Reps done vs planned: ${r.repsDone}/${r.repsPlanned} · Recording reps: ${r.recDone}/${r.recPlanned} · Reading done? ${r.reading?'Y':'N'}`,`- Best moment: ${r.best}`,`- Worst moment: ${r.worst}`,`- Rate the week: ${r.rating}/10 — ${r.reason}`,`- Keep: ${r.keep}`,`- Drop: ${r.drop}`,`- Slipped because: ${r.slipped}`,`- Next week scheduled? ${r.scheduled?'Y':'N'}`,''));
 L.push('## Day-30 self-assessment','');s.d30Answers.forEach((a,i)=>L.push(`${i+1}. ${D30Q[i]}\n   ${a}`));
 L.push('','## Day-60 self-assessment','');s.d60Answers.forEach((a,i)=>L.push(`${i+1}. ${D60Q[i]}\n   ${a}`));

function download(name,content,type='application/json'){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function importFile(file){try{const p=JSON.parse(await file.text());const d=p.data&&typeof p.data==='object'?p.data:p.state&&typeof p.state==='object'?p.state:p;
 if(!d||typeof d!=='object'||!('taskDone'in d||'socialReps'in d||'recordings'in d))throw new Error("This doesn't look like a Speak in 60 backup file.");
 const sm=`${Object.keys(d.taskDone||{}).length} tasks, ${(d.socialReps||[]).length} reps, ${(d.recordings||[]).length} recordings`;
 if(!confirm(`Replace your current progress with this backup?\n\nBackup contains: ${sm}.\n\nThis cannot be undone (download a backup of the current state first if unsure).`))return;
 S=merge(initial(),d);save();dataMsg={kind:'ok',text:`Progress restored — ${sm}.`}}catch(e){dataMsg={kind:'err',text:e.message||'Could not read that file.'}}render()}

 copy:el=>{navigator.clipboard&&navigator.clipboard.writeText(el.dataset.text);el.textContent='✓ Copied';setTimeout(()=>el.textContent='📋 Copy',1500)},
 'listener-add':()=>{S.listeners.push({id:uid(),name:'',asked:false,slot1:'',slot2:'',confirmed:false,note:''});save();render()},
 'listener-del':el=>{S.listeners=S.listeners.filter(l=>l.id!==el.dataset.id);save();render()},
 'fb-new':el=>fbModal(+el.dataset.t),
 'fb-save':()=>{const d=formData();S.feedback.push({id:uid(),talk:+d.talk,listener:d.listener||'',q1:d.q1||'',q2:d.q2||'',q3:d.q3||'',pace:+d.pace,clarity:+d.clarity,q5:d.q5||''});save();closeModal();render()},
 'fb-del':el=>{S.feedback=S.feedback.filter(f=>f.id!==el.dataset.id);save();render()},
 'export-json':()=>{download(`comm-training-backup-${todayISO().replace(/-/g,'')}.json`,JSON.stringify({app:'comm-training-60',exportedAt:new Date().toISOString(),data:S},null,2));dataMsg={kind:'ok',text:'Backup downloaded. Keep it in ~/comm-training/.'};render()},
 'export-md':()=>{download(`comm-training-logs-${todayISO().replace(/-/g,'')}.md`,toMarkdown(),'text/markdown');dataMsg={kind:'ok',text:'Markdown export downloaded.'};render()},
 'import-pick':()=>$('#file-in').click(),
 'reset-start':()=>{S.startDate=DEFAULT_START;save();render()},'clear-today':()=>{S.todayOverride='';save();render()},
 'reset-all':()=>{if(confirm('Delete ALL progress in this browser? This cannot be undone.')&&confirm('Really? Last chance.')){S=initial();save();dataMsg={kind:'ok',text:'Progress reset.'};render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('submit',e=>e.preventDefault()); // Enter inside modal forms must never reload the page
document.addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// two-way binding: text-ish inputs save on input (no re-render); checkboxes/selects/dates save on change
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;if(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date'||el.type==='datetime-local')return;setPath(el.dataset.bind,el.value);save()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&el.dataset.actChange){const a=el.dataset.actChange;if(a==='filter-social')logFilter.social=el.value;if(a==='filter-rec')logFilter.rec=el.value;if(a==='kit'){S.toolkitChecked[el.dataset.id]=el.checked;save()}render();return}
 if(!el.dataset||!el.dataset.bind)return;
 let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.type==='numnull')v=v===''?null:+v;if(el.dataset.type==='num')v=+v;
 if(el.dataset.bind==='startDate'&&!v)return; // never allow a blank start date
 setPath(el.dataset.bind,v);save();if(el.dataset.rr==='1')render()});
document.addEventListener('change',e=>{if(e.target.id==='file-in'&&e.target.files[0])importFile(e.target.files[0])});
document.addEventListener('dragover',e=>{const d=$('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=$('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=$('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)importFile(f)});


/* ---------- boot ---------- */
parseHash();render();
</script>
</body>
</html>
