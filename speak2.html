<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#0f172a" name="theme-color"/>
<title>Speak in 60 — Elevated 60-Day Communication Tracker &amp; Practice Suite</title>
<meta content="Upgraded 60-day interactive communication practice studio and tracker with adaptive impromptu timer, quick recovery restart controls, and seamless autosaving." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-glass: rgba(255, 255, 255, 0.85);
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  
  --brand: #0f766e;
  --brand-hover: #115e59;
  --brand-light: #f0fdfa;
  --brand-ring: rgba(15, 118, 110, 0.2);
  
  --emerald: #059669;
  --emerald-light: #ecfdf5;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --rose: #e11d48;
  --rose-light: #fff1f2;
  --sky: #0284c7;
  --sky-light: #f0f9ff;
  --violet: #7c3aed;
  --violet-light: #f5f3ff;
  
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.08), 0 8px 10px -6px rgb(0 0 0 / 0.04);
  
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-serif: 'Newsreader', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: inherit; outline: none; }
h1, h2, h3, .serif { font-family: var(--font-serif); letter-spacing: -0.015em; font-weight: 600; }
a { color: var(--brand); text-decoration: none; }
code { font-family: var(--font-mono); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

/* Shell Layout */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top));
  background: rgba(248, 250, 252, 0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}
.brand-mark { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand-mark .logo-badge {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #0f766e, #134e4a);
  color: #fff; display: grid; place-items: center; font-size: 18px;
  box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
}
.day-status-pill {
  background: #0f172a; color: #fff;
  border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.02em; display: flex; align-items: center; gap: 6px;
}

.shell-container { display: flex; min-height: 100dvh; }
.sidebar { display: none; }

main.content-area {
  flex: 1; min-width: 0;
  padding: 20px 18px calc(88px + env(safe-area-inset-bottom));
  max-width: 1200px; margin: 0 auto; width: 100%;
}

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-subtle); padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav button {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px 6px; font-size: 10.5px; font-weight: 600; color: var(--text-muted);
  transition: all 0.15s ease;
}
.bottomnav button.active { color: var(--brand); transform: translateY(-1px); }
.bottomnav button .icon { font-size: 19px; }

@media (min-width: 960px) {
  .topbar, .bottomnav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; width: 270px; flex-shrink: 0;
    position: sticky; top: 0; height: 100dvh;
    background: #ffffff; border-right: 1px solid var(--border-subtle);
    padding: 24px 16px 18px;
  }
  .sidebar .brand-mark { padding: 0 8px 22px; font-size: 19px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .sidebar nav button {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: var(--radius-md);
    font-size: 14.5px; font-weight: 600; color: var(--text-muted); text-align: left;
    transition: all 0.15s;
  }
  .sidebar nav button:hover { background: #f1f5f9; color: var(--text-main); }
  .sidebar nav button.active {
    background: var(--brand-light); color: var(--brand);
    box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.2);
  }
  .sidebar .progbox {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0; border-radius: var(--radius-lg); padding: 16px;
    font-size: 12px; box-shadow: var(--shadow-md);
  }
  .sidebar .progbox b { display: block; color: #fff; font-family: var(--font-serif); font-size: 26px; }
  main.content-area { padding: 32px 36px 56px; }
}

/* Reusable Components */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap;
}
.card-header h3 { font-size: 17.5px; font-weight: 700; color: var(--text-main); }
.card-header .subtitle { font-size: 13.5px; color: var(--text-muted); margin-top: 2px; }
.card-body { padding: 18px 20px; }
.card-body.tight { padding: 8px 12px; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--radius-md); font-weight: 600; font-size: 14px;
  padding: 0 16px; height: 42px; transition: all 0.15s; white-space: nowrap;
}
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(15, 118, 110, 0.2); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.secondary { background: #f1f5f9; color: var(--text-main); }
.btn.secondary:hover { background: #e2e8f0; }
.btn.outline { border: 1px solid var(--border-strong); background: #fff; color: var(--text-main); }
.btn.outline:hover { background: #f8fafc; border-color: #94a3b8; }
.btn.ghost { color: var(--text-muted); }
.btn.ghost:hover { background: #f1f5f9; color: var(--text-main); }
.btn.danger { background: var(--rose); color: #fff; }
.btn.danger:hover { background: #be123c; }
.btn.warning { background: var(--amber); color: #fff; }
.btn.warning:hover { background: #b45309; }
.btn.white-glass { background: rgba(255, 255, 255, 0.16); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); }
.btn.white-glass:hover { background: rgba(255, 255, 255, 0.28); }
.btn.sm { height: 34px; font-size: 12.5px; padding: 0 12px; border-radius: var(--radius-sm); }
.btn.lg { height: 50px; font-size: 15.5px; padding: 0 24px; border-radius: 14px; }
.btn.full { width: 100%; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; background: #f1f5f9; color: var(--text-muted);
}
.badge.brand { background: var(--brand-light); color: var(--brand); }
.badge.amber { background: var(--amber-light); color: var(--amber); }
.badge.rose { background: var(--rose-light); color: var(--rose); }
.badge.sky { background: var(--sky-light); color: var(--sky); }
.badge.violet { background: var(--violet-light); color: var(--violet); }
.badge.emerald { background: var(--emerald-light); color: var(--emerald); }

.bar { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width 0.4s ease; }
.bar.amber i { background: var(--amber); }
.bar.rose i { background: var(--rose); }

/* Hero Card */
.hero-banner {
  position: relative; overflow: hidden;
  border-radius: 24px; background: linear-gradient(135deg, #090d16 0%, #0f172a 60%, #134e4a 100%);
  color: #fff; padding: 26px 24px; box-shadow: var(--shadow-xl);
}
.hero-banner::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 280px; height: 280px;
  border-radius: 50%; background: radial-gradient(circle, rgba(15, 118, 110, 0.45) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5eead4; }
.hero-title { font-size: clamp(26px, 5.5vw, 38px); margin-top: 6px; line-height: 1.15; }
.hero-title em { color: #5eead4; font-style: normal; }
.hero-theme { color: #cbd5e1; font-size: 14.5px; margin-top: 10px; max-width: 580px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; position: relative; z-index: 2; }

/* Impromptu Practice Studio & Stoppage Recovery */
.imp-box {
  border-radius: var(--radius-lg); text-align: center;
  padding: 32px 20px 24px; position: relative; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-md); overflow: hidden;
}
.imp-box.idle { background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); border: 1px solid var(--border-subtle); color: var(--text-main); }
.imp-box.prep { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 2px solid #fde68a; color: #78350f; }
.imp-box.speak { background: linear-gradient(135deg, #090d16, #0f172a); border: 2px solid #0f766e; color: #ffffff; }
.imp-box.paused { background: linear-gradient(135deg, #fff1f2, #ffe4e6); border: 2px dashed #f43f5e; color: #881337; }
.imp-box.done { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 2px solid #6ee7b7; color: #064e3b; }

.imp-status-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 999px; margin-bottom: 12px;
}
.imp-topic-display {
  font-family: var(--font-serif);
  font-size: clamp(22px, 4.5vw, 30px); margin: 12px auto; max-width: 600px; line-height: 1.25;
  min-height: 2.5em; display: flex; align-items: center; justify-content: center;
}
.imp-time-digits {
  font-family: var(--font-mono); font-size: clamp(52px, 12vw, 78px);
  font-weight: 700; line-height: 1; letter-spacing: -0.04em; margin: 8px 0;
}
.imp-box.paused .imp-time-digits { animation: blink 1.2s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.pulse-rec-dot {
  position: absolute; top: 18px; right: 18px;
  width: 14px; height: 14px; border-radius: 50%; background: #e11d48;
  box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); animation: pulseDot 1.4s infinite;
}
@keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); } 70% { box-shadow: 0 0 0 14px rgba(225, 29, 72, 0); } 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); } }

/* Stoppage Banner Alert */
.recovery-banner {
  background: #fff1f2; border: 1px solid #fecdd3; border-radius: var(--radius-md);
  padding: 14px 16px; margin: 16px 0; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; color: #9f1239;
}
.recovery-banner b { font-size: 14px; display: flex; align-items: center; gap: 8px; }

/* Interactive Tasks */
.task-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--radius-md); transition: background 0.15s;
}
.task-item:hover { background: #f8fafc; }
.task-item.is-done { opacity: 0.62; }
.task-checkbox {
  margin-top: 3px; width: 22px; height: 22px; flex-shrink: 0;
  border: 2px solid var(--border-strong); border-radius: 7px;
  display: grid; place-items: center; background: #fff; font-size: 13px; color: #fff;
  transition: all 0.15s ease;
}
.task-item.is-done .task-checkbox { background: var(--brand); border-color: var(--brand); }
.task-kind-icon {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  font-size: 13px; flex-shrink: 0; margin-top: 1px;
}
.task-body p { font-size: 14px; line-height: 1.45; }
.task-item.is-done p { text-decoration: line-through; text-decoration-color: #94a3b8; }
.task-meta-bar {
  display: flex; gap: 10px; align-items: center; font-size: 11px;
  color: var(--text-faint); text-transform: uppercase; font-weight: 700; margin-top: 4px;
}
.task-meta-bar button { color: var(--brand); font-weight: 700; text-transform: none; }
.task-meta-bar button:hover { text-decoration: underline; }

/* Input Elements */
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
}
.input-control, select.input-control, textarea.input-control {
  width: 100%; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 14.5px; background: #fff; color: var(--text-main);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-control:focus {
  border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring);
}
textarea.input-control { min-height: 78px; resize: vertical; }

/* Modal */
#modal {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: flex-end; justify-content: center;
  background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
}
#modal.open { display: flex; }
.dialog-window {
  background: #fff; width: 100%; max-width: 640px; max-height: 92dvh;
  overflow-y: auto; border-radius: 24px 24px 0 0; box-shadow: var(--shadow-xl);
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@media (min-width: 640px) {
  #modal { align-items: center; padding: 24px; }
  .dialog-window { border-radius: 20px; }
}
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dialog-header {
  position: sticky; top: 0; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 22px; border-bottom: 1px solid var(--border-subtle); z-index: 2;
}
.dialog-body { padding: 20px 22px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.dialog-body .full { grid-column: 1 / -1; }
.dialog-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 0 22px 20px; }

/* Tap Counter Widget */
.counter-box {
  grid-column: 1 / -1; background: #fff1f2; border: 1px solid #fecdd3;
  border-radius: var(--radius-lg); padding: 16px; text-align: center;
}
.counter-box .title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #be123c; }
.counter-box .controls { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 12px; }
.counter-box .big-tap {
  width: 96px; height: 96px; border-radius: 50%; background: var(--rose); color: #fff;
  font-size: 36px; font-weight: 800; box-shadow: 0 8px 24px rgba(225, 29, 72, 0.35);
  transition: transform 0.08s ease;
}
.counter-box .big-tap:active { transform: scale(0.92); }
.counter-box .sub-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #be123c; border: 1px solid #fecdd3; font-size: 20px; font-weight: 700; }

/* Table responsive */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); text-align: left; padding: 10px 12px; background: #f8fafc; font-weight: 700; }
.tbl td { padding: 10px 12px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
@media (max-width: 720px) {
  .tbl.resp thead { display: none; }
  .tbl.resp, .tbl.resp tbody, .tbl.resp tr, .tbl.resp td { display: block; width: 100%; }
  .tbl.resp tr { border-top: 1px solid var(--border-subtle); padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .tbl.resp td { border: 0; padding: 2px 0; }
  .tbl.resp td::before { content: attr(data-l); display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-faint); }
  .tbl.resp td.wide { grid-column: 1 / -1; }
  .tbl.resp td.act { grid-column: 1 / -1; text-align: right; }
  .tbl.resp td.act::before { display: none; }
}

/* Tabs & Chips */
.tabs-scroll { display: flex; gap: 6px; overflow-x: auto; background: #f1f5f9; padding: 5px; border-radius: var(--radius-md); }
.tabs-scroll button {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--text-muted);
}
.tabs-scroll button.active { background: #fff; color: var(--text-main); box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<header class="topbar">
<div class="brand-mark" data-act="nav" data-to="dashboard" style="cursor:pointer">
<div class="logo-badge">🎙️</div>
<span>Speak in 60</span>
</div>
<div class="day-status-pill" id="pill-mobile">Day 1</div>
</header>
<div class="shell-container">
<aside class="sidebar">
<div class="brand-mark" data-act="nav" data-to="dashboard" style="cursor:pointer">
<div class="logo-badge">🎙️</div>
<div>
<span>Speak in 60</span>
<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase">Studio Edition</div>
</div>
</div>
<nav id="desktop-nav"></nav>
<div class="progbox">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8">Progress</span>
<b id="pill-desktop" style="font-size:18px">Day 1</b>
</div>
<div class="bar" style="height:6px;background:#334155;margin:10px 0 6px"><i id="prog-bar" style="width:0%;background:#2dd4bf"></i></div>
<span id="prog-label" style="font-size:11.5px;color:#cbd5e1">0/0 completed</span>
<div id="save-status" style="font-size:10.5px;color:#94a3b8;margin-top:4px">💾 Autosaves locally</div>
<button class="btn secondary sm" data-act="quick-reset-day1" style="width:100%;margin-top:10px;font-size:11px;height:28px;background:rgba(255,255,255,0.08);color:#cbd5e1;border:1px solid rgba(255,255,255,0.12)">↺ Reset to Day 1</button>
</div>
</aside>
<main class="content-area" id="app"></main>
</div>
<nav class="bottomnav" id="mobile-nav"></nav>
<div id="modal">
<div class="dialog-window" id="dialog-content"></div>
</div>
<script>
/* =========================================================
   DATE UTILITIES (Defined early for initial state)
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* =========================================================
   CORE PLAN DATA
   ========================================================= */
const KIND = {
  rec:  ['Recording rep','🎙️','#ffe4e6'], soc:['Social rep','👥','#e0f2fe'], read:['Reading','📖','#fef3c7'],
  write:['Writing','✍️','#ede9fe'], imp:['Impromptu','⚡','#ffedd5'], eval:['Evaluation','📋','#d6eae5'],
  rest: ['Rest','☕','#f5f5f4'], mile:['Milestone','🏆','#fef9c3'], chk:['Checkpoint','🚩','#fee2e2'],
  cam:  ['On camera','📹','#fae8ff'], admin:['Admin','📅','#f5f5f4'], drill:['Drill','🏋️','#ccfbf1']

/* =========================================================

const IMP = {
  topic: null,
  phase: 'idle',
  sec: 0,
  len: 90,
  prepLen: 5,
  used: [],
  timer: null,
  pauseReason: '',
  stoppageCount: 0,
  initialDuration: 90
};

function impStop(){
  if(IMP.timer){ clearInterval(IMP.timer); IMP.timer = null; }
}

function impTick(){
  if(IMP.sec > 0){
    IMP.sec--;
    if(IMP.sec === 0){
      if(IMP.phase === 'prep'){
        IMP.phase = 'speak';
        IMP.sec = IMP.len;
        impUpdateUI();
      } else if(IMP.phase === 'speak'){
        IMP.phase = 'done';
        impStop();
        impUpdateUI();
      }
      return;
    }
  }
  impUpdateUI();
}

function impStart(){
  impStop();
  IMP.timer = setInterval(impTick, 1000);
}

function impUpdateUI(){
  const t = $('#imp-time');
  const b = $('#imp-progress-bar');
  if(t) t.textContent = fmtTimer(IMP.sec);
  if(b){
    let p = 0;
    if(IMP.phase === 'prep') p = 1 - (IMP.sec / IMP.prepLen);
    else if(IMP.phase === 'speak' || IMP.phase === 'paused') p = 1 - (IMP.sec / IMP.len);
    else if(IMP.phase === 'done') p = 1;
    b.style.width = (Math.max(0, Math.min(1, p)) * 100) + '%';
  }
}

function fmtTimer(s){
  return `${Math.floor(s/60)}:${pad(s%60)}`;
}

function impPickNew(topicText = null){
  impStop();
  if(!topicText){
    const pool = TOPICS.filter(t => !IMP.used.includes(t));
    const src = pool.length ? pool : TOPICS;
    topicText = src[Math.floor(Math.random() * src.length)];
    if(!pool.length) IMP.used = [];
  }
  IMP.topic = topicText;
  if(!IMP.used.includes(topicText)) IMP.used.push(topicText);
  IMP.phase = 'prep';
  IMP.sec = IMP.prepLen;
  IMP.stoppageCount = 0;
  IMP.pauseReason = '';
  impStart();
  render();
}

function impTriggerStoppage(reason = 'Interruption or breath break'){
  if(IMP.phase === 'speak' || IMP.phase === 'prep'){
    impStop();
    IMP.phase = 'paused';
    IMP.pauseReason = reason;
    IMP.stoppageCount++;
    render();
  }
}

function impResume(){
  if(IMP.phase === 'paused'){
    IMP.phase = 'speak';
    IMP.pauseReason = '';
    impStart();
    render();
  }
}

function impRestartFresh(){
  impStop();
  IMP.phase = 'prep';
  IMP.sec = IMP.prepLen;
  IMP.pauseReason = '';
  impStart();
  render();
}

function impResetAll(){
  impStop();
  IMP.phase = 'idle';
  IMP.sec = 0;
  IMP.pauseReason = '';
  IMP.stoppageCount = 0;
  render();
}

    <button class="${currentRoute.page === n[0] ? 'active' : ''}" data-act="nav" data-to="${n[0]}">

}

function render(){
  updateSidebar();
  const pages = {
    dashboard: renderDashboard,
    plan: renderPlan,
    logs: renderLogs,
    evaluate: renderEvaluate,
    toolkit: renderToolkit,
    backup: renderBackup
  };
  const activeFn = pages[currentRoute.page] || renderDashboard;

    setTimeout(() => {

  }
}

  `);
}

    <form id="soc-form" style="display:contents">

/* =========================================================
   CLEAN DAY 1 RESET FUNCTION
   ========================================================= */
function performResetToDay1(wipeData = true){
  const todayStr = toISO(new Date());
  if(wipeData){
    S = initial();
  }
  S.startDate = todayStr;
  S.todayOverride = '';
  activePlanWeek = 1;
  save();
  navigateTo('dashboard');
  render();
}

/* =========================================================
   INTERACTION HANDLERS
   ========================================================= */
const ACTIONS = {
  nav: el => navigateTo(el.dataset.to),
  'set-plan-week': el => { activePlanWeek = +el.dataset.w; render(); },
  'toggle-task': el => {
    const id = el.dataset.id;
    if(!S.taskDone) S.taskDone = {};
    if(S.taskDone[id]) delete S.taskDone[id];
    else S.taskDone[id] = new Date().toISOString();
    save();
    render();
  },
  'modal-close': () => closeModal(),

  /* Impromptu Actions */
  'imp-pick': () => impPickNew(),
  'imp-use-topic': el => impPickNew(el.dataset.topic),
  'imp-pause': () => impTriggerStoppage('Break / User Paused'),
  'imp-resume': () => impResume(),
  'imp-restart': () => impRestartFresh(),
  'imp-reset': () => impResetAll(),
  'imp-set-len': el => {
    IMP.len = +el.dataset.len;
    IMP.initialDuration = IMP.len;
    render();
  },

  /* Modals */
  'open-modal-rec': el => openRecModal(el.dataset.scen || 'pitch60'),
  'open-modal-soc': () => openSocModal(),
  'counter-add': () => {
    const hidden = $('#counter-hidden');
    const val = $('#counter-val');
    let v = (+hidden.value || 0) + 1;
    hidden.value = v; val.textContent = v;
  },
  'counter-sub': () => {
    const hidden = $('#counter-hidden');
    const val = $('#counter-val');
    let v = Math.max(0, (+hidden.value || 0) - 1);
    hidden.value = v; val.textContent = v;
  },
  'save-recording': () => {
    const f = $('#rec-form');
    const d = Object.fromEntries(new FormData(f).entries());
    S.recordings.unshift({
      id: uid(),
      date: d.date,
      scenario: d.scenario,
      duration: +d.duration || 60,
      fillers: +d.fillers || 0,
      fix: d.fix || ''
    });
    save();
    closeModal();
    render();
  },
  'save-social-rep': () => {
    const f = $('#soc-form');
    const d = Object.fromEntries(new FormData(f).entries());
    S.socialReps.unshift({
      id: uid(),
      date: d.date,
      type: d.type,
      duration: +d.duration || 3,
      cleanExit: !!d.cleanExit,
      rating: +d.rating || 3
    });
    save();
    closeModal();
    render();
  },
  'download-json': () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `speak-in-60-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
  'quick-reset-day1': () => {
    if(confirm('Reset program to Day 1 starting today? This will calibrate today as Day 1 (Foundation · Baseline Day).')){
      performResetToDay1(false);
    }
  },
  'reset-all-data': () => {
    if(confirm('Are you sure you want to wipe all logged progress and reset cleanly to Day 1?')){
      performResetToDay1(true);
    }
  },
  'set-start-date': () => {
    const input = $('#start-date-input');
    if(input && input.value){
      S.startDate = input.value;
      S.todayOverride = '';
      save();
      render();
    }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.act];
  if(fn){
    e.preventDefault();
    fn(el);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.bind){
    let v = el.value;
    if(el.dataset.type === 'num') v = v === '' ? null : +v;
    setPath(el.dataset.bind, v);
    save();
  }
});

/* Initialize */
parseHash();
render();
</script>
</body></html>
